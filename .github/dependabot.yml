version: 2
updates:
  # npm workspaces live under barwise/ (root manifest + lockfile).
  - package-ecosystem: "npm"
    directory: "/barwise"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest and its plugins pin each other exactly (@vitest/coverage-v8
      # 4.1.11 peers on vitest 4.1.11), so they must move in one PR at every
      # update type. Bumped alone, vitest 5 lost the peer conflict and the
      # lockfile kept 4.1.11 in every package -- PR #542 went green while
      # running the old vitest. Listed first: a dependency joins the first
      # group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Group routine updates so the backlog lands as a few PRs, not dozens.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # @types/vscode is the floor of the VS Code API the extension may
      # call, so it moves with engines.vscode, never ahead of it: vsce
      # refuses to package when the types are newer than the engine
      # ("@types/vscode 1.138.0 greater than engines.vscode ^1.101.0"),
      # and CI does not run vsce -- only release.yml does. Raising both
      # drops users on older editors, so it is a deliberate change.
      - dependency-name: "@types/vscode"

  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

version: 2
updates:
  # npm workspaces live under barwise/ (root manifest + lockfile).
  - package-ecosystem: "npm"
    directory: "/barwise"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest and its plugins pin each other exactly (@vitest/coverage-v8
      # 4.1.11 peers on vitest 4.1.11), so they must move in one PR at every
      # update type. Bumped alone, vitest 5 lost the peer conflict and the
      # lockfile kept 4.1.11 in every package -- PR #542 went green while
      # running the old vitest. Listed first: a dependency joins the first
      # group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Group routine updates so the backlog lands as a few PRs, not dozens.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # @types/vscode is the floor of the VS Code API the extension may
      # call, so it moves with engines.vscode, never ahead of it: vsce
      # refuses to package when the types are newer than the engine
      # ("@types/vscode 1.138.0 greater than engines.vscode ^1.101.0"),
      # and CI does not run vsce -- only release.yml does. Raising both
      # drops users on older editors, so it is a deliberate change.
      - dependency-name: "@types/vscode"
      # TypeScript 7 is out, but typescript-eslint peers on
      # "typescript": ">=4.8.4 <6.1.0". Dependabot cannot bump across that
      # range, so every run on main ended red with "Error while updating
      # peer dependency" for typescript. Majors wait until typescript-eslint
      # supports 7; moving is a compiler migration, not a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The integration tests run on @vscode/test-cli's own mocha, which it
      # resolves from its own dependency (^11.7.6). vscode's direct `mocha`
      # is loaded by nothing (knip lists it in ignoreDependencies), so a
      # major bump here installs a second, unused copy and leaves the
      # runner where it was -- PR #548 did exactly that. Majors follow
      # test-cli.
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

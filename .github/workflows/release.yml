name: Release

# Builds the downloadable artifacts -- the VS Code extension (VSIX), the
# standalone CLI bundle, and the MCP server bundle -- with a SHA-256
# checksums file.
#
# Two triggers:
#   - release: published  -> attach assets to that versioned release
#   - push to main        -> rebuild and refresh the moving `edge`
#                            pre-release, so a current download always
#                            exists without a version tag per merge
on:
  release:
    types: [published]
  push:
    branches: [main]

# Edge builds for the same ref supersede each other; a versioned release
# runs under its own tag ref and is never cancelled by an edge build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barwise

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: barwise/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run --workspace=@barwise/cli bundle

      - run: npm run --workspace=@barwise/mcp bundle

      # Release gate: the real-use harnesses drive the just-built
      # bundles over real files, exit codes, and the stdio transport
      # (manual-test-plan spec). A failing check blocks the artifacts.
      - name: Test plan (CLI harness)
        run: ./test-plan/cli-checks.sh

      - name: Test plan (MCP harness)
        run: node test-plan/mcp-checks.mjs

      - name: Package VSIX
        working-directory: barwise/packages/vscode
        run: npx @vscode/vsce package --no-dependencies

      - name: Stage release assets
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            suffix="${tag#v}"
          else
            suffix="edge"
          fi
          mkdir -p release-assets
          cp packages/cli/dist/bundle/index.cjs "release-assets/barwise-cli-${suffix}.cjs"
          cp packages/mcp/dist/bundle/index.cjs "release-assets/barwise-mcp-${suffix}.cjs"
          cp packages/vscode/*.vsix "release-assets/barwise-vscode-${suffix}.vsix"
          # Glob only the assets so SHA256SUMS does not hash itself.
          (cd release-assets && sha256sum *.cjs *.vsix > SHA256SUMS && ls -la)

      - name: Upload to versioned release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/* --clobber --repo "${{ github.repository }}"

      # Move `edge` to the commit just built, then refresh the release.
      #
      # The tag USED to be frozen (cf748238, "stop moving the edge tag
      # (it breaks git pull)"). Frozen, it sat on a 2026-06-14 commit
      # while the assets were rebuilt on every merge, so the releases
      # page filed edge fourth -- below three versioned releases, under a
      # published date six weeks older than its own bundles -- and the
      # owner read that as the build having stopped. That is the failure
      # this reverses; docs/specs/edge-release-currency.spec.md carries
      # the measurements.
      #
      # The original reason does not hold on git 2.43.0, measured: a
      # PLAIN `git pull` exits 0 and updates main, because auto-tag-
      # following adds tags that are absent locally and skips one that
      # exists rather than clobbering it. Only an explicit `git fetch
      # --tags` is rejected, and one per-clone config line fixes that for
      # good:
      #
      #   git config --add remote.origin.fetch '+refs/tags/*:refs/tags/*'
      #
      # Do NOT reach for `fetch.pruneTags` instead: it was measured to
      # make even a plain pull fail, which is worse than the problem.
      #
      # The push comes BEFORE the release calls so a release created on a
      # first run targets a tag already pointing where it should. The
      # force is scoped to the literal ref `edge` by this command; it
      # cannot reach a version tag without this line being edited.
      - name: Move the edge tag to this commit
        if: github.event_name == 'push'
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push --force origin refs/tags/edge

      # Refresh the edge assets in place.
      # --draft=false: a release left in draft (e.g. by a manual edit in
      # the UI) is invisible and undownloadable, so every refresh
      # republishes it.
      - name: Refresh edge pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Automatically built from commit ${{ github.sha }}. Unstable preview of the latest main -- not a tagged release. For a stable build, use the latest versioned release."
          # The title carries the build date as well as the tag, because
          # the tag alone reads as a name rather than a timestamp.
          title="Edge build ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))"
          if gh release view edge --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit edge --draft=false --prerelease --notes "$notes" \
              --title "$title" --repo "${{ github.repository }}"
          else
            gh release create edge --prerelease --target "${{ github.sha }}" \
              --title "$title" --notes "$notes" \
              --repo "${{ github.repository }}"
          fi
          gh release upload edge release-assets/* --clobber \
            --repo "${{ github.repository }}"

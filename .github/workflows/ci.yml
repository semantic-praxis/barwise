name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` so a corrected description re-runs check:spec-first, which
    # reads the body from the event payload. A manual re-run of a job reuses
    # the original payload and does not see the edit (adr-batch10-enforcers
    # spec, Open decision 9).
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The Node version comes from .nvmrc, not from a matrix. It used to be a
    # single-value matrix, which put the version in the status check's name
    # ("ci (22)") and so made every upgrade also a branch-protection edit --
    # miss it and PRs block forever on a check that never reports. The check
    # is now just "ci" and the version moves in one file.
    #
    # It is pinned rather than floated because v8 coverage thresholds are not
    # portable across Node versions: V8 omits functions it never compiled
    # from its report, so Node 22 saw one function in packages/code-analysis
    # src/lsp/LspJsonRpc.ts where Node 26 sees nineteen, and the package's
    # functions percentage swung 95% to 81% on identical source.
    defaults:
      run:
        working-directory: barwise

    steps:
      # fetch-depth: 0 so the docs-only detector below can diff the PR
      # against its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The base commit this run tests the pull request against. Checkout
      # gives GitHub's synthetic merge of the pull request into its base,
      # and that merge's first parent is the base tip it merged with. The
      # event's pull_request.base.sha is not: it can name an earlier tip, so
      # after main moved, base..HEAD held main's own new commits, and the
      # tracker and plan-review gates read them as this pull request's
      # (PR #852, twice in an hour).
      - name: Base of the merge under test
        id: base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      # A pull request that touches only Markdown or beads tracker data
      # (.beads/, e.g. issues.jsonl) still needs its prose formatting
      # checked (dprint covers .md; it ignores .jsonl), but not build,
      # test, or the linters -- neither Markdown nor tracker data can
      # affect those outcomes. Detect that case and skip the heavy steps.
      # Only applies to pull_request events; pushes to main always run the
      # full pipeline. The job itself always runs, so the required check
      # always reports a result.
      - name: Detect docs-only pull request
        id: changes
        if: github.event_name == 'pull_request'
        # The two predicates -- docs_only, and optimizer (the 3.5-minute
        # optimizer lane runs only when it or the CLI it shells out to is
        # touched) -- live in scripts/lib/changed-class.mjs, which
        # `ci:local` imports, so the local runner skips exactly what this
        # job skips (barwise-954). This step runs before setup-node, on the
        # runner's own Node, which is why that file imports builtins only.
        run: node scripts/lib/changed-class.mjs '${{ steps.base.outputs.sha }}' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: barwise/package-lock.json

      # Persist Turbo's local cache across runs so unchanged packages replay
      # their build/test/lint instead of recomputing. Turbo hashes task
      # inputs per package, so the coarse restore-key is safe: only tasks
      # whose inputs match are served from cache. Keyed by commit so each run
      # writes a fresh entry; the prefix restores the most recent one.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: barwise/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # npm ci runs unconditionally: dprint (used by fmt:check below) is a
      # dev dependency.
      - run: npm ci

      # uv is a JavaScript-lane dependency now, not just the optimizer's.
      # check:beads validates the tracker through a stdlib-only Python
      # script, and the SqlglotBridge tests exercise the sqlglot tier;
      # both resolve from barwise/uv.lock. This step is UNCONDITIONAL
      # because check:beads runs on every PR including docs-only ones --
      # tracker edits ARE the docs-only case -- so gating it on
      # docs_only would break exactly the PRs it is meant to validate.
      # That is a real cost on the cheap path, accepted so that no Python
      # anywhere runs unpinned (docs/specs/python-lockfile-execution.spec.md).
      #
      # uv itself is pinned, because it is a version input like any other
      # and it was the one left floating. It comes from
      # scripts/install-uv.sh: the release tarball for this platform,
      # verified against its published digest before it is unpacked, the
      # same installer the session hook runs (python-uv-widened WS4). Not
      # `pip install uv`, which needed a bare python3 before uv existed --
      # the one exemption check:python-uv had to carry. The three behaviours
      # this design rests on -- `uv run` failing OPEN with no project,
      # `uv sync` failing closed, and `--only-group` erroring on a project
      # that does not define the group -- were verified identical on 0.8.17
      # and 0.12.7, so the pin is about reproducibility rather than a known
      # incompatibility. check:pins reads back the uv that runs against the
      # installer's VERSION.
      #
      # ~/.local/bin goes first on PATH for the rest of this step, so the
      # pinned uv answers rather than any the runner image carries, and on
      # $GITHUB_PATH for the later steps (each `run:` is its own shell).
      #
      # --locked, not --frozen: a stale lock should fail the build here
      # rather than be re-resolved silently. The sqlglot group is synced
      # up front so the eight bridge tests RUN; without it they skip, and
      # a suite that silently shrinks is the failure barwise-916 is about.
      - name: Python toolchain (uv)
        working-directory: barwise
        run: |
          bash scripts/install-uv.sh "${HOME}/.local/bin"
          export PATH="${HOME}/.local/bin:${PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          uv python install
          uv sync --locked --only-group sqlglot

      # fmt:check runs first among the checks: it is the cheapest gate and
      # historically the most common failure, and it needs only npm ci (not
      # the build), so front-loading it fails a misformatted PR in seconds
      # instead of after the build. It always runs -- dprint also formats
      # Markdown, so docs-only PRs are still gated on prose formatting.
      - run: npm run fmt:check

      # Each runtime is pinned where its tools read it, and the runtime that
      # runs is the pinned one: Node read back against .nvmrc, Python as
      # `uv python find` resolves it for the project, against
      # .python-version (pinned-runtimes, all three decisions;
      # docs/specs/runtime-pins-check.spec.md). After the Python toolchain
      # step, which installs uv and the pinned minor; no docs-only guard,
      # because every later step runs on these runtimes.
      - run: npm run check:pins

      # Validate the beads issue tracker on every PR (always runs, like
      # fmt:check, and cheap). CI checks out the post-merge tree, so this is
      # the bypass-proof half of the cross-branch guard (REPO_REVIEW F6) that
      # `git commit --no-verify` cannot skip: integrity errors (invalid JSON,
      # duplicate id, dangling dep, merge-conflict markers) and -- under
      # --strict -- a non-canonical line fail the merge.
      - name: Validate beads tracker
        run: npm run check:beads -- --strict

      # A pull request that closes an issue changes nothing but the tracker
      # (steward skill, section 5). Written down twice and enforced nowhere,
      # it was broken three times in one session and caught only by a
      # reviewer bot (barwise-i61). No docs-only guard: a spec plus a close
      # is exactly the shape it exists to stop. Pull requests only, since a
      # push to main has no base to compare against; ci-local runs it
      # against `git merge-base origin/main HEAD` instead
      # (docs/specs/tracker-only-closes.spec.md).
      - run: npm run check:tracker-closes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}

      # Every path and `node <path>` an instruction file cites resolves to a
      # tracked file. The 2026-10-04 prompt audit found 26 stale references
      # by hand (barwise-52b); this is the mechanical half of that sweep.
      # No docs-only guard: instruction files are Markdown, so a gate that
      # skipped docs-only changes would skip exactly the changes it is for
      # (docs/specs/instruction-reference-check.spec.md).
      - run: npm run check:instruction-refs

      # The package graph has one authority, INTENDED in scripts/lib/intended.cjs;
      # the root CLAUDE.md graph and each package.json runtime dependencies must
      # agree with it. No docs-only guard: the CLAUDE.md graph is Markdown, and
      # a guard would skip the very change that makes it drift
      # (docs/specs/architecture-index.spec.md, WS1).
      - run: npm run check:architecture

      # The capability matrix in the root CLAUDE.md against
      # scripts/lib/capability-map.json, which records each row's cells, and
      # the Divergence vocabulary. No docs-only guard: a docs-only change can
      # edit the matrix, and it cannot change the map or the registrations,
      # so a cell it flips disagrees with the map here. The full run, after the build, reads the
      # registrations (docs/specs/capability-matrix-check.spec.md).
      - run: npm run check:capability-matrix -- --static

      # Fast, source-only static gates next (none need the build), so a lint
      # or architecture violation fails in seconds rather than after the
      # build and test suite.
      - run: npm run oxlint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run depcruise
        if: steps.changes.outputs.docs_only != 'true'

      # Guards the gate itself: subpath-export coverage in
      # tsconfig.depcruise.json, plus a hostile-import probe proving a
      # forbidden subpath edge is actually reported (barwise-862).
      - run: npm run check:depcruise-gate
        if: steps.changes.outputs.docs_only != 'true'

      # Rules over package source that cross package boundaries, which a
      # package's vitest cannot hold because turbo caches it against that
      # package alone: who sets orm_version (schema-versioning#version-signal)
      # and who names the vendored Ossie schema, which depcruise's includeOnly
      # cannot see (ossie-interchange#peer-standard, #own-vocabulary).
      # Source only, so it runs before the build (adr-batch9-enforcers WS3).
      - run: npm run check:source-sites
        if: steps.changes.outputs.docs_only != 'true'

      # Declared must-agree copies (parity.manifest.json) stay
      # byte-identical; editing one copy without its partners fails
      # here instead of drifting silently (barwise-868).
      - run: npm run check:parity

      # review-tiers.json is a declared copy of the trigger headings in
      # .claude/skills/pr-review/checklist.md and of REVIEW.md's "Always
      # check" titles. This fails BOTH ways for each: a new
      # heading with no row is a trigger the classifier would silently
      # never fire on, and a row naming a deleted heading is a tier
      # decision applying to nothing. Exit 2 when either input cannot be
      # read, because "every row is stale" is what an unreadable checklist
      # would otherwise look like.
      - run: npm run check:review-tiers
      # The workflows that carry review-policy.md's decisions: REVIEW.md's
      # lane table against barwise/review-lanes.json and this file's `on:`,
      # the review-request job running or declared paused against an open
      # issue, nothing in the tree waiting on that reviewer, and the declared
      # readers of the review tier. No `if:` guard: its inputs are workflows,
      # scripts and REVIEW.md, and a REVIEW.md edit alone is docs-only to
      # changed-class (adr-batch10-enforcers.spec.md, WS1).
      - run: npm run check:review-workflows
      # A spec's Touches: header is its declared plan. An unmarked entry
      # that names nothing tracked is a plan that rotted, the way a
      # review-tiers glob routed nothing for five weeks (barwise-fs0).
      # A spec new since a fixed cutoff commit must also declare a tracked
      # path, or it is outside check:plan-review entirely
      # (touches-required.spec.md). The cutoff is fixed, so no base is
      # passed and a spec that reaches main by any route is checked on
      # every later run; it needs the cutoff commit, which the
      # `fetch-depth: 0` checkout provides (exit 2 without it).
      - run: npm run check:spec-touches
      # A spec new since a fixed cutoff commit (the same file-name rule as
      # the step above, a second constant) has an `## Open decisions`
      # section whose entries each say where they stand, or says only
      # `None.` (plan-before-code#open-decisions-reviewer,
      # adr-batch10-enforcers.spec.md WS2). Older specs are exempt. No `if:`
      # guard: its inputs are Markdown specs, which a docs-only change is
      # exactly the change to edit, and it needs the cutoff commit, which
      # the `fetch-depth: 0` checkout provides (exit 2 without it).
      - run: npm run check:spec-form
      # The schema differs from the latest v* tag's while CURRENT_ORM_VERSION
      # still equals what that tag wrote: the first additive change after a
      # release skipped its bump (schema-versioning#shared-minor). It reads
      # `git describe` and `git show <tag>:<path>`, so the `fetch-depth: 0`
      # checkout above must bring tags; a shallow clone or no reachable v* tag
      # refuses (exit 2). No `if:`: a docs-only change cannot move it, and a
      # step that sometimes skips is a gate that sometimes cannot answer.
      - run: npm run check:schema-bump
      # A spec's plan is reviewed (/code-review, /pr-review) before its
      # implementation is committed, recorded as `Plan-reviewed: <commit>`
      # in its header (plan-scope-check.spec.md, WS6). Wired like
      # check:tracker-closes, for the same reason: the question is about
      # what a pull request adds over its base, and a push to main has no
      # base to compare against, so pull requests only, with the base
      # commit passed in; ci-local runs it against
      # `git merge-base origin/main HEAD`. No docs-only guard: a
      # workstream whose Touches: is all skills and Markdown is
      # implementation the rule covers. It reads ancestry, which the
      # `fetch-depth: 0` checkout above makes answerable; a shallow clone
      # refuses (exit 2).
      - run: npm run check:plan-review
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}

      # A pull request that changes package source (packages/*/src) names the
      # spec it implements in its body or a commit message, or carries a
      # `No spec: <reason>` line (plan-before-code#spec-first,
      # adr-batch10-enforcers.spec.md WS3). The body reaches the script through
      # `env`, never interpolated into the shell: it is untrusted text. A null
      # body arrives as an empty string, which names nothing; an unset PR_BODY
      # refuses (exit 2). Pull requests only, as check:plan-review: it reads
      # what a pull request adds over its base, and a push to main has neither
      # base nor body. No docs-only guard: it reads the diff itself.
      - run: npm run check:spec-first
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}

      # A NUL byte makes git classify a source file as binary: no diff, no
      # blame, no review, and a patch taken from it loses changes silently.
      # Four files had reached main writing NUL as a composite-key
      # delimiter, one of them never diffable in its history. dprint, tsc,
      # eslint and oxlint all accept NUL, so nothing else catches it.
      - run: npm run check:no-nul

      # One owner lists untracked files: uncommittedPaths in
      # scripts/lib/changed-class.mjs. Each hand-written copy has shipped
      # its own defect -- the cwd's siblings missed, a newline-bearing path
      # split in two (PR #602), untracked files left out entirely (PR #641)
      # (docs/specs/pushed-tree-verification.spec.md).
      - run: npm run check:git-listing

      # npm ci installs what the lockfile says without checking it against
      # each package.json. Dependabot PR #542 declared vitest ^5.0.1 while
      # its lockfile kept 4.1.11 in all twelve packages (the coverage
      # plugin still pinned vitest 4 exactly), and every test passed on
      # the version the PR was upgrading away from. `npm ls` names each
      # such `invalid:` entry; the wrapper refuses when nothing is installed.
      - run: npm run check:lockfile

      # A credential is the one defect in this list that a follow-up commit
      # does not fix: reverting, deleting the branch and rewriting history
      # all leave the key valid and already disclosed, so it has to be
      # rotated by a person. It was also the only one with no gate --
      # `.gitignore` covering `.env` stood in for it, and cannot see the
      # three paths a secret actually arrives by here: machine-written
      # tracked files under eval-payloads/ and eval-runs/, commands pasted
      # into documentation, and fixtures imitating real payloads
      # (docs/specs/credential-scanning.spec.md).
      #
      # Detection is gitleaks': ~150 maintained rules, an entropy model and
      # per-rule allowlists, none of which this project should be writing.
      # The pin is a release tarball with a verified digest rather than a
      # third-party action, which keeps this workflow first-party `actions/*`
      # only -- the same shape as scripts/install-uv.sh's uv above. The
      # version is pinned because gitleaks ships RULES, so it decides what is
      # found; the install script is the single home for it, shared with the
      # session bootstrap.
      # Installed under $HOME rather than /usr/local/bin: that needs no
      # privileges on a hosted runner, so the step cannot fail on a
      # permission question unrelated to what it is doing. $GITHUB_PATH is
      # how the following steps see it -- each `run:` is its own shell, so
      # exporting PATH here would not carry.
      - name: Secret scanner (gitleaks)
        run: |
          bash scripts/install-gitleaks.sh "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # No docs-only skip, deliberately: two of the three paths above ARE
      # docs-only changes. The gate scans all reachable commits, which the
      # `fetch-depth: 0` checkout above makes a real history scan rather than
      # a clean bill of health over a shallow range -- it refuses outright on
      # a shallow clone. About two seconds over 1056 commits.
      - run: npm run check:secrets

      # Shell scripts were the one artifact class with no gate: not
      # dprint, not oxlint, not tsc. Three portability bugs shipped in
      # compile-runner.sh before it was read adversarially, and shellcheck
      # catches one of them (SC2144) at error severity for free. Options
      # are in .shellcheckrc; per-file exceptions are `# shellcheck
      # disable=` directives carrying a reason.
      - run: npm run check:shell
        if: steps.changes.outputs.docs_only != 'true'

      # The repo root's package.json exists only to forward `npm run` into
      # barwise/, and a forwarder list that disagrees with the real
      # package.json is worse than none: a stale entry runs nothing, and a
      # missing one restores the papercut for exactly the newest script.
      # Generated from barwise/package.json, so this fails on drift in
      # either direction rather than trusting anyone to remember.
      - run: npm run check:root-scripts
        if: steps.changes.outputs.docs_only != 'true'

      # Every Python execution resolves from the lockfile. The rule is only
      # worth what checks it: .python-version shipped while six bare python3
      # calls stood in tracked source, and nothing noticed.
      - run: npm run check:python-uv

      # A spec that says nothing has been built must not be sitting on
      # top of the commits that built it. `must-validate-outside-the-
      # rubric.spec.md` read "design only -- no implementation in this
      # PR" while two of its three workstreams were merged, and
      # `duplication-drift-guards.spec.md` said it while CLAUDE.md cited
      # its ratchet as landed and gated here. Nothing reads a spec header
      # back. Ratcheted against spec-status-baseline.json, and pinned
      # against the commit where the real one went stale by
      # test:scripts (barwise-910).
      - run: npm run audit:specs -- --check

      # Every citation of Halpin & Morgan resolves against the transcribed
      # contents in docs/halpin-morgan-3e-contents.md: the section exists,
      # a parenthetical gloss names its topic, a page span is the
      # chapter's, and the edition is the 3rd. The deck, the gym, the
      # tutorial and the reading guide all copy section numbers from it,
      # and three of them had drifted before anything read them back
      # (barwise-949). No docs-only skip: a citation edit IS a docs-only
      # change.
      - run: npm run check:book-citations

      # The correction ratchet: a spec that records what its draft got
      # wrong carries a baseline row saying what CAUGHT it. The
      # 2026-09-11 hand pass over 28 specs found roughly three quarters
      # of spec defects were caught by executing something and that
      # verbosity caused none -- a reading that started decaying the
      # moment it was written, because the next spec to record a
      # correction was outside it. Fails on a new unclassified record AND
      # on a row no longer detected (barwise-1013). No docs-only skip: a
      # spec edit IS the change this gate checks.
      - run: npm run audit:corrections -- --check

      # The rules about findings, over all five audit baselines at once
      # (docs/specs/audit-finding-reader.spec.md): an open row names a live
      # issue, no row keeps its placeholder, every verdict is in its
      # audit's vocabulary. Reads JSON and the tracker only, so no build
      # and no docs-only skip: a baseline edit IS the change it checks.
      - run: npm run check:findings

      # The gates' own tests. Every enumerating gate is proven to report
      # the same coverage from three different cwds (barwise-905: one of
      # them silently scanned 1426 of 1483 files under `npm run`), and
      # every gate here is shown RED on a defect planted where that gate
      # actually looks -- staged in a throwaway repo, not merely written
      # to disk (barwise-906: a NUL probe that was never `git add`ed, so
      # the gate could not see it and reported OK).
      - run: npm run test:scripts
        if: steps.changes.outputs.docs_only != 'true'

      # The duplication ratchet: every candidate the deterministic
      # detectors surface carries a verdict in audit-baseline.json, and
      # the check fails on a new unclassified candidate AND on a stale
      # entry for a resolved finding -- so the baseline's tracked rows
      # always enumerate the open detectable findings (barwise-871).
      - run: npm run audit:duplication -- --check

      - run: npm run purity
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run lint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run build
        if: steps.changes.outputs.docs_only != 'true'

      # constraint-coverage-policy: the inventory's rows against the eval
      # suite and the ADR's tiers. Uncached, because its inputs (promptlab's
      # evals/, the ADR, the inventory spec) are outside any package's turbo
      # key; after the build, because it imports core and learn and refuses
      # without them. The inventory spec is in GATE_INPUT, so a change to it
      # alone is not docs-only (adr-batch9-enforcers WS5).
      - run: npm run check:eval-coverage
        if: steps.changes.outputs.docs_only != 'true'

      # Each matrix row against what the CLI, the MCP server and the VS Code
      # extension register, read from the build (surface-capability-parity,
      # decisions 1 to 3).
      - run: npm run check:capability-matrix
        if: steps.changes.outputs.docs_only != 'true'

      # The vscode package's own type-checks. Every other package builds
      # with tsc, so its build is its type-check; this one builds with
      # esbuild, which strips types unchecked, so both tsconfigs had gone
      # red on main with nothing to say so (barwise-iii). After build,
      # because tsc reads the dependencies' dist. Two steps so a failure
      # names the tsconfig (docs/specs/vscode-typecheck-in-ci.spec.md).
      - run: npm run --workspace=barwise-vscode check
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run --workspace=barwise-vscode check:webview
        if: steps.changes.outputs.docs_only != 'true'

      # The optimizer lane, which until now ran in no CI at all. Its own
      # spec called the guard "the Python lane has its own pytest run,
      # executed by hand" -- and a hand-run guard is run when someone
      # remembers. It did not hold: the loader round trip, the test that
      # caught the missing `match` block, sat red from the day the
      # haiku45-2 variant shipped until it was noticed by accident weeks
      # later (barwise-900).
      #
      # `uv python install` reads .python-version beside .nvmrc, so the
      # interpreter is pinned the same way the runtime is. It is not a
      # style preference: uv.lock resolved TWO dependency sets, branching
      # on `python_full_version < '3.12'`, so `--frozen` was honoured and
      # still produced numpy 2.4.6 locally against 2.5.2 here, from one
      # commit. The lock now carries a single resolution.
      #
      # After build, because the metric tests shell out to the real
      # `packages/cli/dist` rather than mocking it. `--frozen` respects
      # the committed uv.lock rather than re-resolving, which is the same
      # reason the lock is committed: a compile costs money, so pin what
      # produced it. uv comes from scripts/install-uv.sh's verified release
      # tarball (the Python toolchain step) rather than a third-party
      # action -- this workflow uses first-party `actions/*` only, and
      # widening that is not this change's call.
      #
      # working-directory is `barwise/`, not `barwise/optimizer/`: the
      # project moved up so that it is an ancestor of every workspace
      # package. `uv run` finds a project by walking UP from the cwd, and
      # it does NOT fail when it finds none -- it silently runs an
      # unpinned interpreter with no lock. From `barwise/packages/formats`
      # the old location was a sibling, so every `--frozen` invocation
      # there would have looked compliant and resolved nothing
      # (docs/specs/python-lockfile-execution.spec.md).
      #
      # `--locked` rather than `--frozen` here: it additionally asserts
      # the lock would not change, so a stale uv.lock fails the build
      # instead of being re-resolved silently. Code and scripts use
      # `--frozen`, which does not block a developer mid-edit.
      # An npm script rather than the `uv` lines inline, because
      # `ci:local` derives its gate list from `run: npm ...` steps and a
      # multi-line `run: |` block is invisible to it -- which is how a
      # change to the CLI seam this suite shells out to reached CI red
      # after every local gate passed (PR #422). The lock is asserted
      # `--locked` by the sqlglot step above; `uv run` syncs the dev extra
      # itself.
      #
      # It also carries the docs-only guard, because it needs the build
      # that guard skips. Without it a Markdown-only change under
      # `barwise/optimizer/` set both `docs_only` and `optimizer`, skipped
      # `npm run build`, and ran this suite against a missing
      # `packages/cli/dist`: 18 failed, 6 errors, "No barwise CLI found"
      # (PR #590).
      - name: Optimizer lane (Python)
        if: steps.changes.outputs.optimizer == 'true' && steps.changes.outputs.docs_only != 'true'
        run: npm run test:optimizer

      # The rubric ratchet: every eval check that survives the mutation
      # its own kind is about carries a verdict in rubric-baseline.json,
      # and the check fails on a newly non-discriminating check AND on a
      # stale entry for a fixed one. A check that cannot fail banks a
      # guaranteed point instead of measuring, which is barwise-894,
      # -901 and -902 (barwise-903). Runs after build: it scores through
      # the built promptlab, so it carries the same docs-only guard.
      - run: npm run audit:rubric -- --check
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run --workspace=@barwise/mcp bundle
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run --workspace=@barwise/cli bundle
        if: steps.changes.outputs.docs_only != 'true'

      # Smoke-test the standalone CLI bundle so a broken bundle fails CI,
      # not a release.
      - name: Smoke-test CLI bundle
        if: steps.changes.outputs.docs_only != 'true'
        run: node packages/cli/dist/bundle/index.cjs --version

      # The two release-gate harnesses, which are the fuller version of the
      # `--version` smoke test above and were released-only until now
      # (barwise-992). They drive the bundles the way a user would: 30
      # checks across every CLI command, 16 across the MCP tool surface.
      #
      # THEY RAN ONLY ON PUSH-TO-MAIN AND ON RELEASE, so a fully green PR
      # could merge and then fail the release build -- after review was
      # over and with nobody watching. That is the whole reason for moving
      # them left; the cost is not the argument, it is what makes the
      # argument cheap.
      #
      # Both objections in `docs/specs/archive/manual-test-plan.spec.md`'s
      # "not yet" were measured and had dissolved. The bundles are already
      # built two steps up, so the marginal cost is the harnesses alone:
      # 13s and 1s, against a gate list of about 2m40s. The LLM-gated steps
      # SKIP without a provider key rather than failing, which the same
      # spec chose three bullets below the objection -- verified here as
      # 30 passed / 0 failed / 1 skipped and 16 / 0 / 1 with no key set.
      #
      # Ten runs of each before wiring them in, because 14 seconds that
      # goes spuriously red is not cheap: 20 of 20 exited 0 with
      # byte-identical result lines, 12.7-13.4s and 1.0-1.1s. The pass
      # counts are asserted by the harnesses themselves, so a green here
      # is a green over 30 and 16 checks rather than over none.
      #
      # Spelled `npm run` so `ci:local` derives them from this file like
      # every other gate -- a bare `run: bash ...` would be invisible to it
      # and a contributor's pre-push run would quietly differ from CI.
      - run: npm run test:cli-checks
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run test:mcp-checks
        if: steps.changes.outputs.docs_only != 'true'

      # The enterprise trial's own unit tests: the graders, the gate, the
      # generators (docs/specs/enterprise-trial.spec.md). NOT the lane --
      # `trial:offline` takes about twelve minutes and is WS6's to wire.
      # These take about 2.5s and need the CLI bundle built above, because
      # one test runs the real `barwise diff` so a grader's fixture cannot
      # drift from the shape the CLI emits. That drift happened twice on
      # #509 with the unit tests green -- once found in review, once only
      # because the lane was re-run by hand. A check that protects anything
      # only when someone remembers to run it is the gap this closes. Ten
      # runs before wiring: 10 of 10 exit 0, 2.2-2.5s.
      - run: npm run test:trial
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run publint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run test:coverage
        if: steps.changes.outputs.docs_only != 'true'

      # Each decision an ADR declares as tested has a test carrying its tag
      # that ran and passed above: read from the reports test:scripts,
      # test:trial and test:coverage wrote in this job, never from source
      # (docs/specs/executable-adrs.spec.md, WS2). Same guard as the tests
      # it reads; an ADR change is not docs-only (changed-class.mjs).
      - run: npm run check:adr-tests
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run validate:examples
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run knip
        if: steps.changes.outputs.docs_only != 'true'

      # Warn-only architectural smells: large files and code duplication.
      # Advisory signals for the periodic review, never gates (WS6).
      - run: npm run filesize
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true

      - run: npm run dup
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true

      # Blocking advisory gate (docs/specs/supply-chain-hardening.spec.md).
      # The backlog this step used to tolerate is cleared, so it no longer
      # runs with continue-on-error. High and critical advisories fail the
      # build unless written down in the ACCEPTED list in
      # scripts/audit-gate.mjs with a reason and an expiry date.
      - run: npm run audit
        if: steps.changes.outputs.docs_only != 'true'

      # The ADR governance schema judges five rules check:architecture no
      # longer does: listed ids exist, every decision has an entry, a named
      # script and a cited issue exist, the issue is open
      # (docs/specs/adr-conformance-model.spec.md, WS4). Core is built alone
      # (a turbo cache hit after the full build). !cancelled() runs these
      # after an earlier step failed and on docs-only changes, which
      # tracker-only changes are, so those rules are judged on every change;
      # npm ci above is unguarded, so their inputs are installed.
      - run: npm run build:core
        if: ${{ !cancelled() }}
      - run: npm run check:adr-model
        if: ${{ !cancelled() }}
      - run: npm run test:adr-model
        if: ${{ !cancelled() }}

      # Every node gate above under the fault matrix: git empty, absent and
      # shallow, and three working directories. It fails on a gate that
      # passes blind or reads differently by cwd, and refuses on one it
      # cannot read (docs/adr/gate-refusal-contract.md; option D of
      # docs/specs/gate-contract-enforced.spec.md, owner 2026-11-06). Last,
      # where the build, the test reports and the full history exist, so
      # each gate's unperturbed run can answer. The steps it leaves out,
      # each with why, are MATRIX_EXCEPTIONS in scripts/lib/ci-gates.mjs.
      # Pull requests only, with the BASE_SHA the PR-only gates above read:
      # on a push to main those gates do not run, and the matrix would run
      # them with no base.
      - run: npm run fault-matrix
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          # check:spec-first refuses (exit 2) in CI without it, so the matrix's
          # unfaulted reading of that gate needs the body the step above gets.
          PR_BODY: ${{ github.event.pull_request.body }}

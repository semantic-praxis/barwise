name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Single-value matrix (not a bare node-version) so the status check stays
    # named "ci (22)", matching existing branch-protection required checks.
    # Node 20 was dropped; remove the stale "ci (20)" required check.
    strategy:
      matrix:
        node-version: [22]
    defaults:
      run:
        working-directory: barwise

    steps:
      # fetch-depth: 0 so the docs-only detector below can diff the PR
      # against its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request that touches only Markdown or beads tracker data
      # (.beads/, e.g. issues.jsonl) still needs its prose formatting
      # checked (dprint covers .md; it ignores .jsonl), but not build,
      # test, or the linters -- neither Markdown nor tracker data can
      # affect those outcomes. Detect that case and skip the heavy steps.
      # Only applies to pull_request events; pushes to main always run the
      # full pipeline. The job itself always runs, so the required check
      # always reports a result.
      - name: Detect docs-only pull request
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$|^\.beads/'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs/tracker-only change -- skipping build, test, and lint steps."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          # The optimizer lane costs 3.5 minutes and changes rarely, so it
          # runs only when it is touched -- or when the CLI it shells out
          # to changes, since its metric tests run the real
          # `barwise prompt score` and a CLI change can break them without
          # touching a Python file.
          if printf '%s\n' "$changed" | grep -qE '^barwise/optimizer/|^barwise/packages/cli/'; then
            echo "optimizer=true" >> "$GITHUB_OUTPUT"
          else
            echo "optimizer=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: barwise/package-lock.json

      # Persist Turbo's local cache across runs so unchanged packages replay
      # their build/test/lint instead of recomputing. Turbo hashes task
      # inputs per package, so the coarse restore-key is safe: only tasks
      # whose inputs match are served from cache. Keyed by commit so each run
      # writes a fresh entry; the prefix restores the most recent one.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: barwise/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # npm ci runs unconditionally: dprint (used by fmt:check below) is a
      # dev dependency.
      - run: npm ci

      # fmt:check runs first among the checks: it is the cheapest gate and
      # historically the most common failure, and it needs only npm ci (not
      # the build), so front-loading it fails a misformatted PR in seconds
      # instead of after the build. It always runs -- dprint also formats
      # Markdown, so docs-only PRs are still gated on prose formatting.
      - run: npm run fmt:check

      # Validate the beads issue tracker on every PR (always runs, like
      # fmt:check, and cheap). CI checks out the post-merge tree, so this is
      # the bypass-proof half of the cross-branch guard (REPO_REVIEW F6) that
      # `git commit --no-verify` cannot skip: integrity errors (invalid JSON,
      # duplicate id, dangling dep, merge-conflict markers) and -- under
      # --strict -- a non-canonical line fail the merge.
      - name: Validate beads tracker
        run: npm run check:beads -- --strict

      # Fast, source-only static gates next (none need the build), so a lint
      # or architecture violation fails in seconds rather than after the
      # build and test suite.
      - run: npm run oxlint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run depcruise
        if: steps.changes.outputs.docs_only != 'true'

      # Guards the gate itself: subpath-export coverage in
      # tsconfig.depcruise.json, plus a hostile-import probe proving a
      # forbidden subpath edge is actually reported (barwise-862).
      - run: npm run check:depcruise-gate
        if: steps.changes.outputs.docs_only != 'true'

      # Declared must-agree copies (parity.manifest.json) stay
      # byte-identical; editing one copy without its partners fails
      # here instead of drifting silently (barwise-868).
      - run: npm run check:parity

      # A NUL byte makes git classify a source file as binary: no diff, no
      # blame, no review, and a patch taken from it loses changes silently.
      # Four files had reached main writing NUL as a composite-key
      # delimiter, one of them never diffable in its history. dprint, tsc,
      # eslint and oxlint all accept NUL, so nothing else catches it.
      - run: npm run check:no-nul
        if: steps.changes.outputs.docs_only != 'true'

      # The duplication ratchet: every candidate the deterministic
      # detectors surface carries a verdict in audit-baseline.json, and
      # the check fails on a new unclassified candidate AND on a stale
      # entry for a resolved finding -- so the baseline's tracked rows
      # always enumerate the open detectable findings (barwise-871).
      - run: npm run audit:duplication -- --check

      - run: npm run purity
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run lint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run build
        if: steps.changes.outputs.docs_only != 'true'

      # The optimizer lane, which until now ran in no CI at all. Its own
      # spec called the guard "the Python lane has its own pytest run,
      # executed by hand" -- and a hand-run guard is run when someone
      # remembers. It did not hold: the loader round trip, the test that
      # caught the missing `match` block, sat red from the day the
      # haiku45-2 variant shipped until it was noticed by accident weeks
      # later (barwise-900).
      #
      # After build, because the metric tests shell out to the real
      # `packages/cli/dist` rather than mocking it. `--frozen` respects
      # the committed uv.lock rather than re-resolving, which is the same
      # reason the lock is committed: a compile costs money, so pin what
      # produced it. uv comes from pip rather than a third-party action --
      # this workflow uses first-party `actions/*` only, and widening that
      # is not this change's call.
      - name: Optimizer lane (Python)
        if: steps.changes.outputs.optimizer == 'true'
        working-directory: barwise/optimizer
        run: |
          python3 -m pip install --quiet uv
          uv sync --extra dev --frozen
          uv run --frozen pytest -q

      # The rubric ratchet: every eval check that survives the mutation
      # its own kind is about carries a verdict in rubric-baseline.json,
      # and the check fails on a newly non-discriminating check AND on a
      # stale entry for a fixed one. A check that cannot fail banks a
      # guaranteed point instead of measuring, which is barwise-894,
      # -901 and -902 (barwise-903). Runs after build: it scores through
      # the built promptlab, so it carries the same docs-only guard.
      - run: npm run audit:rubric -- --check
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run --workspace=@barwise/mcp bundle
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run --workspace=@barwise/cli bundle
        if: steps.changes.outputs.docs_only != 'true'

      # Smoke-test the standalone CLI bundle so a broken bundle fails CI,
      # not a release.
      - name: Smoke-test CLI bundle
        if: steps.changes.outputs.docs_only != 'true'
        run: node packages/cli/dist/bundle/index.cjs --version

      - run: npm run publint
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run test:coverage
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run validate:examples
        if: steps.changes.outputs.docs_only != 'true'

      - run: npm run knip
        if: steps.changes.outputs.docs_only != 'true'

      # Warn-only architectural smells: large files and code duplication.
      # Advisory signals for the periodic review, never gates (WS6).
      - run: npm run filesize
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true

      - run: npm run dup
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true

      # Blocking advisory gate (docs/specs/supply-chain-hardening.spec.md).
      # The backlog this step used to tolerate is cleared, so it no longer
      # runs with continue-on-error. High and critical advisories fail the
      # build unless written down in the ACCEPTED list in
      # scripts/audit-gate.mjs with a reason and an expiry date.
      - run: npm run audit
        if: steps.changes.outputs.docs_only != 'true'

[project]
name = "barwise-optimizer"
version = "0.1.0"
description = "DSPy optimization lane for the barwise extraction prompt (offline, dev-time only)"
requires-python = ">=3.11"
dependencies = [
    "dspy==3.3.1",
    # MIPROv2 imports optuna lazily, at the optimization step -- after the
    # bootstrap and instruction-proposal calls have already been paid for.
    # Declared here so a compile cannot die a dozen paid calls in.
    "optuna>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barwise_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

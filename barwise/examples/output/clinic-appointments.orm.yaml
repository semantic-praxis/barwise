orm_version: "1.1"
model:
  name: Clinic Appointments
  object_types:
    - id: b86e8fcc-c4f9-429e-bbbd-37ed92165217
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: e608c50b-5f69-40e8-83ef-cd956d897a0c
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: ce017a68-a2ee-4fd5-be4b-c28a54c24b9c
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 773264f7-a265-4b9b-ad41-6f96aefa7c3d
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: 662c63f9-b1e5-47bf-ab6c-44ef31a09cb3
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: e019016e-2ee6-41ef-bbe4-a6c7a0dc5075
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 094904c3-7cd3-4827-96c3-52e920aec952
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: 9093a577-2a2a-4ea4-8400-1d9b789406ac
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: c5c52a64-c262-4651-935c-61642976a772
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: 60a740a8-51c8-4956-869c-9877646d0661
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

orm_version: "1.1"
model:
  name: Clinic Appointments
  object_types:
    - id: ab59354f-73d1-4040-b322-22ea66ce2f3c
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: d4b70768-db9a-484b-9d5e-8e49fef841be
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: 36a9cd52-ce3e-4771-9776-2cef3748c221
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 4f910dfa-3fa3-4b37-a0e6-579796b7336a
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: f9e825f3-84ac-4d68-a4cd-33a205d9c3ae
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: 65550e71-05e8-4c1b-b255-44b6a5efc456
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 3ecbe5c5-49a4-452d-9495-08a30a7df232
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: c980cdbb-f25f-405c-b993-fc551cace340
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: 2ddea0fe-80cf-4221-96e6-2dce244a0183
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: 175330e8-117c-4319-aa8b-c83f0fc1578d
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

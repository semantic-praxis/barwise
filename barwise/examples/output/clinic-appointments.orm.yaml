        - id: a3ca89a8-43b0-4c8a-b23a-bf864530a697
          player: ce017a68-a2ee-4fd5-be4b-c28a54c24b9c
          role_name: is booked by
      readings:
        - "{0} books {1}"
        - "{1} is booked by {0}"
      constraints:

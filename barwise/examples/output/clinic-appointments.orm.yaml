orm_version: "1.1"
model:
  name: Clinic Appointments
  object_types:
    - id: 1e4fd835-b81e-41b5-b5d8-83db34ebdfc0
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: 6ea0a912-88c4-4452-b889-af1c848a55a3
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: 7165ffb4-c4b7-4654-9f0b-f6610ab4ab16
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 03ba9ae0-7ca0-4c94-a74b-24daf6921392
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: 987d0a7c-39b9-4ef6-87c4-54c64b149ba2
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: cebe938e-5181-4e68-97ee-5dc6674868b4
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 02f09822-08c4-446f-84c9-c04f270bf6ec
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: be0191fe-b202-4c52-9081-88f099cff6bd
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: 807de9c9-f2c1-4d47-9b09-f299e3eda50e
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: e7a9a968-7223-4f29-977f-ff32fe04c248
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

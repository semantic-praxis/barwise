orm_version: "1.1"
model:
  name: Clinic Appointments
  object_types:
    - id: 7540d583-3aef-4d69-b250-f35b8f0da853
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: 489cf7a7-032b-4e6d-81e7-2b1dd3dc6696
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: 4e846f07-65b2-4645-8cf9-6a4800d2c39e
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 7752a7ce-f978-4349-8041-f3e607fe8291
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: 94b0db3f-8b39-4f65-855b-e83f8759b042
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: f6ce7b26-8691-4319-89d1-8991772b71ab
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 2ed1d566-b999-4eec-8f0c-6f3fbae9a66a
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: 0c769188-3879-42d3-9bc1-f0cf46672a4d
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: a204c527-9282-422b-9f3d-35d7af66d383
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: 1c681e59-d970-4b11-9012-558003df5df8
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

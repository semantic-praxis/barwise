        - id: bb1e3d08-d4d4-40aa-a437-fb6168bba179
          player: 4e846f07-65b2-4645-8cf9-6a4800d2c39e
          role_name: is booked by
      readings:
        - "{0} books {1}"
        - "{1} is booked by {0}"
      constraints:
        - type: internal_uniqueness
          roles:

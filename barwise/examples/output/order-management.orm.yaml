orm_version: "1.1"
model:
  name: Order Management
  object_types:
    - id: ab5fd82e-6c9f-4f21-874f-440a1c68e271
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: 644b7940-3be0-4b68-afba-ba6c22d0a6d0
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: c6e67c9d-bab5-4520-97ce-ca5018cf0c61
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: 2547705c-99fd-474c-8f67-e20cc3d15970
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: e9e31f18-5e71-499b-8c7e-4f4c46a41b1b
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
  fact_types:
    - id: d76c0c20-817b-41e4-b5af-3fb650b66255
      name: Customer places Order
      roles:
        - id: 01c3f4a4-c9af-4bb6-a95f-cfb3262012c4
          player: ab5fd82e-6c9f-4f21-874f-440a1c68e271
          role_name: places

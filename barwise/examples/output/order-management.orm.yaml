          player: 644b7940-3be0-4b68-afba-ba6c22d0a6d0
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - fcf4a744-dc77-4244-981c-cd3bc3effd76
        - type: mandatory
          role: fcf4a744-dc77-4244-981c-cd3bc3effd76

orm_version: "1.1"
model:
  name: Order Management
  object_types:
    - id: 31e656b6-06c4-45e1-8d76-16fbbaf1b5da
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: 87dcf42a-4456-4ee1-96f6-0dbbf684c5fc
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: e5c9e061-aa56-422f-afc5-cc040545e3c6
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: fd421d0f-ed8e-4cd1-8246-f059309bf3a8
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: ff5669d8-f970-43fb-b392-6e061ec9a28f
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
  fact_types:
    - id: f6180acd-c05e-414b-ab73-2acc3010fbf8
      name: Customer places Order
      roles:
        - id: 06606e88-0acc-4a9e-9331-c9596469fee4
          player: 31e656b6-06c4-45e1-8d76-16fbbaf1b5da
          role_name: places
        - id: dab4ea8e-ce55-4028-8e56-7346fe426a1b
          player: 87dcf42a-4456-4ee1-96f6-0dbbf684c5fc
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - dab4ea8e-ce55-4028-8e56-7346fe426a1b
        - type: mandatory
          role: dab4ea8e-ce55-4028-8e56-7346fe426a1b
    - id: acf2c27d-79f3-4a1e-9a2a-8d8b119ea482
      name: Order contains Product
      roles:

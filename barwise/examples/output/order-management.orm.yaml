orm_version: "1.1"
model:
  name: Order Management
  object_types:
    - id: 11832483-f577-4071-b8e4-e4f8f98163f9
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: fd98e839-1da7-436d-aaea-e244d9c5f3c9
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: 85e8ade1-637e-4380-b298-9d62eaafb4da
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: ff5510db-5ca4-41de-9452-878388663471
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: d0249705-2934-4fc6-b97b-0922fbe056b6
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
  fact_types:
    - id: 5d897853-2cba-416f-acdc-f5d411858200
      name: Customer places Order
      roles:
        - id: 35e40022-b42d-4bc0-a389-3ae7dd1f617e
          player: 11832483-f577-4071-b8e4-e4f8f98163f9

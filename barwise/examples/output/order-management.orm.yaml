orm_version: "1.1"
model:
  name: Order Management
  object_types:
    - id: 9ae7a227-b156-4298-b850-99fd3ccf427f
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: edbb3344-a337-417b-92cc-53e4a99bbc6a
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: 1704e60a-98d0-473e-948b-9027fefdcb85
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: 499e541f-183f-4039-82ce-ca805e9748bc
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: cc05d598-3858-4bf0-a2e9-0f0ff657f603
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
  fact_types:
    - id: c22d8199-27f6-4b20-a0db-9325cbd73cfa
      name: Customer places Order
      roles:
        - id: 63b5fd20-ee0c-4f79-989b-817f40f09e19
          player: 9ae7a227-b156-4298-b850-99fd3ccf427f
          role_name: places
        - id: b6a4cee5-36eb-42b8-816a-65cfa280f775
          player: edbb3344-a337-417b-92cc-53e4a99bbc6a
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - b6a4cee5-36eb-42b8-816a-65cfa280f775
        - type: mandatory
          role: b6a4cee5-36eb-42b8-816a-65cfa280f775

        - id: ff8ab4cf-41f7-4412-9db8-b1c80958a3af
          player: fd98e839-1da7-436d-aaea-e244d9c5f3c9
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - ff8ab4cf-41f7-4412-9db8-b1c80958a3af
        - type: mandatory
          role: ff8ab4cf-41f7-4412-9db8-b1c80958a3af

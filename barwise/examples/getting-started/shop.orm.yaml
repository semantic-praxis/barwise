orm_version: "4.0"
model:
  name: Shop
  domain_context: shop
  object_types:
    - id: Customer
      name: Customer
      kind: entity
      reference_mode: customer_number
      preferred_identifier: Each_CustomerNumber_is_of_at_most_one_Customer
      definition: A person or organization that buys from the shop.
    - id: CustomerNumber
      name: CustomerNumber
      kind: value
      definition: The number the shop assigns to a customer when they first order.
      data_type:
        name: integer
    - id: SalesOrder
      name: SalesOrder
      kind: entity
      reference_mode: order_number
      preferred_identifier: Each_OrderNumber_is_of_at_most_one_SalesOrder
      definition: A request by one customer for goods, from checkout to delivery.
    - id: OrderNumber
      name: OrderNumber
      kind: value
      definition: The number printed on the order confirmation.
      data_type:
        name: integer
    - id: OrderStatus
      name: OrderStatus
      kind: value
      definition: Where an order is in fulfillment.
      value_constraint:
        values:
          - pending
          - shipped
          - delivered
      data_type:
        name: text
        length: 10
  fact_types:
    - id: Customer_has_CustomerNumber
      name: Customer has CustomerNumber
      roles:
        - id: Customer_has_CustomerNumber.has
          player: Customer
          role_name: has
        - id: Customer_has_CustomerNumber.is_of
          player: CustomerNumber
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Customer_has_CustomerNumber.is_of
          id: Each_CustomerNumber_is_of_at_most_one_Customer
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is of",{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}]],"fact_type":{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}}'
        - type: internal_uniqueness
          roles:
            - Customer_has_CustomerNumber.has
          id: Each_Customer_has_at_most_one_CustomerNumber
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}]],"fact_type":{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}}'
        - type: mandatory
          role: Customer_has_CustomerNumber.has
          id: Each_Customer_has_at_least_one_CustomerNumber
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}],"fact_type":{"name":"Customer has CustomerNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","CustomerNumber"]}}'
    - id: SalesOrder_has_OrderNumber
      name: SalesOrder has OrderNumber
      roles:
        - id: SalesOrder_has_OrderNumber.has
          player: SalesOrder
          role_name: has
        - id: SalesOrder_has_OrderNumber.is_of
          player: OrderNumber
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - SalesOrder_has_OrderNumber.is_of
          id: Each_OrderNumber_is_of_at_most_one_SalesOrder
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is of",{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}]],"fact_type":{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}}'
        - type: internal_uniqueness

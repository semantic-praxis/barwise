    - id: User_has_UserId
      name: User has UserId
      roles:
        - id: User_has_UserId.has
          player: User
          role_name: has
        - id: User_has_UserId.identifies
          player: UserId
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - User_has_UserId.has
          id: Each_User_has_at_most_one_UserId
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}]],"fact_type":{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}}'
        - type: internal_uniqueness

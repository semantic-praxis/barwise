          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}],"fact_type":{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}}'

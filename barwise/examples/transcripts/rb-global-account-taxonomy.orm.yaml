          minted_from: '{"type":"internal_uniqueness","roles":[[1,"identifies",{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}]],"fact_type":{"name":"User has UserId","readings":["{0} has {1}","{1} identifies {0}"],"players":["User","UserId"]}}'
        - type: mandatory

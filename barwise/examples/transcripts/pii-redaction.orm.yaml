          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Document has DocumentId","readings":["{0} has {1}","{1} identifies {0}"],"players":["Document","DocumentId"]}],"fact_type":{"name":"Document has DocumentId","readings":["{0} has {1}","{1} identifies {0}"],"players":["Document","DocumentId"]}}'

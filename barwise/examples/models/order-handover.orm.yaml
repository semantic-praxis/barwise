# The "Why it is worth learning" example in the repository README: one
# business rule -- every order is either shipped to an address or
# collected from a store, never both and never neither -- stated as an ORM
# exclusive-or constraint. cli/tests/docs/whyOrmExample.test.ts checks
# that the README quotes what barwise actually says about this file.
orm_version: "4.0"
model:
  name: Order Handover
  domain_context: shop
  object_types:
    - id: SalesOrder
      name: SalesOrder
      kind: entity
      reference_mode: order_number
      preferred_identifier: Each_OrderNumber_is_of_at_most_one_SalesOrder
      definition: A request by one customer for goods, from checkout to handover.
    - id: OrderNumber
      name: OrderNumber
      kind: value
      definition: The number printed on the order confirmation.
      data_type:
        name: integer
    - id: Address
      name: Address
      kind: value
      definition: A postal address the shop delivers to.
      data_type:
        name: text
        length: 200
    - id: Store
      name: Store
      kind: entity
      reference_mode: store_code
      preferred_identifier: Each_StoreCode_is_of_at_most_one_Store
      definition: A shop location where customers can collect orders.
    - id: StoreCode
      name: StoreCode
      kind: value
      definition: The short code the shop uses for each of its locations.
      data_type:
        name: text
        length: 10
  fact_types:
    - id: SalesOrder_has_OrderNumber
      name: SalesOrder has OrderNumber
      roles:
        - id: SalesOrder_has_OrderNumber.has
          player: SalesOrder
          role_name: has
        - id: SalesOrder_has_OrderNumber.is_of
          player: OrderNumber
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - SalesOrder_has_OrderNumber.is_of
          id: Each_OrderNumber_is_of_at_most_one_SalesOrder
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is of",{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}]],"fact_type":{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}}'
        - type: internal_uniqueness
          roles:
            - SalesOrder_has_OrderNumber.has
          id: Each_SalesOrder_has_at_most_one_OrderNumber
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}]],"fact_type":{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}}'
        - type: mandatory
          role: SalesOrder_has_OrderNumber.has
          id: Each_SalesOrder_has_at_least_one_OrderNumber
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}],"fact_type":{"name":"SalesOrder has OrderNumber","readings":["{0} has {1}","{1} is of {0}"],"players":["SalesOrder","OrderNumber"]}}'
    - id: Store_has_StoreCode
      name: Store has StoreCode
      roles:
        - id: Store_has_StoreCode.has
          player: Store
          role_name: has
        - id: Store_has_StoreCode.is_of
          player: StoreCode
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Store_has_StoreCode.is_of
          id: Each_StoreCode_is_of_at_most_one_Store
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is of",{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}]],"fact_type":{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}}'
        - type: internal_uniqueness
          roles:
            - Store_has_StoreCode.has
          id: Each_Store_has_at_most_one_StoreCode
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}]],"fact_type":{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}}'
        - type: mandatory
          role: Store_has_StoreCode.has
          id: Each_Store_has_at_least_one_StoreCode
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}],"fact_type":{"name":"Store has StoreCode","readings":["{0} has {1}","{1} is of {0}"],"players":["Store","StoreCode"]}}'
    - id: SalesOrder_is_shipped_to_Address
      name: SalesOrder is shipped to Address
      roles:
        - id: SalesOrder_is_shipped_to_Address.is_shipped_to
          player: SalesOrder
          role_name: is shipped to
        - id: SalesOrder_is_shipped_to_Address.receives
          player: Address
          role_name: receives
      readings:
        - "{0} is shipped to {1}"
        - "{1} receives {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - SalesOrder_is_shipped_to_Address.is_shipped_to
          id: Each_SalesOrder_is_shipped_to_at_most_one_Address
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"is shipped to",{"name":"SalesOrder is shipped to Address","readings":["{0} is shipped to {1}","{1} receives {0}"],"players":["SalesOrder","Address"]}]],"fact_type":{"name":"SalesOrder is shipped to Address","readings":["{0} is shipped to {1}","{1} receives {0}"],"players":["SalesOrder","Address"]}}'
    - id: SalesOrder_is_collected_from_Store
      name: SalesOrder is collected from Store
      roles:
        - id: SalesOrder_is_collected_from_Store.is_collected_from
          player: SalesOrder
          role_name: is collected from
        - id: SalesOrder_is_collected_from_Store.hands_over
          player: Store
          role_name: hands over
      readings:
        - "{0} is collected from {1}"
        - "{1} hands over {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - SalesOrder_is_collected_from_Store.is_collected_from
          id: Each_SalesOrder_is_collected_from_at_most_one_Store
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"is collected from",{"name":"SalesOrder is collected from Store","readings":["{0} is collected from {1}","{1} hands over {0}"],"players":["SalesOrder","Store"]}]],"fact_type":{"name":"SalesOrder is collected from Store","readings":["{0} is collected from {1}","{1} hands over {0}"],"players":["SalesOrder","Store"]}}'
  constraints:
    - type: exclusive_or
      roles:
        - SalesOrder_is_shipped_to_Address.is_shipped_to
        - SalesOrder_is_collected_from_Store.is_collected_from
      id: Each_SalesOrder_either_is_shipped_to_some_Address_or_is_collected_from_some_Store_but_not_both
      minted_from: '{"type":"exclusive_or","roles":[[0,"is shipped to",{"name":"SalesOrder is shipped to Address","readings":["{0} is shipped to {1}","{1} receives {0}"],"players":["SalesOrder","Address"]}],[0,"is collected from",{"name":"SalesOrder is collected from Store","readings":["{0} is collected from {1}","{1} hands over {0}"],"players":["SalesOrder","Store"]}]]}'

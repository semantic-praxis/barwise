orm_version: "1.0"
model:
  name: Learning Design Standard
  object_types:
    - id: 61d1151e-0188-50af-9ab9-8c4216a3bed1
      name: LearningModule
      kind: entity
      reference_mode: module_name
      definition: A unit of learning content authored to the standard -- a deck subdeck, a gym exercise, or a tutorial chapter.
    - id: 4afe101c-c633-5fe6-b019-1513fc8d6a17
      name: ModuleName
      kind: value
      definition: The unique name of a learning module.
      data_type:
        name: text
        length: 100
    - id: 3f78b57e-ce69-5557-8cfc-8555e4607dde
      name: ProficiencyLevel
      kind: entity
      reference_mode: level_name
      definition: A rung on the six-level proficiency scale the standard's transitions are named on.
    - id: 74bf467e-4281-53ad-8333-6bb8b2578db4
      name: LevelName
      kind: value
      definition: The name of a proficiency level.
      value_constraint:
        values:
          - naive
          - novice
          - initiate
          - apprentice
          - journeyman
          - expert
      data_type:
        name: text
        length: 100
    - id: 06daba0b-9a47-523b-b775-7a600b25d97c
      name: ReductiveBias
      kind: entity
      reference_mode: bias_name
      definition: A known wrong reading of ORM imported from another modeling tradition, catalogued with the trap that exposes it.
    - id: 1f0a19ca-617f-5cfb-8902-698261907df3
      name: BiasName
      kind: value
      definition: The short name of a reductive bias in the catalog.
      data_type:
        name: text
        length: 100
    - id: ccba718f-496a-51c7-b06e-7c1f9adf2c92
      name: CheckKind
      kind: entity
      reference_mode: check_kind_name
      definition: A deterministic evaluator check kind provided by the barwise gym.
    - id: eaa7467f-0e2f-5a25-84fd-f55adbd7aef5
      name: CheckKindName
      kind: value
      definition: The name of a gym check kind.
      value_constraint:
        values:
          - must_validate
          - requires_verbalization
          - requires_element
          - forbids_population
      data_type:
        name: text
        length: 100
    - id: 043071ce-9ba1-5e42-94f0-fa55206bb4a5
      name: GymCheck
      kind: entity
      reference_mode: check_ref
      definition: One authored check inside a gym exercise's rubric.
    - id: 6f440eb9-66ef-5661-b28a-107f8a0dc9b7
      name: CheckRef
      kind: value
      definition: The reference that identifies a check within its exercise.
      data_type:
        name: text
        length: 100
    - id: 99d87a20-cb9e-5546-9444-ac062884ffcc
      name: MissCard
      kind: entity
      reference_mode: card_ref
      definition: A spaced-repetition card emitted because a learner's candidate failed a gym check.
    - id: e12ddde9-e5c1-5bec-a985-4a0bc614cb46
      name: MissCardRef
      kind: value
      definition: The reference that identifies an emitted miss card.
      data_type:
        name: text
        length: 100
    - id: 9c57a9fa-a60b-5a59-ab34-e23fb12545b7
      name: DeckCard
      kind: entity
      reference_mode: card_ref
      definition: An authored card in the static deck tiers.
    - id: c6a3d8d5-207d-503f-ad3b-6b6bfdacc5a4
      name: DeckCardRef
      kind: value
      definition: The reference that identifies a deck card.
      data_type:
        name: text
        length: 100
    - id: 78678e9d-85df-5a22-a334-a6d202c35656
      name: ExitPerformance
      kind: value
      definition: The observable can-do statement that marks the far side of a module's transition.
      data_type:
        name: text
        length: 500
    - id: 9fbe8f6f-8ee7-5741-98db-924a0ad85e87
      name: Tier
      kind: value
      definition: The cognitive act a deck card demands.
      value_constraint:
        values:
          - recall
          - production
          - discrimination
          - judgment
      data_type:
        name: text
        length: 20
    - id: fe3700b1-50b6-5674-8483-223d3477361f
      name: Hint
      kind: value
      definition: Guidance toward the fix, shown while a check is failing and on a miss card's front.
      data_type:
        name: text
        length: 500
    - id: d4eeb69f-1d88-56ff-b6b8-bf3afc0c9642
      name: Diagnosis
      kind: value
      definition: The authored explanation of why the reading that produced the failure was wrong; a miss card's back.
      data_type:
        name: text
        length: 500
    - id: 135a722b-47a2-5e89-860c-860734f96917
      name: ReadingReference
      kind: value
      definition: A section or subsection of the ORM literature to study.
      data_type:
        name: text
        length: 100

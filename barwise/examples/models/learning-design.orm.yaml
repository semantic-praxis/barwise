orm_version: "4.0"
model:
  name: Learning Design Standard
  object_types:
    - id: LearningModule
      name: LearningModule
      kind: entity
      reference_mode: module_name
      preferred_identifier: Each_ModuleName_identifies_at_most_one_LearningModule
      definition: A unit of learning content authored to the standard -- a deck subdeck, a gym exercise, or a tutorial chapter.
    - id: ModuleName
      name: ModuleName
      kind: value
      definition: The unique name of a learning module.
      data_type:
        name: text
        length: 100
    - id: ProficiencyLevel
      name: ProficiencyLevel
      kind: entity
      reference_mode: level_name
      preferred_identifier: Each_LevelName_identifies_at_most_one_ProficiencyLevel
      definition: A rung on the six-level proficiency scale the standard's transitions are named on.
    - id: LevelName
      name: LevelName
      kind: value
      definition: The name of a proficiency level.
      value_constraint:
        values:
          - naive
          - novice
          - initiate
          - apprentice
          - journeyman
          - expert
      data_type:
        name: text
        length: 100
    - id: ReductiveBias
      name: ReductiveBias
      kind: entity
      reference_mode: bias_name
      preferred_identifier: Each_BiasName_identifies_at_most_one_ReductiveBias
      definition: A known wrong reading of ORM imported from another modeling tradition, catalogued with the trap that exposes it.
    - id: BiasName
      name: BiasName
      kind: value
      definition: The short name of a reductive bias in the catalog.
      data_type:
        name: text
        length: 100
    - id: CheckKind
      name: CheckKind
      kind: entity
      reference_mode: check_kind_name
      preferred_identifier: Each_CheckKindName_identifies_at_most_one_CheckKind
      definition: A deterministic evaluator check kind provided by the barwise gym.
    - id: CheckKindName
      name: CheckKindName
      kind: value
      definition: The name of a gym check kind.
      value_constraint:
        values:
          - must_validate
          - requires_verbalization
          - requires_element
          - forbids_population
      data_type:
        name: text
        length: 100
    - id: GymCheck
      name: GymCheck
      kind: entity
      reference_mode: check_ref
      preferred_identifier: Each_CheckRef_identifies_at_most_one_GymCheck
      definition: One authored check inside a gym exercise's rubric.
    - id: CheckRef
      name: CheckRef
      kind: value
      definition: The reference that identifies a check within its exercise.
      data_type:
        name: text
        length: 100
    - id: MissCard
      name: MissCard
      kind: entity
      reference_mode: card_ref
      preferred_identifier: Each_MissCardRef_identifies_at_most_one_MissCard
      definition: A spaced-repetition card emitted because a learner's candidate failed a gym check.
    - id: MissCardRef
      name: MissCardRef
      kind: value
      definition: The reference that identifies an emitted miss card.
      data_type:
        name: text
        length: 100
    - id: DeckCard
      name: DeckCard
      kind: entity
      reference_mode: card_ref
      preferred_identifier: Each_DeckCardRef_identifies_at_most_one_DeckCard
      definition: An authored card in the static deck tiers.
    - id: DeckCardRef
      name: DeckCardRef
      kind: value
      definition: The reference that identifies a deck card.
      data_type:
        name: text
        length: 100
    - id: ExitPerformance
      name: ExitPerformance
      kind: value
      definition: The observable can-do statement that marks the far side of a module's transition.
      data_type:
        name: text
        length: 500
    - id: Tier
      name: Tier
      kind: value
      definition: The cognitive act a deck card demands.
      value_constraint:
        values:
          - recall
          - production
          - discrimination
          - judgment
      data_type:
        name: text
        length: 20
    - id: Hint
      name: Hint
      kind: value
      definition: Guidance toward the fix, shown while a check is failing and on a miss card's front.
      data_type:
        name: text
        length: 500
    - id: Diagnosis
      name: Diagnosis
      kind: value
      definition: The authored explanation of why the reading that produced the failure was wrong; a miss card's back.
      data_type:
        name: text
        length: 500
    - id: ReadingReference
      name: ReadingReference
      kind: value
      definition: A section or subsection of the ORM literature to study.
      data_type:
        name: text
        length: 100

orm_version: "4.0"
model:
  name: Diagram Layout Rules
  object_types:
    - id: DiagramElement
      name: DiagramElement
      kind: entity
      reference_mode: element_id
      preferred_identifier: Each_ElementId_identifies_at_most_one_DiagramElement
      definition: A visual component in the diagram, such as an entity node, fact type node, or constraint node.
    - id: ElementId
      name: ElementId
      kind: value
      definition: The unique identifier for a diagram element.
      data_type:
        name: text
        length: 50
    - id: EntityNode
      name: EntityNode
      kind: entity
      reference_mode: element_id
      definition: A diagram element representing an entity type in the conceptual model.
    - id: FactTypeNode
      name: FactTypeNode
      kind: entity
      reference_mode: element_id
      definition: A diagram element representing a fact type in the conceptual model.
    - id: ConstraintNode
      name: ConstraintNode
      kind: entity
      reference_mode: element_id
      definition: A diagram element representing a constraint in the conceptual model.
    - id: Cluster
      name: Cluster
      kind: entity
      reference_mode: cluster_id
      preferred_identifier: Each_ClusterId_identifies_at_most_one_Cluster
      definition: A grouping of entity nodes that are more densely connected to each other than to nodes in other clusters.
    - id: ClusterId
      name: ClusterId
      kind: value
      definition: The unique identifier for a cluster.
      data_type:
        name: text
        length: 50
    - id: Position
      name: Position
      kind: entity
      reference_mode: position_id
      preferred_identifier: Each_PositionId_identifies_at_most_one_Position
      definition: A two-dimensional coordinate location with x and y values.
    - id: PositionId
      name: PositionId
      kind: value
      definition: The unique identifier for a position.
      data_type:
        name: text
        length: 50
    - id: XCoordinate
      name: XCoordinate
      kind: value
      definition: The horizontal coordinate component of a position.
      data_type:
        name: decimal
        length: 10
        scale: 2
    - id: YCoordinate
      name: YCoordinate
      kind: value
      definition: The vertical coordinate component of a position.
      data_type:
        name: decimal
        length: 10
        scale: 2
    - id: Direction
      name: Direction
      kind: entity
      reference_mode: direction_id
      preferred_identifier: Each_DirectionId_identifies_at_most_one_Direction
      definition: An orientation in two-dimensional space, measured as an angle in radians.
    - id: DirectionId
      name: DirectionId
      kind: value
      definition: The unique identifier for a direction.
      data_type:
        name: text
        length: 50
    - id: Angle
      name: Angle
      kind: value
      definition: The angle measurement of a direction in radians.
      data_type:
        name: decimal
        length: 10
        scale: 6
    - id: Distance
      name: Distance
      kind: value
      definition: A non-negative numerical measurement of separation.
      data_type:
        name: decimal
        length: 10
        scale: 2
    - id: Diagram
      name: Diagram
      kind: entity
      reference_mode: diagram_id
      preferred_identifier: Each_DiagramId_identifies_at_most_one_Diagram
      definition: The overall diagram container representing the entire visual layout.
    - id: DiagramId
      name: DiagramId
      kind: value
      definition: The unique identifier for a diagram.
      data_type:
        name: text
        length: 50
    - id: Orientation
      name: Orientation
      kind: value
      definition: The layout direction of a fact type node, either horizontal or vertical.
      value_constraint:
        values:
          - horizontal
          - vertical
      data_type:
        name: text
        length: 20

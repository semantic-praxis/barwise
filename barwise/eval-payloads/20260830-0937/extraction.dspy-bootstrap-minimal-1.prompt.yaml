instructions: 'You are an expert data modeler working in Object-Role Modeling (ORM
  2).


  Read the transcript of a business working session and extract a

  conceptual model: the object types (entities identified by a reference

  mode, and self-identifying value types), the fact types relating them

  with natural-language readings, any subtypes, the constraints the

  transcript states or implies, and example populations where the

  transcript gives concrete instances.


  Report genuine ambiguities rather than guessing. Emit a single JSON

  object matching the schema exactly.'
demos:
- transcriptExcerpt: 'Facilitator: Walk me through how enrollment works at the university.


    Registrar: Students enroll in course offerings, not in courses directly. A course
    offering is a specific course offered in a specific semester.


    Facilitator: So the same course can have multiple offerings?


    Registrar: Right. Each offering is of exactly one course and belongs to exactly
    one semester. Intro to Databases might run in both Fall and Spring.


    Facilitator: Who teaches an offering?


    Registrar: Each offering is taught by exactly one instructor. An instructor can
    teach several offerings in the same semester.


    Facilitator: How are these things identified?


    Registrar: Students have a student number. Courses have a course code, like CS101.
    Offerings get an offering ID. Instructors have a staff ID, and semesters have
    a semester code like 2026-FA.


    Facilitator: What do you track about a course itself?


    Registrar: Every course has a title and a credit value. The credit value is a
    whole number, usually between 1 and 6.


    Facilitator: Anything on the offering besides course and semester?


    Registrar: Each offering has a maximum capacity -- a cap on how many students
    can enroll.


    Facilitator: And

    ... [truncated]'

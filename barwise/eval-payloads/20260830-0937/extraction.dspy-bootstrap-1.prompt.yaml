- transcriptExcerpt: 'Facilitator: Let''s talk about how orders work in your system.
    What''s the basic flow?


    Product Manager: A customer places an order. Every order belongs to exactly one
    customer, and customers can place multiple orders over time.


    Facilitator: How do you identify customers?


    Product Manager: Each customer has a unique customer ID in the CRM system.


    Facilitator: And orders?


    Product Manager: Each order has an order number. That''s the primary identifier.


    Facilitator: What about products? How do they relate to orders?


    Product Manager: An order contains one or more products. Each line in the order
    specifies a product and a quantity. A product can appear in many different orders.


    Facilitator: How are products identified?


    Product Manager: By SKU -- a unique stock-keeping unit code.


    Facilitator: Are there any status values for orders?


    Product Manager: Yes, an order has a status. The possible values are: pending,
    confirmed, shipped, and delivered. Every order must have a status.


    Facilitator: What about the customer''s name? Is that tracked?


    Product Manager: Yes, every customer has a name. It''s just a text field.


    Facilitator: One more thing -- I''ve heard some peopl

    ... [truncated]'

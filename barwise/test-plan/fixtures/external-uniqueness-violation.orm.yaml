orm_version: "4.0"
# Exercises the external-uniqueness feature (WS4c): a Room is identified by
# the combination of its Building and its RoomNumber -- two roles that live
# in different fact types, joined on the common Room. The population below
# is clean (every Room has a distinct Building + RoomNumber combination), so
# `validate` reports 0 errors. To see the violation path, add a second Room
# in the same Building with the same RoomNumber. To see the probe, run
# `verbalize --counterexamples`; the external-uniqueness counterexample mints
# two Rooms that collide on the combination.
model:
  name: Room Identification (external uniqueness, VIOLATING)
  object_types:
    - id: Room
      name: Room
      kind: entity
      reference_mode: room_id
    - id: Building
      name: Building
      kind: entity
      reference_mode: building_code
    - id: RoomNumber
      name: RoomNumber
      kind: value
  fact_types:
    - id: Room_is_in_Building
      name: Room is in Building
      roles:
        - id: Room_is_in_Building.is_in
          player: Room
          role_name: is in
        - id: Room_is_in_Building.houses
          player: Building
          role_name: houses
      readings:
        - "{0} is in {1}"
        - "{1} houses {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Room_is_in_Building.is_in
          id: Each_Room_is_in_at_most_one_Building
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"is in",{"name":"Room is in Building","readings":["{0} is in {1}","{1} houses {0}"],"players":["Room","Building"]}]],"fact_type":{"name":"Room is in Building","readings":["{0} is in {1}","{1} houses {0}"],"players":["Room","Building"]}}'
    - id: Room_has_RoomNumber
      name: Room has RoomNumber
      roles:
        - id: Room_has_RoomNumber.has
          player: Room
          role_name: has
        - id: Room_has_RoomNumber.numbers
          player: RoomNumber
          role_name: numbers
      readings:
        - "{0} has {1}"
        - "{1} numbers {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Room_has_RoomNumber.has
          id: Each_Room_has_at_most_one_RoomNumber
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Room has RoomNumber","readings":["{0} has {1}","{1} numbers {0}"],"players":["Room","RoomNumber"]}]],"fact_type":{"name":"Room has RoomNumber","readings":["{0} has {1}","{1} numbers {0}"],"players":["Room","RoomNumber"]}}'
  constraints:
    # External uniqueness: Building + RoomNumber jointly identify a Room.
    - type: external_uniqueness
      roles:
        - Room_is_in_Building.houses
        - Room_has_RoomNumber.numbers
      id: The_combination_of_Building_and_RoomNumber_is_unique_across_fact_types
      minted_from: '{"type":"external_uniqueness","roles":[[1,"houses",{"name":"Room is in Building","readings":["{0} is in {1}","{1} houses {0}"],"players":["Room","Building"]}],[1,"numbers",{"name":"Room has RoomNumber","readings":["{0} has {1}","{1} numbers {0}"],"players":["Room","RoomNumber"]}]]}'
  populations:
    - id: Room_is_in_Building.population
      fact_type: Room_is_in_Building
      instances:
        - id: Room_is_in_Building.population.1
          role_values:
            Room_is_in_Building.is_in: R1
            Room_is_in_Building.houses: B1
        - id: Room_is_in_Building.population.2
          role_values:
            Room_is_in_Building.is_in: R2
            Room_is_in_Building.houses: B1
        - id: Room_is_in_Building.population.3
          role_values:
            Room_is_in_Building.is_in: R3
            Room_is_in_Building.houses: B2
      description: Which building each room is in
    - id: Room_has_RoomNumber.population
      fact_type: Room_has_RoomNumber
      instances:
        - id: Room_has_RoomNumber.population.1
          role_values:
            Room_has_RoomNumber.has: R1
            Room_has_RoomNumber.numbers: "101"
        - id: Room_has_RoomNumber.population.2
          role_values:
            Room_has_RoomNumber.has: R2
            Room_has_RoomNumber.numbers: "101"
        - id: Room_has_RoomNumber.population.3
          role_values:
            Room_has_RoomNumber.has: R3
            Room_has_RoomNumber.numbers: "101"
      description: Each room's number (distinct within a building)

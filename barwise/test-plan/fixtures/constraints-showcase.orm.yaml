orm_version: "4.0"
model:
  name: Phase 2 Constraint Showcase
  object_types:
    - id: Person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: Car
      name: Car
      kind: entity
      reference_mode: vin
    - id: Bus
      name: Bus
      kind: entity
      reference_mode: bus_number
    - id: Ticket
      name: Ticket
      kind: entity
      reference_mode: ticket_id
  fact_types:
    # Exclusive-or: each Person either drives a Car or rides a Bus but not both
    - id: Person_drives_Car
      name: Person drives Car
      roles:
        - id: Person_drives_Car.drives
          player: Person
          role_name: drives
        - id: Person_drives_Car.is_driven_by
          player: Car
          role_name: is driven by
      readings:
        - "{0} drives {1}"
        - "{1} is driven by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Person_drives_Car.drives
          id: Each_Person_drives_at_most_one_Car
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"drives",{"name":"Person drives Car","readings":["{0} drives {1}","{1} is driven by {0}"],"players":["Person","Car"]}]],"fact_type":{"name":"Person drives Car","readings":["{0} drives {1}","{1} is driven by {0}"],"players":["Person","Car"]}}'
    # The other side of the exclusive-or
    - id: Person_rides_Bus
      name: Person rides Bus
      roles:
        - id: Person_rides_Bus.rides
          player: Person
          role_name: rides
        - id: Person_rides_Bus.is_ridden_by
          player: Bus
          role_name: is ridden by
      readings:
        - "{0} rides {1}"
        - "{1} is ridden by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Person_rides_Bus.rides
          id: Each_Person_rides_at_most_one_Bus
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"rides",{"name":"Person rides Bus","readings":["{0} rides {1}","{1} is ridden by {0}"],"players":["Person","Bus"]}]],"fact_type":{"name":"Person rides Bus","readings":["{0} rides {1}","{1} is ridden by {0}"],"players":["Person","Bus"]}}'
    # Subset: if a Person purchases a Ticket, that Person rides a Bus
    - id: Person_purchases_Ticket
      name: Person purchases Ticket
      roles:
        - id: Person_purchases_Ticket.purchases
          player: Person
          role_name: purchases
        - id: Person_purchases_Ticket.is_purchased_by
          player: Ticket
          role_name: is purchased by
      readings:
        - "{0} purchases {1}"
        - "{1} is purchased by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Person_purchases_Ticket.is_purchased_by
          id: Each_Ticket_is_purchased_by_at_most_one_Person
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is purchased by",{"name":"Person purchases Ticket","readings":["{0} purchases {1}","{1} is purchased by {0}"],"players":["Person","Ticket"]}]],"fact_type":{"name":"Person purchases Ticket","readings":["{0} purchases {1}","{1} is purchased by {0}"],"players":["Person","Ticket"]}}'
        - type: mandatory
          role: Person_purchases_Ticket.is_purchased_by
          id: Each_Ticket_is_purchased_by_at_least_one_Person
          minted_from: '{"type":"mandatory","role":[1,"is purchased by",{"name":"Person purchases Ticket","readings":["{0} purchases {1}","{1} is purchased by {0}"],"players":["Person","Ticket"]}],"fact_type":{"name":"Person purchases Ticket","readings":["{0} purchases {1}","{1} is purchased by {0}"],"players":["Person","Ticket"]}}'
    # Ring: Person is parent of Person (irreflexive + asymmetric)
    - id: Person_is_parent_of_Person
      name: Person is parent of Person
      roles:
        - id: Person_is_parent_of_Person.is_parent_of
          player: Person
          role_name: is parent of
        - id: Person_is_parent_of_Person.is_child_of
          player: Person
          role_name: is child of
      readings:
        - "{0} is parent of {1}"
        - "{1} is child of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Person_is_parent_of_Person.is_parent_of
            - Person_is_parent_of_Person.is_child_of
          id: Each_combination_of_Person_and_Person_is_unique_in_Person_is_parent_of_Person
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"is parent of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}],[1,"is child of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}]],"fact_type":{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}}'
        - type: ring
          role_1: Person_is_parent_of_Person.is_parent_of
          role_2: Person_is_parent_of_Person.is_child_of
          ring_type: irreflexive
          id: No_Person_is_parent_of_that_same_Person
          minted_from: '{"type":"ring","role_1":[0,"is parent of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}],"role_2":[1,"is child of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}],"ring_type":"irreflexive","fact_type":{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}}'
        - type: ring
          role_1: Person_is_parent_of_Person.is_parent_of
          role_2: Person_is_parent_of_Person.is_child_of
          ring_type: asymmetric
          id: If_Person1_is_parent_of_Person2_then_Person2_does_not_is_parent_of_Person1
          minted_from: '{"type":"ring","role_1":[0,"is parent of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}],"role_2":[1,"is child of",{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}],"ring_type":"asymmetric","fact_type":{"name":"Person is parent of Person","readings":["{0} is parent of {1}","{1} is child of {0}"],"players":["Person","Person"]}}'
  constraints:
    - type: exclusive_or
      roles:
        - Person_drives_Car.drives
        - Person_rides_Bus.rides
      id: Each_Person_either_drives_some_Car_or_rides_some_Bus_but_not_both
      minted_from: '{"type":"exclusive_or","roles":[[0,"drives",{"name":"Person drives Car","readings":["{0} drives {1}","{1} is driven by {0}"],"players":["Person","Car"]}],[0,"rides",{"name":"Person rides Bus","readings":["{0} rides {1}","{1} is ridden by {0}"],"players":["Person","Bus"]}]]}'
    - type: subset
      subset_roles:
        - Person_purchases_Ticket.purchases
      superset_roles:
        - Person_rides_Bus.rides
      id: If_Person_in_Person_purchases_Ticket_then_Person_in_Person_rides_Bus
      minted_from: '{"type":"subset","subset_roles":[[0,"purchases",{"name":"Person purchases Ticket","readings":["{0} purchases {1}","{1} is purchased by {0}"],"players":["Person","Ticket"]}]],"superset_roles":[[0,"rides",{"name":"Person rides Bus","readings":["{0} rides {1}","{1} is ridden by {0}"],"players":["Person","Bus"]}]]}'

orm_version: "1.1"
model:
  name: Discrete Manufacturing Master Data and Production
  object_types:
    - id: ot-material
      name: Material
      kind: entity
      reference_mode: material_number
      definition: An item that is procured, produced, stocked or sold, identified by the material number assigned when it is created.
    - id: ot-material-number
      name: MaterialNumber
      kind: value
      definition: The number that identifies a material across every plant and storage location.
      data_type:
        name: text
        length: 18
    - id: ot-raw-material
      name: RawMaterial
      kind: entity
      reference_mode: material_number
      definition: A material that is purchased from a supplier and consumed in production, never sold on its own.
    - id: ot-assembly
      name: Assembly
      kind: entity
      reference_mode: material_number
      definition: A material that is produced in-house from components and consumed by a higher-level material.
    - id: ot-finished-good
      name: FinishedGood
      kind: entity
      reference_mode: material_number
      definition: A material that is produced in-house and sold to customers without further processing.
    - id: ot-configurable-product
      name: ConfigurableProduct
      kind: entity
      reference_mode: material_number
      definition: A finished good whose variant is fixed at order time by assigning values to its configuration characteristics.
    - id: ot-material-description
      name: MaterialDescription
      kind: value
      definition: The short text that describes a material to a person.
      data_type:
        name: text
        length: 40
    - id: ot-material-type-code
      name: MaterialTypeCode
      kind: value
      definition: The code that classes a material by its role in the business and controls which master-data views it carries.
      value_constraint:
        values:
          - ROH
          - HALB
          - FERT
          - HAWA
          - VERP
          - DIEN
          - KMAT
          - NLAG
          - UNBW
          - ERSA
          - PIPE
          - LEER
      data_type:
        name: text
        length: 4
    - id: ot-unit-of-measure
      name: UnitOfMeasure
      kind: entity
      reference_mode: uom_code
      definition: A unit in which a material quantity is expressed, identified by its unit code.
    - id: ot-uom-code
      name: UomCode
      kind: value
      definition: The internal three-character code of a unit of measure.
      value_constraint:
        values:
          - EA
          - PC
          - ST
          - KG
          - G
          - MG
          - TO
          - LB
          - OZ
          - M
          - CM
          - MM
          - KM
          - IN
          - FT
          - YD
          - M2
          - CM2
          - MM2
          - FT2
          - M3
          - CM3
          - MM3
          - L
          - ML
          - HL
          - GAL
          - FT3
          - PAL
          - CAR
          - BOX
          - DR
          - ROL
          - BAG
          - SET
          - PAA
          - H
          - MIN
          - S
          - D
          - PAL
      data_type:
        name: text
        length: 3
    - id: ot-quantity
      name: Quantity
      kind: value
      definition: A count or measure of a material in its base unit of measure.
      data_type:
        name: decimal
        length: 13
        scale: 3
    - id: ot-characteristic
      name: Characteristic
      kind: entity
      reference_mode: characteristic_name
      definition: A configurable attribute of a product, such as color or voltage, whose value is chosen when a configurable product is ordered.
    - id: ot-characteristic-name
      name: CharacteristicName
      kind: value
      definition: The name under which a characteristic is maintained in classification.
      data_type:
        name: text
        length: 30
    - id: ot-plant
      name: Plant
      kind: entity
      reference_mode: plant_code
      definition: An operating site where materials are produced or stocked, identified by a four-character plant code.
    - id: ot-plant-code
      name: PlantCode
      kind: value
      definition: The four-character code of a plant.
      data_type:
        name: text
        length: 4
    - id: ot-storage-location
      name: StorageLocation
      kind: entity
      reference_mode: storage_location_code
      definition: A place within a plant where stock is physically kept and counted.
    - id: ot-storage-location-code
      name: StorageLocationCode
      kind: value
      definition: The four-character code of a storage location.
      data_type:
        name: text
        length: 4
    - id: ot-material-plant-data
      name: MaterialPlantData
      kind: entity
      reference_mode: material_plant_data_id
      definition: The plant-specific view of a material, carrying the procurement and planning settings that apply at one plant.
    - id: ot-material-plant-data-id
      name: MaterialPlantDataId
      kind: value
      definition: The surrogate that identifies one material's data at one plant.
      data_type:
        name: auto_counter
    - id: ot-procurement-type
      name: ProcurementType
      kind: value
      definition: Whether a material at a plant is made in-house, bought externally, or either.
      value_constraint:
        values:
          - in-house
          - external
          - both
      data_type:
        name: text
        length: 12
    - id: ot-lot-size
      name: LotSize
      kind: value
      definition: The quantity a planning run proposes for one order of a material at a plant.
      data_type:
        name: decimal
        length: 13
        scale: 3
    - id: ot-safety-stock
      name: SafetyStock
      kind: value
      definition: The quantity of a material a plant keeps on hand to cover demand variation.
      data_type:
        name: decimal
        length: 13
        scale: 3
    - id: ot-bill-of-material
      name: BillOfMaterial
      kind: entity
      reference_mode: bom_number
      definition: A structured list of the components and quantities needed to produce one material at one plant.
    - id: ot-bom-number
      name: BomNumber
      kind: value
      definition: The number that identifies a bill of material.
      data_type:
        name: text
        length: 8
    - id: ot-bom-usage
      name: BomUsage
      kind: value
      definition: The business purpose a bill of material serves, which decides which departments read it.
      value_constraint:
        values:
          - production
          - engineering
          - universal
          - plant maintenance
          - sales
          - costing
      data_type:
        name: text
        length: 20
    - id: ot-routing
      name: Routing
      kind: entity
      reference_mode: routing_number
      definition: The ordered sequence of operations that produces a material, identified by its group number.
    - id: ot-routing-number
      name: RoutingNumber
      kind: value
      definition: The number that identifies a routing group.
      data_type:
        name: text
        length: 8
    - id: ot-operation
      name: Operation
      kind: entity
      reference_mode: operation_number
      definition: A single step in a routing, performed at one work center.
    - id: ot-operation-number
      name: OperationNumber
      kind: value
      definition: The number that identifies an operation.
      data_type:
        name: text
        length: 4
    - id: ot-work-center
      name: WorkCenter
      kind: entity
      reference_mode: work_center_code
      definition: A machine, line or crew at a plant where operations are carried out.
    - id: ot-work-center-code
      name: WorkCenterCode
      kind: value
      definition: The code that identifies a work center.
      data_type:
        name: text
        length: 8
    - id: ot-setup-time
      name: SetupTime
      kind: value
      definition: The minutes needed to prepare a work center before an operation can run.
      data_type:
        name: decimal
        length: 9
        scale: 2
    - id: ot-run-time
      name: RunTime
      kind: value
      definition: The minutes an operation takes to process one base unit of material.
      data_type:
        name: decimal
        length: 9
        scale: 2
    - id: ot-batch
      name: Batch
      kind: entity
      reference_mode: batch_number
      definition: A quantity of a material produced or received together and tracked as one unit for quality and traceability.
    - id: ot-batch-number
      name: BatchNumber
      kind: value
      definition: The number that identifies a batch.
      data_type:
        name: text
        length: 10
    - id: ot-stock-quantity
      name: StockQuantity
      kind: value
      definition: The quantity of a batch on hand at one storage location.
      data_type:
        name: decimal
        length: 13
        scale: 3
    - id: ot-expiry-date
      name: ExpiryDate
      kind: value
      definition: The date after which a batch may no longer be used or sold.
      data_type:
        name: date
    - id: ot-inspection-lot-number
      name: InspectionLotNumber
      kind: value
      definition: The number that identifies an inspection lot.
      data_type:
        name: text
        length: 12
    - id: ot-usage-decision
      name: UsageDecision
      kind: value
      definition: The quality outcome recorded on an inspection lot that decides what may be done with the inspected stock.
      value_constraint:
        values:
          - accepted
          - accepted with reservation
          - rejected
          - rework
          - scrapped
      data_type:
        name: text
        length: 30
    - id: ot-work-order
      name: WorkOrder
      kind: entity
      reference_mode: work_order_number
      definition: An order to produce a quantity of a material at a plant, yielding one batch, identified by its order number.
    - id: ot-work-order-number
      name: WorkOrderNumber
      kind: value
      definition: The number that identifies a work order.
      data_type:
        name: text
        length: 12
    - id: ot-order-quantity
      name: OrderQuantity
      kind: value
      definition: The quantity an order calls for, in the material's base unit of measure.
      data_type:
        name: decimal
        length: 13
        scale: 3
    - id: ot-work-order-status
      name: WorkOrderStatus
      kind: value
      definition: The system status that says how far a work order has progressed.
      value_constraint:
        values:
          - created
          - released
          - partially confirmed
          - confirmed
          - delivered
          - technically completed
          - closed
      data_type:
        name: text
        length: 24
    - id: ot-basic-start-date
      name: BasicStartDate
      kind: value
      definition: The date on which a work order is scheduled to start.
      data_type:
        name: date
    - id: ot-basic-finish-date
      name: BasicFinishDate
      kind: value
      definition: The date by which a work order is scheduled to finish.
      data_type:
        name: date
    - id: ot-supplier
      name: Supplier
      kind: entity
      reference_mode: supplier_number
      definition: An external party from which materials are purchased, identified by its supplier number.
    - id: ot-supplier-number
      name: SupplierNumber
      kind: value
      definition: The number that identifies a supplier.
      data_type:
        name: text
        length: 10
    - id: ot-supplier-name
      name: SupplierName
      kind: value
      definition: The legal name under which a supplier trades.
      data_type:
        name: text
        length: 80
    - id: ot-purchase-order
      name: PurchaseOrder
      kind: entity
      reference_mode: purchase_order_number
      definition: A commitment to a supplier to buy the materials on its items in the stated quantities.
    - id: ot-purchase-order-number
      name: PurchaseOrderNumber
      kind: value
      definition: The number that identifies a purchase order.
      data_type:
        name: text
        length: 10
    - id: ot-purchase-order-item
      name: PurchaseOrderItem
      kind: entity
      reference_mode: purchase_order_item_id
      definition: One line of a purchase order, ordering a quantity of a material for delivery to a plant.
    - id: ot-purchase-order-item-id
      name: PurchaseOrderItemId
      kind: value
      definition: The surrogate that identifies a purchase order item.
      data_type:
        name: auto_counter
    - id: ot-item-number
      name: ItemNumber
      kind: value
      definition: The position of an item within its purchase order, counted in tens.
      data_type:
        name: integer
    - id: ot-delivery-date
      name: DeliveryDate
      kind: value
      definition: The date on which a purchase order item is due to arrive.
      data_type:
        name: date
    - id: ot-net-price
      name: NetPrice
      kind: value
      definition: The agreed price of one unit of a purchase order item, net of tax.
      data_type:
        name: money
  fact_types:
    - id: ft-material-has-material-number
      name: Material has MaterialNumber
      roles:
        - id: r-material-has-material-number-material
          player: ot-material
          role_name: has
        - id: r-material-has-material-number-material-number
          player: ot-material-number
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-has-material-number-material
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-material-has-material-number-material-number
        - type: mandatory
          role: r-material-has-material-number-material
    - id: ft-unit-of-measure-has-uom-code
      name: UnitOfMeasure has UomCode
      roles:
        - id: r-unit-of-measure-has-uom-code-unit-of-measure
          player: ot-unit-of-measure
          role_name: has
        - id: r-unit-of-measure-has-uom-code-uom-code
          player: ot-uom-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-unit-of-measure-has-uom-code-unit-of-measure
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-unit-of-measure-has-uom-code-uom-code
        - type: mandatory
          role: r-unit-of-measure-has-uom-code-unit-of-measure
    - id: ft-characteristic-has-characteristic-name
      name: Characteristic has CharacteristicName
      roles:
        - id: r-characteristic-has-characteristic-name-characteristic
          player: ot-characteristic
          role_name: has
        - id: r-characteristic-has-characteristic-name-characteristic-name
          player: ot-characteristic-name
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-characteristic-has-characteristic-name-characteristic
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-characteristic-has-characteristic-name-characteristic-name
        - type: mandatory
          role: r-characteristic-has-characteristic-name-characteristic
    - id: ft-material-has-material-description
      name: Material has MaterialDescription
      roles:
        - id: r-material-has-material-description-material
          player: ot-material
          role_name: has
        - id: r-material-has-material-description-material-description
          player: ot-material-description
          role_name: describes
      readings:
        - "{0} has {1}"
        - "{1} describes {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-has-material-description-material
        - type: mandatory
          role: r-material-has-material-description-material
    - id: ft-material-has-material-type-code
      name: Material has MaterialTypeCode
      roles:
        - id: r-material-has-material-type-code-material
          player: ot-material
          role_name: has
        - id: r-material-has-material-type-code-material-type-code
          player: ot-material-type-code
          role_name: classes
      readings:
        - "{0} has {1}"
        - "{1} classes {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-has-material-type-code-material
        - type: mandatory
          role: r-material-has-material-type-code-material
    - id: ft-material-has-base-unit-of-measure
      name: Material has base UnitOfMeasure
      roles:
        - id: r-material-has-base-unit-of-measure-material
          player: ot-material
          role_name: has base
        - id: r-material-has-base-unit-of-measure-unit-of-measure
          player: ot-unit-of-measure
          role_name: is base unit of
      readings:
        - "{0} has base {1}"
        - "{1} is base unit of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-has-base-unit-of-measure-material
        - type: mandatory
          role: r-material-has-base-unit-of-measure-material
    - id: ft-material-is-component-of-material
      name: Material is part of Material
      definition: The parent-component relationship the bill of material structure is built from; a material never contains itself at any depth.
      roles:
        - id: r-material-is-component-of-material-material
          player: ot-material
          role_name: is component of
        - id: r-material-is-component-of-material-material-2
          player: ot-material
          role_name: has component
      readings:
        - "{0} is component of {1}"
        - "{1} has component {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-is-component-of-material-material
            - r-material-is-component-of-material-material-2
        - type: ring
          role_1: r-material-is-component-of-material-material
          role_2: r-material-is-component-of-material-material-2
          ring_type: acyclic
    - id: ft-material-uses-material-in-quantity
      name: Material uses Material in Quantity
      definition: How much of a component one unit of the parent material consumes.
      roles:
        - id: r-material-uses-material-in-quantity-material
          player: ot-material
          role_name: uses
        - id: r-material-uses-material-in-quantity-material-2
          player: ot-material
          role_name: is used by
        - id: r-material-uses-material-in-quantity-quantity
          player: ot-quantity
          role_name: is amount of
      readings:
        - "{0} uses {1} in {2}"
        - "{1} is used by {0} in {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-uses-material-in-quantity-material
    - id: ft-configurable-product-has-characteristic
      name: ConfigurableProduct has Characteristic
      roles:
        - id: r-configurable-product-has-characteristic-configurable-product
          player: ot-configurable-product
          role_name: has
        - id: r-configurable-product-has-characteristic-characteristic
          player: ot-characteristic
          role_name: configures
      readings:
        - "{0} has {1}"
        - "{1} configures {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-configurable-product-has-characteristic-configurable-product
            - r-configurable-product-has-characteristic-characteristic
        - type: mandatory
          role: r-configurable-product-has-characteristic-configurable-product
    - id: ft-plant-has-plant-code
      name: Plant has PlantCode
      roles:
        - id: r-plant-has-plant-code-plant
          player: ot-plant
          role_name: has
        - id: r-plant-has-plant-code-plant-code
          player: ot-plant-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-plant-has-plant-code-plant
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-plant-has-plant-code-plant-code
        - type: mandatory
          role: r-plant-has-plant-code-plant
    - id: ft-storage-location-has-storage-location-code
      name: StorageLocation has StorageLocationCode
      roles:
        - id: r-storage-location-has-storage-location-code-storage-location
          player: ot-storage-location
          role_name: has
        - id: r-storage-location-has-storage-location-code-storage-location-code
          player: ot-storage-location-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-storage-location-has-storage-location-code-storage-location
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-storage-location-has-storage-location-code-storage-location-code
        - type: mandatory
          role: r-storage-location-has-storage-location-code-storage-location
    - id: ft-material-plant-data-has-material-plant-data-id
      name: MaterialPlantData has MaterialPlantDataId
      roles:
        - id: r-material-plant-data-has-material-plant-data-id-material-plant-data
          player: ot-material-plant-data
          role_name: has
        - id: r-material-plant-data-has-material-plant-data-id-material-plant-data-id
          player: ot-material-plant-data-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-has-material-plant-data-id-material-plant-data
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-has-material-plant-data-id-material-plant-data-id
        - type: mandatory
          role: r-material-plant-data-has-material-plant-data-id-material-plant-data
    - id: ft-storage-location-is-in-plant
      name: StorageLocation is in Plant
      roles:
        - id: r-storage-location-is-in-plant-storage-location
          player: ot-storage-location
          role_name: is in
        - id: r-storage-location-is-in-plant-plant
          player: ot-plant
          role_name: contains
      readings:
        - "{0} is in {1}"
        - "{1} contains {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-storage-location-is-in-plant-storage-location
        - type: mandatory
          role: r-storage-location-is-in-plant-storage-location
    - id: ft-material-plant-data-is-for-material
      name: MaterialPlantData is for Material
      roles:
        - id: r-material-plant-data-is-for-material-material-plant-data
          player: ot-material-plant-data
          role_name: is for
        - id: r-material-plant-data-is-for-material-material
          player: ot-material
          role_name: has plant data
      readings:
        - "{0} is for {1}"
        - "{1} has plant data {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-is-for-material-material-plant-data
        - type: mandatory
          role: r-material-plant-data-is-for-material-material-plant-data
        - type: external_uniqueness
          id: euc-material-plant
          roles:
            - r-material-plant-data-is-for-material-material
            - r-material-plant-data-is-at-plant-plant
    - id: ft-material-plant-data-is-at-plant
      name: MaterialPlantData is at Plant
      roles:
        - id: r-material-plant-data-is-at-plant-material-plant-data
          player: ot-material-plant-data
          role_name: is at
        - id: r-material-plant-data-is-at-plant-plant
          player: ot-plant
          role_name: holds
      readings:
        - "{0} is at {1}"
        - "{1} holds {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-is-at-plant-material-plant-data
        - type: mandatory
          role: r-material-plant-data-is-at-plant-material-plant-data
    - id: ft-material-plant-data-has-procurement-type
      name: MaterialPlantData has ProcurementType
      roles:
        - id: r-material-plant-data-has-procurement-type-material-plant-data
          player: ot-material-plant-data
          role_name: has
        - id: r-material-plant-data-has-procurement-type-procurement-type
          player: ot-procurement-type
          role_name: applies to
      readings:
        - "{0} has {1}"
        - "{1} applies to {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-has-procurement-type-material-plant-data
        - type: mandatory
          role: r-material-plant-data-has-procurement-type-material-plant-data
    - id: ft-material-plant-data-has-lot-size
      name: MaterialPlantData has LotSize
      roles:
        - id: r-material-plant-data-has-lot-size-material-plant-data
          player: ot-material-plant-data
          role_name: has
        - id: r-material-plant-data-has-lot-size-lot-size
          player: ot-lot-size
          role_name: is lot size of
      readings:
        - "{0} has {1}"
        - "{1} is lot size of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-material-plant-data-has-lot-size-material-plant-data
    - id: ft-material-plant-data-has-safety-stock
      name: MaterialPlantData has SafetyStock
      roles:
        - id: r-material-plant-data-has-safety-stock-material-plant-data
          player: ot-material-plant-data
          role_name: has
        - id: r-material-plant-data-has-safety-stock-safety-stock
          player: ot-safety-stock
          role_name: is safety stock of
      readings:
        - "{0} has {1}"
        - "{1} is safety stock of {0}"
      constraints:

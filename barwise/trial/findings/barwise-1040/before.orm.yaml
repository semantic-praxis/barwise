  definitions:
    - term: Customer
      definition: "The buyer on an order: the party support answers to."
      context: orders
    - term: Customer
      definition: "The seller on a payout: the party finance reconciles with."
      context: payments
    - term: SKU
      definition: The seller's own stock keeping unit; unique per seller, reused freely across sellers.
      context: catalog
    - term: Fulfillment
      definition: A shipment carrying an order line, in whole or in part.
      context: fulfillment
    - term: Refund window
      definition: The days after delivery in which a return may be opened; obligatory on every listing by policy, absent on migrated ones in fact.
      context: fulfillment
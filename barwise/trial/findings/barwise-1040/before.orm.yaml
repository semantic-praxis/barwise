orm_version: "1.1"
model:
  name: Global Marketplace Core
  domain_context: retail-marketplace
  object_types:
    - id: ot-party
      name: Party
      kind: entity
      reference_mode: party_id
      definition: A person or business registered on the marketplace, whether it buys, sells, or both.
      source_context: parties
    - id: ot-party-id
      name: PartyId
      kind: value
      definition: The party id that identifies a Party.
      data_type:
        name: text
        length: 40
    - id: ot-buyer
      name: Buyer
      kind: entity
      reference_mode: party_id
      definition: A party that places orders on the marketplace; support calls this party the customer.
      source_context: parties
      aliases:
        - Customer
    - id: ot-seller
      name: Seller
      kind: entity
      reference_mode: party_id
      definition: A party that lists product variants for sale and receives payouts; finance calls this party the customer.
      source_context: parties
      aliases:
        - Customer
    - id: ot-party-name
      name: PartyName
      kind: value
      definition: The display name a party shows on listings, orders and statements.
      data_type:
        name: text
        length: 200
    - id: ot-email-address
      name: EmailAddress
      kind: value
      definition: The email address a party signs in with and receives notices at.
      data_type:
        name: text
        length: 254
    - id: ot-marketplace
      name: Marketplace
      kind: entity
      reference_mode: marketplace_code
      definition: A country storefront with its own locale, settlement currency and tax rules.
      source_context: catalog
    - id: ot-marketplace-code
      name: MarketplaceCode
      kind: value
      definition: The marketplace code that identifies a Marketplace.
      data_type:
        name: text
        length: 40
    - id: ot-category
      name: Category
      kind: entity
      reference_mode: category_code
      definition: A node of the browse taxonomy under which products are listed.
      source_context: catalog
    - id: ot-category-code
      name: CategoryCode
      kind: value
      definition: The category code that identifies a Category.
      data_type:
        name: text
        length: 40
    - id: ot-product
      name: Product
      kind: entity
      reference_mode: product_id
      definition: A catalog item as the seller describes it, before size, color or pack variation.
      source_context: catalog
    - id: ot-product-id
      name: ProductId
      kind: value
      definition: The product id that identifies a Product.
      data_type:
        name: text
        length: 40
    - id: ot-physical-product
      name: PhysicalProduct
      kind: entity
      reference_mode: product_id
      definition: A product that must be picked, packed and shipped, so it has weight and dimensions.
      source_context: catalog
    - id: ot-hazmat-product
      name: HazmatProduct
      kind: entity
      reference_mode: product_id
      definition: A physical product regulated as dangerous goods and restricted to approved carriers.
      source_context: catalog
    - id: ot-product-variant
      name: ProductVariant
      kind: entity
      reference_mode: variant_id
      definition: A sellable form of a product, identified within its seller by the seller's SKU.
      source_context: catalog
    - id: ot-variant-id
      name: VariantId
      kind: value
      definition: The variant id that identifies a ProductVariant.
      data_type:
        name: text
        length: 40
    - id: ot-listing
      name: Listing
      kind: entity
      reference_mode: listing_id
      definition: The offer of one product variant on one marketplace at a price and refund window.
      source_context: catalog
    - id: ot-listing-id
      name: ListingId
      kind: value
      definition: The listing id that identifies a Listing.
      data_type:
        name: text
        length: 40
    - id: ot-product-name
      name: ProductName
      kind: value
      definition: The product title as the seller entered it, in the seller's own language and script.
      data_type:
        name: text
        length: 500
    - id: ot-sku
      name: Sku
      kind: value
      definition: The seller's stock keeping unit for a variant; unique within the seller, not across sellers.
      data_type:
        name: text
        length: 64
    - id: ot-listing-title
      name: ListingTitle
      kind: value
      definition: The localized title shown to buyers on the marketplace storefront.
      data_type:
        name: text
        length: 500
    - id: ot-locale
      name: Locale
      kind: value
      definition: The BCP 47 language and region tag a listing is written for.
      data_type:
        name: text
        length: 10
      value_constraint:
        values:
          - en-US
          - en-GB
          - en-CA
          - en-AU
          - en-IN
          - de-DE
          - de-AT
          - de-CH
          - fr-FR
          - fr-CA
          - es-ES
          - es-MX
          - it-IT
          - nl-NL
          - pt-BR
          - pl-PL
          - sv-SE
          - ja-JP
          - ko-KR
          - zh-CN
          - zh-TW
    - id: ot-refund-window-days
      name: RefundWindowDays
      kind: value
      definition: The number of days after delivery within which a buyer may open a return on the listing.
      data_type:
        name: integer
      value_constraint:
        ranges:
          - min: "0"
            max: "365"
    - id: ot-legacy-import-flag
      name: LegacyImportFlag
      kind: value
      definition: Marks a listing migrated from the pre-2019 catalog and not yet re-reviewed.
      data_type:
        name: boolean
    - id: ot-weight-grams
      name: WeightGrams
      kind: value
      definition: The shipping weight of a physical product in grams.
      data_type:
        name: integer
      value_constraint:
        ranges:
          - min: "1"
    - id: ot-hazmat-class
      name: HazmatClass
      kind: value
      definition: The dangerous-goods class the carrier network uses to accept or refuse a hazmat product.
      data_type:
        name: text
        length: 30
      value_constraint:
        values:
          - flammable_liquid
          - flammable_solid
          - lithium_battery
          - aerosol
          - corrosive
          - oxidizer
          - toxic
          - magnetized
          - miscellaneous
    - id: ot-order
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A buyer's purchase of one or more product variants on one marketplace in one checkout.
      source_context: orders
    - id: ot-order-number
      name: OrderNumber
      kind: value
      definition: The order number that identifies a Order.
      data_type:
        name: text
        length: 40
    - id: ot-order-line
      name: OrderLine
      kind: entity
      reference_mode: line_id
      definition: One product variant in a given quantity on one order; the unit that ships, returns and refunds.
      source_context: orders
    - id: ot-line-id
      name: LineId
      kind: value
      definition: The line id that identifies a OrderLine.
      data_type:
        name: text
        length: 40
    - id: ot-order-date
      name: OrderDate
      kind: value
      definition: The moment the buyer completed checkout, in UTC.
      data_type:
        name: datetime
    - id: ot-order-status
      name: OrderStatus
      kind: value
      definition: The lifecycle state of an order as the order service records it.
      data_type:
        name: text
        length: 20
      value_constraint:
        values:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - returned
    - id: ot-quantity
      name: Quantity
      kind: value
      definition: A count of units of one product variant.
      data_type:
        name: integer
      value_constraint:
        ranges:
          - min: "1"
    - id: ot-amount
      name: Amount
      kind: value
      definition: A monetary value in the minor-unit precision of its currency.
      data_type:
        name: money
        length: 18
        scale: 2
    - id: ot-warehouse
      name: Warehouse
      kind: entity
      reference_mode: warehouse_code
      definition: A fulfillment site operated by the marketplace or a seller from which shipments depart and to which returns arrive.
      source_context: fulfillment
    - id: ot-warehouse-code
      name: WarehouseCode
      kind: value
      definition: The warehouse code that identifies a Warehouse.
      data_type:
        name: text
        length: 40
    - id: ot-carrier
      name: Carrier
      kind: entity
      reference_mode: carrier_code
      definition: A parcel or freight company that transports shipments.
      source_context: fulfillment
    - id: ot-carrier-code
      name: CarrierCode
      kind: value
      definition: The carrier code that identifies a Carrier.
      data_type:
        name: text
        length: 40
    - id: ot-shipment
      name: Shipment
      kind: entity
      reference_mode: tracking_number
      definition: A parcel handed to a carrier that carries one or more order lines.
      source_context: fulfillment
    - id: ot-tracking-number
      name: TrackingNumber
      kind: value
      definition: The tracking number that identifies a Shipment.
      data_type:
        name: text
        length: 40
    - id: ot-fulfillment
      name: Fulfillment
      kind: entity
      reference_mode: fulfillment_id
      definition: The carrying of an order line by a shipment, in whole or in part.
      source_context: fulfillment
    - id: ot-fulfillment-id
      name: FulfillmentId
      kind: value
      definition: The fulfillment id that identifies a Fulfillment.
      data_type:
        name: text
        length: 40
    - id: ot-return
      name: Return
      kind: entity
      reference_mode: rma_number
      definition: A buyer's request to send an order line back, authorized under a return merchandise number.
      source_context: fulfillment
    - id: ot-rma-number
      name: RmaNumber
      kind: value
      definition: The rma number that identifies a Return.
      data_type:
        name: text
        length: 40
    - id: ot-shipment-status
      name: ShipmentStatus
      kind: value
      definition: The carrier-reported state of a shipment.
      data_type:
        name: text
        length: 25
      value_constraint:
        values:
          - label_created
          - in_transit
          - out_for_delivery
          - delivered
          - lost
          - returned_to_sender
    - id: ot-shipped-date
      name: ShippedDate
      kind: value
      definition: The date the carrier scanned the shipment as accepted.
      data_type:
        name: date
    - id: ot-return-reason
      name: ReturnReason
      kind: value
      definition: The reason a buyer selects when opening a return.
      data_type:
        name: text
        length: 30
      value_constraint:
        values:
          - damaged
          - defective
          - not_as_described
          - wrong_item
          - arrived_late
          - changed_mind
          - counterfeit_suspected
    - id: ot-currency
      name: Currency
      kind: entity
      reference_mode: iso_code
      definition: A settlement currency the marketplace prices, collects and pays out in.
      source_context: payments
    - id: ot-currency-code
      name: CurrencyCode
      kind: value
      definition: The ISO 4217 alphabetic code of a currency.
      data_type:
        name: text
        length: 3
      value_constraint:
        values:
          - USD
          - EUR
          - GBP
          - JPY
          - CAD
          - AUD
          - NZD
          - CHF
          - SEK
          - NOK
          - DKK
          - PLN
          - CZK
          - HUF
          - RON
          - BGN
          - TRY
          - INR
          - SGD
          - HKD
          - KRW
          - TWD
          - CNY
          - THB
          - MYR
          - IDR
          - PHP
          - MXN
          - BRL
          - CLP
          - COP
          - ZAR
          - AED
          - SAR
          - ILS
    - id: ot-payment
      name: Payment
      kind: entity
      reference_mode: payment_id
      definition: A buyer's settlement of an order through one payment method.
      source_context: payments
    - id: ot-payment-id
      name: PaymentId
      kind: value
      definition: The payment id that identifies a Payment.
      data_type:
        name: text
        length: 40
    - id: ot-refund
      name: Refund
      kind: entity
      reference_mode: refund_id
      definition: The reversal of all or part of a payment after a return is accepted.
      source_context: payments
    - id: ot-refund-id
      name: RefundId
      kind: value
      definition: The refund id that identifies a Refund.
      data_type:
        name: text
        length: 40
    - id: ot-payout
      name: Payout
      kind: entity
      reference_mode: payout_id
      definition: A transfer of accumulated net proceeds to a seller in the seller's settlement currency.
      source_context: payments
    - id: ot-payout-id
      name: PayoutId
      kind: value
      definition: The payout id that identifies a Payout.
      data_type:
        name: text
        length: 40
    - id: ot-payment-method
      name: PaymentMethod
      kind: value
      definition: The instrument a buyer pays with.
      data_type:
        name: text
        length: 20
      value_constraint:
        values:
          - card
          - wallet
          - bank_transfer
          - sepa_debit
          - konbini
          - cash_on_delivery
          - installments
    - id: ot-payout-date
      name: PayoutDate
      kind: value
      definition: The date a payout was released to the seller's bank.
      data_type:
        name: date
  fact_types:
    - id: ft-party-has-partyid
      name: Party has PartyId
      roles:
        - id: r-party-has-partyid-party
          player: ot-party
          role_name: has
        - id: r-party-has-partyid-party-id
          player: ot-party-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-has-partyid-party
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-party-has-partyid-party-id
        - type: mandatory
          role: r-party-has-partyid-party
    - id: ft-marketplace-has-marketplacecode

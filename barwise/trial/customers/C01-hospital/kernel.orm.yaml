  objectified_fact_types:
    - id: oft-admission
      fact_type: ft-patient-is-admitted-to-facility-at-admission-datetime
      object_type: ot-admission

  definitions:
    - term: Encounter
      definition: In the clinical context, any patient contact that produces a chart entry; in billing, the unit a claim is raised against. The two readings disagree on telephone and portal contacts.
      context: clinical
    - term: Visit
      definition: The scheduling and billing teams' word for an outpatient encounter; not a separate concept.
      context: billing

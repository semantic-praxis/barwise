orm_version: "1.1"
model:
  name: Third-Party Logistics Transport Management
  object_types:
    - id: ot-shipper
      name: Shipper
      kind: entity
      reference_mode: shipper_id
      definition: The party that tenders goods for carriage and is named as consignor on the transport document.
    - id: ot-shipper-id
      name: ShipperId
      kind: value
      definition: The identifier the platform assigns to a shipper account.
      data_type:
        name: text
        length: 12
    - id: ot-consignee
      name: Consignee
      kind: entity
      reference_mode: consignee_id
      definition: The party entitled to take delivery of the goods at destination.
    - id: ot-consignee-id
      name: ConsigneeId
      kind: value
      definition: The identifier the platform assigns to a consignee account.
      data_type:
        name: text
        length: 12
    - id: ot-carrier
      name: Carrier
      kind: entity
      reference_mode: scac_code
      definition: A transport operator that contracts to move shipments, identified by its Standard Carrier Alpha Code.
    - id: ot-scac-code
      name: ScacCode
      kind: value
      definition: The two-to-four letter Standard Carrier Alpha Code of a carrier.
      data_type:
        name: text
        length: 4
    - id: ot-shipment
      name: Shipment
      kind: entity
      reference_mode: shipment_number
      definition: A consignment of goods moved for one shipper from origin to destination under one set of transport instructions.
    - id: ot-shipment-number
      name: ShipmentNumber
      kind: value
      definition: The number that identifies a shipment on the platform.
      data_type:
        name: text
        length: 16
    - id: ot-booking
      name: Booking
      kind: entity
      reference_mode: booking_number
      definition: The contract event in which a shipper books a shipment with a carrier; it objectifies that fact so terms can attach to it.
    - id: ot-booking-number
      name: BookingNumber
      kind: value
      definition: The carrier-issued number that identifies a booking.
      data_type:
        name: text
        length: 16
    - id: ot-booking-status
      name: BookingStatus
      kind: value
      definition: Where a booking stands in its life from request to release.
      value_constraint:
        values:
          - requested
          - confirmed
          - amended
          - cancelled
          - released
      data_type:
        name: text
        length: 12
    - id: ot-incoterm
      name: Incoterm
      kind: value
      definition: The trade term that fixes where risk and cost pass between seller and buyer.
      value_constraint:
        values:
          - EXW
          - FCA
          - CPT
          - CIP
          - DAP
          - DPU
          - DDP
          - FAS
          - FOB
          - CFR
          - CIF
      data_type:
        name: text
        length: 3
    - id: ot-port
      name: Port
      kind: entity
      reference_mode: unlocode
      definition: A seaport, airport, rail ramp or inland terminal location identified by its UN/LOCODE.
    - id: ot-un-locode
      name: UnLocode
      kind: value
      definition: The five-character United Nations code for a trade and transport location.
      data_type:
        name: text
        length: 5
    - id: ot-latitude
      name: Latitude
      kind: value
      definition: The north-south coordinate of a location in decimal degrees, WGS 84.
      value_constraint:
        ranges:
          - min: "-90"
            max: "90"
      data_type:
        name: decimal
        length: 9
        scale: 6
    - id: ot-longitude
      name: Longitude
      kind: value
      definition: The east-west coordinate of a location in decimal degrees, WGS 84.
      value_constraint:
        ranges:
          - min: "-180"
            max: "180"
      data_type:
        name: decimal
        length: 10
        scale: 6
    - id: ot-terminal
      name: Terminal
      kind: entity
      reference_mode: terminal_code
      definition: A container handling facility within a port where gate moves are recorded.
    - id: ot-terminal-code
      name: TerminalCode
      kind: value
      definition: The code that identifies a terminal within its port.
      data_type:
        name: text
        length: 8
    - id: ot-vehicle
      name: Vehicle
      kind: entity
      reference_mode: vehicle_id
      definition: A vessel, truck, aircraft or railcar that carries containers on a leg, identified by its IMO number or registration.
    - id: ot-vehicle-id
      name: VehicleId
      kind: value
      definition: The IMO number, registration plate or tail number that identifies a vehicle.
      data_type:
        name: text
        length: 16
    - id: ot-leg
      name: Leg
      kind: entity
      reference_mode: leg_id
      definition: One segment of a route from an origin port to a destination port by one mode of transport.
    - id: ot-leg-id
      name: LegId
      kind: value
      definition: The identifier the platform assigns to a route leg.
      data_type:
        name: text
        length: 16
    - id: ot-transport-mode
      name: TransportMode
      kind: value
      definition: The mode of transport a leg is moved by.
      value_constraint:
        values:
          - sea
          - rail
          - road
          - air
          - barge
      data_type:
        name: text
        length: 6
    - id: ot-voyage
      name: Voyage
      kind: entity
      reference_mode: voyage_number
      definition: One scheduled sailing of a vessel along a rotation of ports, identified by the carrier's voyage number.
    - id: ot-voyage-number
      name: VoyageNumber
      kind: value
      definition: The carrier-issued number that identifies a voyage.
      data_type:
        name: text
        length: 10
    - id: ot-container
      name: Container
      kind: entity
      reference_mode: container_number
      definition: A reusable intermodal box identified by an ISO 6346 container number made of an owner code, a serial number and a check digit.
    - id: ot-container-number
      name: ContainerNumber
      kind: value
      definition: The eleven-character ISO 6346 number printed on a container.
      data_type:
        name: text
        length: 11
    - id: ot-owner-code
      name: OwnerCode
      kind: value
      definition: The four-letter prefix of a container number that names the owner or operator and ends in U, J or Z.
      data_type:
        name: text
        length: 4
    - id: ot-serial-number
      name: SerialNumber
      kind: value
      definition: The six-digit serial that the owner assigns within its owner code.
      data_type:
        name: text
        length: 6
    - id: ot-check-digit
      name: CheckDigit
      kind: value
      definition: The single digit computed from the owner code and serial that validates a container number.
      value_constraint:
        ranges:
          - min: "0"
            max: "9"
      data_type:
        name: integer
    - id: ot-container-size-type
      name: ContainerSizeType
      kind: value
      definition: The ISO 6346 size and type code of a container.
      value_constraint:
        values:
          - 22G1
          - 42G1
          - 45G1
          - 22R1
          - 42R1
          - 45R1
          - 22U1
          - 42U1
          - 22P1
          - 42P1
          - 22T1
          - 42T1
          - L5G1
          - 22V1
      data_type:
        name: text
        length: 4
    - id: ot-gross-weight
      name: GrossWeight
      kind: value
      definition: The verified gross mass of a packed container in kilograms.
      data_type:
        name: decimal
        length: 10
        scale: 2
    - id: ot-seal
      name: Seal
      kind: entity
      reference_mode: seal_number
      definition: A tamper-evident device fixed to a container door and recorded at stuffing.
    - id: ot-seal-number
      name: SealNumber
      kind: value
      definition: The number stamped on a seal.
      data_type:
        name: text
        length: 20
    - id: ot-container-movement
      name: ContainerMovement
      kind: entity
      reference_mode: movement_id
      definition: One placement of a container on one leg of one voyage in sequence, the unit that terminal and vessel planners reconcile.
    - id: ot-movement-id
      name: MovementId
      kind: value
      definition: The surrogate the platform assigns to a container movement.
      data_type:
        name: auto_counter
    - id: ot-sequence-number
      name: SequenceNumber
      kind: value
      definition: The order of a container's movements within a voyage leg, starting at 1.
      value_constraint:
        ranges:
          - min: "1"
      data_type:
        name: integer
    - id: ot-commodity
      name: Commodity
      kind: entity
      reference_mode: hs_code
      definition: A category of goods identified by its Harmonized System code.
    - id: ot-hs-code
      name: HsCode
      kind: value
      definition: The six-digit Harmonized System code of a commodity.
      data_type:
        name: text
        length: 6
    - id: ot-hazard-class
      name: HazardClass
      kind: entity
      reference_mode: un_number
      definition: A dangerous-goods classification for a commodity, identified by its UN number.
    - id: ot-un-number
      name: UnNumber
      kind: value
      definition: The four-digit United Nations number that identifies a hazardous substance or article.
      value_constraint:
        values:
          - UN0004
          - UN0012
          - UN0027
          - UN0081
          - UN0131
          - UN0209
          - UN0335
          - UN0336
          - UN1001
          - UN1005
          - UN1006
          - UN1011
          - UN1017
          - UN1044
          - UN1049
          - UN1066
          - UN1072
          - UN1075
          - UN1090
          - UN1170
          - UN1202
          - UN1203
          - UN1219
          - UN1263
          - UN1267
          - UN1268
          - UN1294
          - UN1301
          - UN1325
          - UN1350
          - UN1381
          - UN1402
          - UN1428
          - UN1479
          - UN1495
          - UN1547
          - UN1593
          - UN1648
          - UN1660
          - UN1710
          - UN1760
          - UN1789
          - UN1791
          - UN1805
          - UN1814
          - UN1823
          - UN1830
          - UN1863
          - UN1866
          - UN1888
          - UN1942
          - UN1950
          - UN1965
          - UN1977
          - UN1993
          - UN2014
          - UN2031
          - UN2067
          - UN2211
          - UN2215
          - UN2448
          - UN2735
          - UN2794
          - UN2796
          - UN2814
          - UN2900
          - UN2910
          - UN3077
          - UN3082
          - UN3090
          - UN3091
          - UN3166
          - UN3171
          - UN3245
          - UN3257
          - UN3268
          - UN3480
          - UN3481
      data_type:
        name: text
        length: 6
    - id: ot-imdg-class
      name: ImdgClass
      kind: value
      definition: The IMDG Code class or division a hazard class falls in.
      value_constraint:
        values:
          - "1.1"
          - "1.2"
          - "1.3"
          - "1.4"
          - "1.5"
          - "1.6"
          - "2.1"
          - "2.2"
          - "2.3"
          - "3"
          - "4.1"
          - "4.2"
          - "4.3"
          - "5.1"
          - "5.2"
          - "6.1"
          - "6.2"
          - "7"
          - "8"
          - "9"
      data_type:
        name: text
        length: 3
    - id: ot-customs-declaration
      name: CustomsDeclaration
      kind: entity
      reference_mode: declaration_number
      definition: A filing with a customs authority that declares the goods, value and origin of a shipment for clearance.
    - id: ot-declaration-number
      name: DeclarationNumber
      kind: value
      definition: The reference the customs authority assigns to a declaration.
      data_type:
        name: text
        length: 18
    - id: ot-declaration-type
      name: DeclarationType
      kind: value
      definition: Whether a declaration clears goods into, out of, or through a customs territory.
      value_constraint:
        values:
          - import
          - export
          - transit
      data_type:
        name: text
        length: 7
    - id: ot-filing-deadline
      name: FilingDeadline
      kind: value
      definition: The instant by which a declaration must be lodged with the customs authority.
      data_type:
        name: datetime
    - id: ot-filed-at
      name: FiledAt
      kind: value
      definition: The instant a declaration was lodged with the customs authority.
      data_type:
        name: datetime
    - id: ot-event
      name: Event
      kind: entity
      reference_mode: event_id
      definition: A timestamped occurrence recorded against a shipment, container or vehicle.
    - id: ot-event-id
      name: EventId
      kind: value
      definition: The identifier the platform assigns to an event.
      data_type:
        name: uuid
    - id: ot-event-timestamp
      name: EventTimestamp
      kind: value
      definition: The instant at which an event occurred, in UTC.
      data_type:
        name: timestamp
    - id: ot-shipment-event
      name: ShipmentEvent
      kind: entity
      reference_mode: event_id
      definition: An event that changes the status of a shipment, such as a departure or an arrival.
    - id: ot-scan-event
      name: ScanEvent
      kind: entity
      reference_mode: event_id
      definition: A shipment event captured by scanning a container or package identifier rather than keyed by hand.
    - id: ot-gate-scan
      name: GateScan
      kind: entity
      reference_mode: event_id
      definition: A scan event recorded when a container passes a terminal gate in or out.
    - id: ot-gate-direction
      name: GateDirection
      kind: value
      definition: Whether a gate scan records the container entering or leaving the terminal.
      value_constraint:
        values:
          - gate in
          - gate out
      data_type:
        name: text
        length: 8
  fact_types:
    - id: ft-shipper-has-shipper-id
      name: Shipper has ShipperId
      roles:
        - id: r-shipper-has-shipper-id-shipper
          player: ot-shipper
          role_name: has
        - id: r-shipper-has-shipper-id-shipper-id
          player: ot-shipper-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-shipper-has-shipper-id-shipper
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-shipper-has-shipper-id-shipper-id
        - type: mandatory
          role: r-shipper-has-shipper-id-shipper
    - id: ft-consignee-has-consignee-id
      name: Consignee has ConsigneeId
      roles:
        - id: r-consignee-has-consignee-id-consignee
          player: ot-consignee
          role_name: has
        - id: r-consignee-has-consignee-id-consignee-id
          player: ot-consignee-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-consignee-has-consignee-id-consignee
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-consignee-has-consignee-id-consignee-id
        - type: mandatory
          role: r-consignee-has-consignee-id-consignee
    - id: ft-carrier-has-scac-code
      name: Carrier has ScacCode
      roles:
        - id: r-carrier-has-scac-code-carrier
          player: ot-carrier
          role_name: has
        - id: r-carrier-has-scac-code-scac-code
          player: ot-scac-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-carrier-has-scac-code-carrier
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-carrier-has-scac-code-scac-code
        - type: mandatory
          role: r-carrier-has-scac-code-carrier
    - id: ft-shipment-has-shipment-number
      name: Shipment has ShipmentNumber
      roles:
        - id: r-shipment-has-shipment-number-shipment
          player: ot-shipment
          role_name: has
        - id: r-shipment-has-shipment-number-shipment-number
          player: ot-shipment-number
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-shipment-has-shipment-number-shipment
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-shipment-has-shipment-number-shipment-number
        - type: mandatory
          role: r-shipment-has-shipment-number-shipment
    - id: ft-booking-has-booking-number
      name: Booking has BookingNumber
      roles:
        - id: r-booking-has-booking-number-booking
          player: ot-booking
          role_name: has
        - id: r-booking-has-booking-number-booking-number
          player: ot-booking-number
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-booking-has-booking-number-booking
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-booking-has-booking-number-booking-number
        - type: mandatory
          role: r-booking-has-booking-number-booking
    - id: ft-shipper-books-shipment-with-carrier
      name: Shipper books Shipment with Carrier
      definition: The act of contracting a carrier to move a shipment; each shipment is booked once, by one shipper, with one carrier.
      roles:
        - id: r-shipper-books-shipment-with-carrier-shipper
          player: ot-shipper
          role_name: books
        - id: r-shipper-books-shipment-with-carrier-shipment
          player: ot-shipment
          role_name: is booked by
        - id: r-shipper-books-shipment-with-carrier-carrier
          player: ot-carrier
          role_name: carries under
      readings:
        - "{0} books {1} with {2}"
        - "{1} is booked by {0} with {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-shipper-books-shipment-with-carrier-shipment
    - id: ft-booking-has-booking-status
      name: Booking has BookingStatus
      roles:
        - id: r-booking-has-booking-status-booking
          player: ot-booking
          role_name: has
        - id: r-booking-has-booking-status-booking-status
          player: ot-booking-status
          role_name: is status of
      readings:
        - "{0} has {1}"
        - "{1} is status of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-booking-has-booking-status-booking
        - type: mandatory
          role: r-booking-has-booking-status-booking
    - id: ft-booking-has-incoterm
      name: Booking has Incoterm
      roles:
        - id: r-booking-has-incoterm-booking
          player: ot-booking
          role_name: has
        - id: r-booking-has-incoterm-incoterm
          player: ot-incoterm
          role_name: governs
      readings:
        - "{0} has {1}"
        - "{1} governs {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-booking-has-incoterm-booking
    - id: ft-shipment-is-consigned-to-consignee
      name: Shipment is consigned to Consignee
      roles:
        - id: r-shipment-is-consigned-to-consignee-shipment
          player: ot-shipment
          role_name: is consigned to
        - id: r-shipment-is-consigned-to-consignee-consignee
          player: ot-consignee
          role_name: receives
      readings:
        - "{0} is consigned to {1}"
        - "{1} receives {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-shipment-is-consigned-to-consignee-shipment
        - type: mandatory
          role: r-shipment-is-consigned-to-consignee-shipment
    - id: ft-port-has-un-locode
      name: Port has UnLocode
      roles:
        - id: r-port-has-un-locode-port
          player: ot-port
          role_name: has
        - id: r-port-has-un-locode-un-locode
          player: ot-un-locode
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-port-has-un-locode-port
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-port-has-un-locode-un-locode
        - type: mandatory
          role: r-port-has-un-locode-port
    - id: ft-port-has-latitude
      name: Port has Latitude
      roles:
        - id: r-port-has-latitude-port
          player: ot-port
          role_name: has
        - id: r-port-has-latitude-latitude
          player: ot-latitude
          role_name: locates
      readings:
        - "{0} has {1}"
        - "{1} locates {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-port-has-latitude-port
        - type: mandatory
          role: r-port-has-latitude-port
    - id: ft-port-has-longitude
      name: Port has Longitude
      roles:
        - id: r-port-has-longitude-port
          player: ot-port
          role_name: has
        - id: r-port-has-longitude-longitude
          player: ot-longitude
          role_name: locates
      readings:
        - "{0} has {1}"
        - "{1} locates {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-port-has-longitude-port
        - type: mandatory
          role: r-port-has-longitude-port
    - id: ft-port-transships-to-port
      name: Port transships to Port
      definition: "A transshipment link: cargo discharged at the first port is routinely reloaded for the second; a port never transships to itself."
      roles:
        - id: r-port-transships-to-port-port
          player: ot-port
          role_name: transships to
        - id: r-port-transships-to-port-port-2
          player: ot-port
          role_name: receives transshipment from
      readings:
        - "{0} transships to {1}"
        - "{1} receives transshipment from {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-port-transships-to-port-port
            - r-port-transships-to-port-port-2
        - type: ring
          role_1: r-port-transships-to-port-port
          role_2: r-port-transships-to-port-port-2
          ring_type: irreflexive
    - id: ft-terminal-has-terminal-code
      name: Terminal has TerminalCode
      roles:
        - id: r-terminal-has-terminal-code-terminal
          player: ot-terminal
          role_name: has
        - id: r-terminal-has-terminal-code-terminal-code
          player: ot-terminal-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-terminal-has-terminal-code-terminal
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-terminal-has-terminal-code-terminal-code
        - type: mandatory
          role: r-terminal-has-terminal-code-terminal
    - id: ft-terminal-is-in-port
      name: Terminal is in Port
      roles:
        - id: r-terminal-is-in-port-terminal
          player: ot-terminal
          role_name: is in
        - id: r-terminal-is-in-port-port
          player: ot-port
          role_name: has
      readings:
        - "{0} is in {1}"
        - "{1} has {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-terminal-is-in-port-terminal
        - type: mandatory
          role: r-terminal-is-in-port-terminal
    - id: ft-vehicle-has-vehicle-id
      name: Vehicle has VehicleId
      roles:
        - id: r-vehicle-has-vehicle-id-vehicle
          player: ot-vehicle
          role_name: has
        - id: r-vehicle-has-vehicle-id-vehicle-id
          player: ot-vehicle-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-vehicle-has-vehicle-id-vehicle
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-vehicle-has-vehicle-id-vehicle-id
        - type: mandatory
          role: r-vehicle-has-vehicle-id-vehicle
    - id: ft-leg-has-leg-id

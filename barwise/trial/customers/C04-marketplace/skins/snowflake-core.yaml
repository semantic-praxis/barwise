# Snowflake in the idiom a marketplace warehouse actually has: upper-case
# names, CREATE OR REPLACE, database.schema qualification, VARIANT and
# ARRAY columns, clustering keys.
dialect: snowflake
naming:
  table_case: upper
  column_case: upper
idioms:
  schema_qualified: "MARKETPLACE.CORE."
  create_or_replace: true
  quoting: none
  check_constraints: false
  comments: true
  table_suffix: "CLUSTER BY (LOAD_DATE)"
extra_tables:
  - |
    CREATE OR REPLACE TABLE MARKETPLACE.CORE.LISTING_ATTRIBUTES (
      LISTING_ID NUMBER(38,0) NOT NULL,
      ATTRIBUTES VARIANT,
      IMAGE_URLS ARRAY,
      DIMENSIONS OBJECT,
      LOAD_DATE TIMESTAMP_NTZ DEFAULT CURRENT_TIMESTAMP(),
      CONSTRAINT PK_LISTING_ATTRIBUTES PRIMARY KEY (LISTING_ID) NOT ENFORCED
    ) CLUSTER BY (LOAD_DATE)
  - |
    CREATE OR REPLACE TABLE MARKETPLACE.CORE.PRODUCT_I18N (
      PRODUCT_ID NUMBER(38,0) NOT NULL,
      LOCALE VARCHAR(10) NOT NULL,
      TITLE VARCHAR(500) COLLATE 'utf8',
      DESCRIPTION TEXT,
      PRIMARY KEY (PRODUCT_ID, LOCALE) NOT ENFORCED
    )
  - |
    CREATE OR REPLACE TRANSIENT TABLE MARKETPLACE.CORE.ORDER_EVENTS_RAW (
      EVENT_ID VARCHAR NOT NULL,
      PAYLOAD VARIANT NOT NULL,
      INGESTED_AT TIMESTAMP_LTZ NOT NULL
    ) DATA_RETENTION_TIME_IN_DAYS = 0
  - |
    CREATE OR REPLACE TABLE MARKETPLACE.CORE.SELLER_PAYOUT_SCD (
      SELLER_ID NUMBER(38,0) NOT NULL,
      PAYOUT_SCHEDULE VARCHAR(20),
      VALID_FROM TIMESTAMP_NTZ NOT NULL,
      VALID_TO TIMESTAMP_NTZ,
      IS_CURRENT BOOLEAN DEFAULT TRUE,
      DBT_SCD_ID VARCHAR(32),
      PRIMARY KEY (SELLER_ID, VALID_FROM) NOT ENFORCED
    )

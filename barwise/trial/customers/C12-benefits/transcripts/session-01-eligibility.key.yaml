# Seeded devices in session-01-eligibility.md. Line numbers are 1-based
# in the authored file; the runner remaps them when it messes the
# transcript. Every deontic rule the rubric asserts is stated in an
# unambiguous sentence somewhere below (the realism floor). Deontic
# rules are asserted as verbalizations: forbids_population does not
# fire for a deontic constraint, since an obligation does not rule a
# population out.
speakers:
  - { name: Dana Whitlock, job: facilitator }
  - { name: Marguerite Okafor, job: eligibility policy analyst }
  - { name: Len Prakash, job: mainframe DBA }
  - { name: Tomas Reyes, job: modernization architect }
  - { name: Beverly Chen, job: appeals hearing officer, latecomer: true, joins_line: 163 }
seeded:
  - id: decoy-ssn
    kind: decoy_identifier
    lines: [15]
    expect:
      preferred_identifier: { entity: Client, value: ClientNumber }
      forbids_population: { fact_type: "Client has ClientNumber", constraint: internal_uniqueness }
  - id: injection-1
    kind: injection
    lines: [55]
    expect:
      absent_element: INJECTED_MARKER
  - id: conflict-application-names-program
    kind: resolved_conflict
    deontic: true
    lines: [89, 91, 93, 95, 97]
    expect:
      requires_verbalization: "It is obligatory that each Applicant applies for at least one Program."
      retracted: "an application with no program is accepted as a screening"
  - id: conflict-determination-grain
    kind: resolved_conflict
    lines: [99, 101, 105, 107, 111, 117]
    expect:
      requires_element: { entity: Determination }
      requires_verbalization: "Each combination of Case, Program and CertificationPeriod is unique in Case is determined for Program in CertificationPeriod."
      retracted: "one determination status per case"
  - id: conflict-verification-self-attestation
    kind: resolved_conflict
    deontic: true
    lines: [125, 127, 129, 131, 133]
    expect:
      requires_verbalization: "It is obligatory that each Determination relies on at least one VerificationDocument."
      retracted: "self-attestation removes the verification requirement"
  - id: correction-statute-citation
    kind: correction
    deontic: true
    lines: [139, 143, 145]
    expect:
      requires_verbalization: "It is obligatory that each Determination cites at least one StatuteReference."
      retracted: "only denials cite a statute"
  - id: overloaded-case
    kind: overloaded_term
    lines: [171, 173, 175, 177, 179]
    expect:
      ambiguity_matches: [case, appeal, docket]
      requires_element: { entity: Appeal }
  - id: parked-household-identity
    kind: parked
    lines: [233, 235, 239, 241, 243]
    expect:
      ambiguity_matches: [household, head of household]
  - id: sanction-per-program
    kind: resolved_conflict
    deontic: true
    lines: [207, 209, 211, 213]
    expect:
      requires_verbalization: "It is obligatory that The combination of Recipient and Program is unique across fact types."
      retracted: "workers stack sanctions in practice"
  - id: latecomer-beverly
    kind: latecomer
    lines: [163, 165]
  - id: tangent-tape-library
    kind: tangent
    lines: [215, 217, 219]
  - id: inaudible-1
    kind: inaudible
    lines: [199]
  - id: supervisor-subtype-parked
    kind: parked
    lines: [197, 199, 201]
    expect:
      ambiguity_matches: [supervisor]

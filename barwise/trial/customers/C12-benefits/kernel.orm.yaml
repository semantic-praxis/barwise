        - { id: r-determination-supersedes-earlier, player: ot-determination, role_name: is superseded by }
      readings: ["{0} supersedes {1}", "{1} is superseded by {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-determination-supersedes-later] }
        - { type: internal_uniqueness, roles: [r-determination-supersedes-earlier] }
        - { type: ring, role_1: r-determination-supersedes-later, role_2: r-determination-supersedes-earlier, ring_type: acyclic }


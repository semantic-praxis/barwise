orm_version: "1.1"
model:
  name: State Benefits Agency
  domain_context: government
  note: >-
    The hand-authored seed model for trial customer C12. A state benefits
    agency whose case management system was written against DB2 on the
    mainframe from COBOL copybooks, and whose rules are statute. The
    vocabulary is the agency's own (Client, Case, Determination,
    Issuance; never Customer or Order). A case number is assigned by the
    office that opened the case and is reused across offices, which is
    the composite key the intake transcript argues about.

  object_types:
    # ---- people and households ----------------------------------------
    - id: ot-client
      name: Client
      kind: entity
      reference_mode: client_number
      definition: A person known to the agency, whether or not they have ever applied, identified by the client number the mainframe assigns on first contact.
      aliases: [Individual]
    - id: ot-applicant
      name: Applicant
      kind: entity
      reference_mode: client_number
      definition: A client who has signed and submitted an application for one or more programs.
    - id: ot-recipient
      name: Recipient
      kind: entity
      reference_mode: client_number
      definition: An applicant who has been found eligible and is included in an active case for at least one program.
      aliases: [Participant]
    - id: ot-household
      name: Household
      kind: entity
      reference_mode: household_number
      definition: The group of people who purchase and prepare food together or otherwise share a residence for program purposes, as the statute defines the assistance unit.
      aliases: [Assistance Unit]
    - id: ot-income-source
      name: IncomeSource
      kind: entity
      reference_mode: income_source_id
      definition: One stream of earned or unearned income attributed to a client and counted in the gross income test.

    # ---- cases and programs -------------------------------------------
    - id: ot-case
      name: Case
      kind: entity
      reference_mode: case_id
      definition: The agency's record of a household's participation, opened by one office and carrying every determination, issuance, sanction and appeal for that household.
    - id: ot-program
      name: Program
      kind: entity
      reference_mode: program_code
      definition: A benefit program the agency administers under a specific statutory authority, such as the Nutrition Assistance Program or Family Cash Assistance.
    - id: ot-certification-period
      name: CertificationPeriod
      kind: entity
      reference_mode: period_number
      definition: The span of months over which a determination of eligibility remains in force before the household must be recertified.
    - id: ot-determination
      name: Determination
      kind: entity
      reference_mode: determination
      definition: The agency's decision that a case is or is not eligible for a program over a certification period; the act that the client may appeal.
    - id: ot-benefit
      name: Benefit
      kind: entity
      reference_mode: benefit_type_code
      definition: A kind of assistance a program provides, such as a food allotment or a cash grant, identified by the benefit type code the issuance system uses.
    - id: ot-benefit-issuance
      name: BenefitIssuance
      kind: entity
      reference_mode: issuance
      definition: The issuance of one benefit to one case for one benefit month; the row the issuance batch writes to the EBT processor or the warrant file.
    - id: ot-statute-reference
      name: StatuteReference
      kind: entity
      reference_mode: citation
      definition: A section of the state code or administrative rules that a determination relies on, identified by its citation.

    # ---- workforce ----------------------------------------------------
    - id: ot-worker
      name: Worker
      kind: entity
      reference_mode: worker_id
      definition: An agency employee with a mainframe sign-on who acts on cases, identified by the worker identifier in the security table.
    - id: ot-eligibility-worker
      name: EligibilityWorker
      kind: entity
      reference_mode: worker_id
      definition: A worker who interviews applicants, gathers verification and makes determinations.
      aliases: [Caseworker]
    - id: ot-hearing-officer
      name: HearingOfficer
      kind: entity
      reference_mode: worker_id
      definition: A worker in the appeals unit who hears appeals and issues decisions, and who must not have made the determination under appeal.
    - id: ot-supervisor
      name: Supervisor
      kind: entity
      reference_mode: worker_id
      definition: A worker who signs off determinations above the delegated authority of an eligibility worker; carried in the mainframe as a separate table with its own copy of the worker identifier.
    - id: ot-office
      name: Office
      kind: entity
      reference_mode: office_code
      definition: A local office of the agency that opens and serves cases, identified by the office code that prefixes its case numbers.

    # ---- verification, sanctions, appeals ------------------------------
    - id: ot-verification-document
      name: VerificationDocument
      kind: entity
      reference_mode: document_number
      definition: A document a client furnishes, or the agency obtains from a data exchange, that verifies an eligibility factor such as identity, income or residency.
    - id: ot-sanction
      name: Sanction
      kind: entity
      reference_mode: sanction_id
      definition: A penalty imposed on a recipient for a program, such as a reduction or disqualification for failure to comply with work requirements.
    - id: ot-appeal
      name: Appeal
      kind: entity
      reference_mode: appeal_number
      definition: A client's request for a fair hearing to contest a determination, tracked by the appeals unit under its own docket number.

    # ---- identifier value types ----------------------------------------
    - id: ot-client-number
      name: ClientNumber
      kind: value
      definition: The nine-digit number the mainframe assigns to a client on first contact; the CLNTNBR of every copybook.
      data_type: { name: text, length: 9 }
    - id: ot-household-number
      name: HouseholdNumber
      kind: value
      definition: The number assigned to a household when it is first registered.
      data_type: { name: text, length: 10 }
    - id: ot-income-source-id
      name: IncomeSourceId
      kind: value
      definition: The identifier of an income source record.
      data_type: { name: integer }
    - id: ot-case-id
      name: CaseId
      kind: value
      definition: The system-wide surrogate the mainframe assigns to a case; distinct from the office-assigned case number.
      data_type: { name: integer }
    - id: ot-case-number
      name: CaseNumber
      kind: value
      definition: The seven-digit number an office assigns to a case when it is opened; unique only within the office that assigned it.
      data_type: { name: text, length: 7 }
    - id: ot-program-code
      name: ProgramCode
      kind: value
      definition: The three-letter code of a program.
      data_type: { name: text, length: 3 }
      value_constraint:
        values: [NAP, FCA, SMC, CCS, HEA, GAP]
    - id: ot-period-number
      name: PeriodNumber
      kind: value
      definition: The sequence number of a certification period.
      data_type: { name: integer }
    - id: ot-benefit-type-code
      name: BenefitTypeCode
      kind: value
      definition: The code the issuance system uses for a kind of benefit.
      data_type: { name: text, length: 4 }
    - id: ot-citation
      name: Citation
      kind: value
      definition: The citation of a section of state code or rule, such as "Admin. Code 12-4-118(b)".
      data_type: { name: text, length: 60 }
    - id: ot-worker-id
      name: WorkerId
      kind: value
      definition: The worker identifier in the mainframe security table.
      data_type: { name: text, length: 8 }
    - id: ot-office-code
      name: OfficeCode
      kind: value
      definition: The three-character code of a local office.
      data_type: { name: text, length: 3 }
    - id: ot-document-number
      name: DocumentNumber
      kind: value
      definition: The number the imaging system stamps on a verification document.
      data_type: { name: text, length: 14 }
    - id: ot-sanction-id
      name: SanctionId
      kind: value
      definition: The identifier of a sanction record.
      data_type: { name: integer }
    - id: ot-appeal-number
      name: AppealNumber
      kind: value
      definition: The docket number the appeals unit assigns when an appeal is filed.
      data_type: { name: text, length: 12 }

    # ---- descriptive value types --------------------------------------
    - id: ot-client-name
      name: ClientName
      kind: value
      definition: The client's legal name as it appears on the identity verification.
      data_type: { name: text, length: 100 }
    - id: ot-date-of-birth
      name: DateOfBirth
      kind: value
      definition: The client's date of birth.
      data_type: { name: date }
    - id: ot-citizenship-status
      name: CitizenshipStatus
      kind: value
      definition: The client's citizenship or immigration status as verified for program purposes.
      data_type: { name: text, length: 40 }
      value_constraint:
        values: [citizen, lawful permanent resident, refugee, asylee, qualified non-citizen, non-qualified non-citizen, unverified]
    - id: ot-application-date
      name: ApplicationDate
      kind: value
      definition: The date the agency received a signed application; the date from which the processing standard runs.
      data_type: { name: date }
    - id: ot-household-size
      name: HouseholdSize
      kind: value
      definition: The number of people in the assistance unit.
      data_type: { name: integer }
    - id: ot-income-type
      name: IncomeType
      kind: value
      definition: The kind of income an income source pays.
      data_type: { name: text, length: 40 }
      value_constraint:
        values: [wages, self-employment, unemployment insurance, social security retirement, disability insurance, child support, pension, rental income, veterans benefits, workers compensation, other unearned]
    - id: ot-monthly-income-amount
      name: MonthlyIncomeAmount
      kind: value
      definition: The gross monthly amount an income source pays, before any disregard.
      data_type: { name: money }
    - id: ot-program-name
      name: ProgramName
      kind: value
      definition: The name of a program as it appears on notices.
      data_type: { name: text, length: 80 }
    - id: ot-case-status
      name: CaseStatus
      kind: value
      definition: The lifecycle state of a case.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [pending, active, suspended, closed, denied, reopened]
    - id: ot-closure-reason-code
      name: ClosureReasonCode
      kind: value
      definition: The reason a case was closed or denied, as coded on the closing notice; the code table the notice generator reads.
      data_type: { name: text, length: 80 }
      value_constraint:
        values:
          - "001 Voluntary withdrawal of application"
          - "002 Voluntary request to close"
          - "003 Failure to complete interview"
          - "004 Failure to provide requested verification"
          - "005 Failure to sign application"
          - "006 Failure to complete recertification"
          - "007 Failure to submit periodic report"
          - "010 Gross income exceeds program limit"
          - "011 Net income exceeds program limit"
          - "012 Countable resources exceed limit"
          - "013 Ineligible due to lump sum receipt"
          - "020 Household moved out of state"
          - "021 Household moved to another office area"
          - "022 Whereabouts unknown"
          - "023 Returned mail with no forwarding address"
          - "030 Citizenship or immigration status not verified"
          - "031 Social security number not furnished"
          - "032 Identity not verified"
          - "033 Residency not verified"
          - "040 Failure to comply with work requirements"
          - "041 Voluntary quit without good cause"
          - "042 Refused suitable employment"
          - "043 Failure to cooperate with child support enforcement"
          - "044 Failure to participate in employment and training"
          - "050 Intentional program violation disqualification"
          - "051 Fleeing felon"
          - "052 Probation or parole violation"
          - "053 Drug felony conviction after effective date"
          - "060 Death of sole household member"
          - "061 Institutionalized"
          - "062 Incarcerated"
          - "070 Time limit reached"
          - "071 Lifetime limit reached"
          - "072 Aged out of program"
          - "080 Duplicate participation in another case"
          - "081 Duplicate participation in another state"
          - "082 Member of another household's case"
          - "090 Program terminated by statute"
          - "091 Funding exhausted"
          - "092 Administrative closure by state office"
          - "093 Closed by data exchange match"
          - "094 Closed by mass change"
          - "099 Other reason stated on notice"
    - id: ot-determination-outcome
      name: DeterminationOutcome
      kind: value
      definition: The result of a determination.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [approved, denied, approved with reduction, pending verification]
    - id: ot-determination-date
      name: DeterminationDate
      kind: value
      definition: The date the determination was authorized on the mainframe.
      data_type: { name: date }
    - id: ot-period-start-date
      name: PeriodStartDate
      kind: value
      definition: The first day of a certification period.
      data_type: { name: date }
    - id: ot-period-end-date
      name: PeriodEndDate
      kind: value
      definition: The last day of a certification period.
      data_type: { name: date }
    - id: ot-benefit-month
      name: BenefitMonth
      kind: value
      definition: The calendar month a benefit is issued for, written as YYYYMM in the issuance file.
      data_type: { name: text, length: 6 }
    - id: ot-issuance-amount
      name: IssuanceAmount
      kind: value
      definition: The dollar amount of an issuance.
      data_type: { name: money }
    - id: ot-issuance-method
      name: IssuanceMethod
      kind: value
      definition: The channel through which an issuance reaches the recipient.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [EBT, warrant, direct deposit, vendor payment, voucher]
    - id: ot-document-type
      name: DocumentType
      kind: value
      definition: The eligibility factor a verification document verifies.
      data_type: { name: text, length: 40 }
      value_constraint:
        values: [identity, citizenship, residency, earned income, unearned income, resources, shelter expense, medical expense, dependent care expense, school enrollment, pregnancy, disability, data exchange match]
    - id: ot-received-date
      name: ReceivedDate
      kind: value
      definition: The date the agency received a verification document.
      data_type: { name: date }
    - id: ot-verification-status
      name: VerificationStatus
      kind: value
      definition: The state of a verification document in review.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [received, accepted, rejected, expired, pending review]
    - id: ot-sanction-reason
      name: SanctionReason
      kind: value
      definition: The compliance failure for which a sanction was imposed.
      data_type: { name: text, length: 60 }
      value_constraint:
        values: [work requirement noncompliance, child support noncooperation, intentional program violation, voluntary quit, employment and training noncompliance, school attendance noncompliance]
    - id: ot-sanction-level
      name: SanctionLevel
      kind: value
      definition: The occurrence level of a sanction, which sets its minimum duration.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [first, second, third, permanent]
    - id: ot-appeal-status
      name: AppealStatus
      kind: value
      definition: The state of an appeal on the appeals docket.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [filed, scheduled, heard, decided, withdrawn, dismissed]
    - id: ot-hearing-date
      name: HearingDate
      kind: value
      definition: The date the fair hearing is scheduled to be held.
      data_type: { name: date }
    - id: ot-appeal-decision
      name: AppealDecision
      kind: value
      definition: The hearing officer's disposition of the appeal.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [affirmed, reversed, remanded, dismissed, withdrawn]

  fact_types:
    # ---- identification ----------------------------------------------
    - id: ft-client-has-client-number
      name: Client has ClientNumber
      roles:
        - { id: r-client-has-number-client, player: ot-client, role_name: has }
        - { id: r-client-has-number-number, player: ot-client-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-client-has-number-client], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-client-has-number-number] }
        - { type: mandatory, role: r-client-has-number-client }
    - id: ft-household-has-household-number
      name: Household has HouseholdNumber
      roles:
        - { id: r-household-has-number-household, player: ot-household, role_name: has }
        - { id: r-household-has-number-number, player: ot-household-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-household-has-number-household], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-household-has-number-number] }
        - { type: mandatory, role: r-household-has-number-household }
    - id: ft-income-source-has-income-source-id
      name: IncomeSource has IncomeSourceId
      roles:
        - { id: r-income-source-has-id-source, player: ot-income-source, role_name: has }
        - { id: r-income-source-has-id-id, player: ot-income-source-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-income-source-has-id-source], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-income-source-has-id-id] }
        - { type: mandatory, role: r-income-source-has-id-source }
    - id: ft-case-has-case-id
      name: Case has CaseId
      roles:
        - { id: r-case-has-id-case, player: ot-case, role_name: has }
        - { id: r-case-has-id-id, player: ot-case-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-case-has-id-case], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-case-has-id-id] }
        - { type: mandatory, role: r-case-has-id-case }
    - id: ft-program-has-program-code
      name: Program has ProgramCode
      roles:
        - { id: r-program-has-code-program, player: ot-program, role_name: has }
        - { id: r-program-has-code-code, player: ot-program-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-program-has-code-program], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-program-has-code-code] }
        - { type: mandatory, role: r-program-has-code-program }
    - id: ft-certification-period-has-period-number
      name: CertificationPeriod has PeriodNumber
      roles:
        - { id: r-period-has-number-period, player: ot-certification-period, role_name: has }
        - { id: r-period-has-number-number, player: ot-period-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-period-has-number-period], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-period-has-number-number] }
        - { type: mandatory, role: r-period-has-number-period }
    - id: ft-benefit-has-benefit-type-code
      name: Benefit has BenefitTypeCode
      roles:
        - { id: r-benefit-has-code-benefit, player: ot-benefit, role_name: has }
        - { id: r-benefit-has-code-code, player: ot-benefit-type-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-benefit-has-code-benefit], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-benefit-has-code-code] }
        - { type: mandatory, role: r-benefit-has-code-benefit }
    - id: ft-statute-reference-has-citation
      name: StatuteReference has Citation
      roles:
        - { id: r-statute-has-citation-statute, player: ot-statute-reference, role_name: has }
        - { id: r-statute-has-citation-citation, player: ot-citation, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-statute-has-citation-statute], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-statute-has-citation-citation] }
        - { type: mandatory, role: r-statute-has-citation-statute }
    - id: ft-worker-has-worker-id
      name: Worker has WorkerId
      roles:
        - { id: r-worker-has-id-worker, player: ot-worker, role_name: has }
        - { id: r-worker-has-id-id, player: ot-worker-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-worker-has-id-worker], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-worker-has-id-id] }
        - { type: mandatory, role: r-worker-has-id-worker }
    - id: ft-supervisor-has-worker-id
      name: Supervisor has WorkerId
      roles:
        - { id: r-supervisor-has-id-supervisor, player: ot-supervisor, role_name: has }
        - { id: r-supervisor-has-id-id, player: ot-worker-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-supervisor-has-id-supervisor], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-supervisor-has-id-id] }
        - { type: mandatory, role: r-supervisor-has-id-supervisor }
    - id: ft-office-has-office-code
      name: Office has OfficeCode
      roles:
        - { id: r-office-has-code-office, player: ot-office, role_name: has }
        - { id: r-office-has-code-code, player: ot-office-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-office-has-code-office], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-office-has-code-code] }
        - { type: mandatory, role: r-office-has-code-office }
    - id: ft-verification-document-has-document-number
      name: VerificationDocument has DocumentNumber
      roles:
        - { id: r-document-has-number-document, player: ot-verification-document, role_name: has }
        - { id: r-document-has-number-number, player: ot-document-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-document-has-number-document], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-document-has-number-number] }
        - { type: mandatory, role: r-document-has-number-document }
    - id: ft-sanction-has-sanction-id
      name: Sanction has SanctionId
      roles:
        - { id: r-sanction-has-id-sanction, player: ot-sanction, role_name: has }
        - { id: r-sanction-has-id-id, player: ot-sanction-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-sanction-has-id-sanction], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-sanction-has-id-id] }
        - { type: mandatory, role: r-sanction-has-id-sanction }
    - id: ft-appeal-has-appeal-number
      name: Appeal has AppealNumber
      roles:
        - { id: r-appeal-has-number-appeal, player: ot-appeal, role_name: has }
        - { id: r-appeal-has-number-number, player: ot-appeal-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-appeal-has-number-appeal], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-appeal-has-number-number] }
        - { type: mandatory, role: r-appeal-has-number-appeal }

    # ---- clients and households --------------------------------------
    - id: ft-client-has-client-name
      name: Client has ClientName
      roles:
        - { id: r-client-has-name-client, player: ot-client, role_name: has }
        - { id: r-client-has-name-name, player: ot-client-name, role_name: is of }
      readings: ["{0} has {1}", "{1} is of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-client-has-name-client] }
        - { type: mandatory, role: r-client-has-name-client }
    - id: ft-client-was-born-on-date-of-birth
      name: Client was born on DateOfBirth
      roles:
        - { id: r-client-born-on-client, player: ot-client, role_name: was born on }
        - { id: r-client-born-on-date, player: ot-date-of-birth, role_name: is birth date of }
      readings: ["{0} was born on {1}", "{1} is birth date of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-client-born-on-client] }
        - { type: mandatory, role: r-client-born-on-client }
    - id: ft-client-has-citizenship-status
      name: Client has CitizenshipStatus
      roles:
        - { id: r-client-has-citizenship-client, player: ot-client, role_name: has }
        - { id: r-client-has-citizenship-status, player: ot-citizenship-status, role_name: is verified for }
      readings: ["{0} has {1}", "{1} is verified for {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-client-has-citizenship-client] }
        - { type: mandatory, role: r-client-has-citizenship-client }
    - id: ft-client-is-a-member-of-household
      name: Client is a member of Household

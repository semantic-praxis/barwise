# ERP tables replicated into a lakehouse under their original names: a
# client column on every table, German-abbreviated columns, upper-case
# four-to-eight-letter tables, catalog.schema qualification, and one
# five-hundred-column table among the extras.
dialect: databricks
naming:
  table_case: upper
  column_case: upper
  abbreviate: true
  max_identifier: 30
  abbreviations:
    Material: MAT
    Plant: WERK
    StorageLocation: LGORT
    Supplier: LIFNR
    PurchaseOrder: EKKO
    WorkOrder: AUFK
    Routing: PLKO
    Operation: PLPO
    WorkCenter: ARBPL
    Batch: CHARG
    Quantity: MENGE
    UnitOfMeasure: MEINS
    Number: NR
    Description: TXT
idioms:
  schema_qualified: "erp_bronze.sap."
  quoting: backticks
  check_constraints: false
  comments: true
  table_suffix: "USING DELTA"
types:
  text: STRING
  integer: INT
  decimal: DECIMAL(13,3)
  date: DATE
  datetime: TIMESTAMP
  boolean: STRING
  id: STRING
extra_tables:
  - |
    CREATE TABLE erp_bronze.sap.MARA (
      MANDT STRING NOT NULL,
      MATNR STRING NOT NULL,
      ERSDA DATE,
      ERNAM STRING,
      MTART STRING,
      MBRSH STRING,
      MATKL STRING,
      MEINS STRING,
      BRGEW DECIMAL(13,3),
      NTGEW DECIMAL(13,3),
      GEWEI STRING,
      VOLUM DECIMAL(13,3),
      VOLEH STRING,
      XCHPF STRING,
      CONSTRAINT PK_MARA PRIMARY KEY (MANDT, MATNR)
    ) USING DELTA PARTITIONED BY (MANDT)
  - |
    CREATE TABLE erp_bronze.sap.MARC (
      MANDT STRING NOT NULL,
      MATNR STRING NOT NULL,
      WERKS STRING NOT NULL,
      PSTAT STRING,
      LVORM STRING,
      DISMM STRING,
      DISPO STRING,
      PLIFZ DECIMAL(3,0),
      EISBE DECIMAL(13,3),
      CONSTRAINT PK_MARC PRIMARY KEY (MANDT, MATNR, WERKS),
      CONSTRAINT FK_MARC_MARA FOREIGN KEY (MANDT, MATNR) REFERENCES erp_bronze.sap.MARA (MANDT, MATNR)
    ) USING DELTA
  - |
    CREATE TABLE erp_bronze.sap.MAKT (
      MANDT STRING NOT NULL,
      MATNR STRING NOT NULL,
      SPRAS STRING NOT NULL,
      MAKTX STRING,
      MAKTG STRING,
      CONSTRAINT PK_MAKT PRIMARY KEY (MANDT, MATNR, SPRAS)
    ) USING DELTA
  - |
    CREATE TABLE erp_bronze.sap.STPO (
      MANDT STRING NOT NULL,
      STLTY STRING NOT NULL,
      STLNR STRING NOT NULL,
      STLKN STRING NOT NULL,
      STPOZ STRING NOT NULL,
      IDNRK STRING,
      MENGE DECIMAL(13,3),
      MEINS STRING,
      POSTP STRING,
      CONSTRAINT PK_STPO PRIMARY KEY (MANDT, STLTY, STLNR, STLKN, STPOZ)
    ) USING DELTA

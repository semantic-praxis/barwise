# The sponsor's clinical database exports one table per SDTM domain in
# plain ANSI DDL: upper-case identifiers, double quotes, and the load
# team's comments between statements. The extra_tables are the five
# domain tables as the export writes them, with the sponsor's own load
# columns (LOADDTC, LOADSRC) alongside the public SDTM variables; the
# generator's tables carry the kernel's entities in the same idiom.
dialect: ansi
naming:
  table_case: upper
  column_case: upper
  table_prefix: ""
  abbreviate: false
  max_identifier: 63
  abbreviations: {}
idioms:
  schema_qualified: false
  if_not_exists: false
  quoting: double
  lookup_tables: ""
  inline_pk: false
  check_constraints: true
  engine_suffix: false
  comments: true
  missing_semicolon_every: 0
  extension_tables: false
types:
  text: VARCHAR
  integer: INTEGER
  decimal: DECIMAL(18,4)
  date: DATE
extra_tables:
  - |
    -- DM: one row per subject, screen failures included
    CREATE TABLE "DM" (
      "STUDYID" VARCHAR(20) NOT NULL,
      "DOMAIN" CHAR(2) NOT NULL,
      "USUBJID" VARCHAR(40) NOT NULL,
      "SUBJID" VARCHAR(20) NOT NULL,
      "RFSTDTC" VARCHAR(19),
      "RFENDTC" VARCHAR(19),
      "RFXSTDTC" VARCHAR(19),
      "RFXENDTC" VARCHAR(19),
      "RFICDTC" VARCHAR(19),
      "RFPENDTC" VARCHAR(19),
      "DTHDTC" VARCHAR(19),
      "DTHFL" CHAR(1),
      "SITEID" VARCHAR(10) NOT NULL,
      "INVID" VARCHAR(20),
      "INVNAM" VARCHAR(200),
      "BRTHDTC" VARCHAR(10),
      "AGE" INTEGER,
      "AGEU" VARCHAR(10),
      "SEX" CHAR(1) NOT NULL,
      "RACE" VARCHAR(60),
      "ETHNIC" VARCHAR(60),
      "ARMCD" VARCHAR(20),
      "ARM" VARCHAR(200),
      "ACTARMCD" VARCHAR(20),
      "ACTARM" VARCHAR(200),
      "ARMNRS" VARCHAR(200),
      "ACTARMUD" VARCHAR(200),
      "COUNTRY" CHAR(3) NOT NULL,
      "DMDTC" VARCHAR(19),
      "DMDY" INTEGER,
      "SCRNFL" CHAR(1),
      "SCRFREAS" VARCHAR(200),
      "ENRLDTC" VARCHAR(10),
      "RANDDTC" VARCHAR(10),
      "RANDNUM" VARCHAR(20),
      "STRATA1" VARCHAR(40),
      "STRATA2" VARCHAR(40),
      "DMSEQ" INTEGER,
      "PROTVER" VARCHAR(10),
      "PROTAMND" INTEGER,
      "CRFVER" VARCHAR(10),
      "LOADDTC" TIMESTAMP,
      "LOADSRC" VARCHAR(40),
      CONSTRAINT "PK_DM" PRIMARY KEY ("STUDYID", "USUBJID"),
      CONSTRAINT "UK_DM_SUBJ" UNIQUE ("STUDYID", "SITEID", "SUBJID"),
      CONSTRAINT "CK_DM_SEX" CHECK ("SEX" IN ('M', 'F', 'U'))
    );
  - |
    /* AE: one row per adverse event per subject; AEFUPSEQ points at the event this one follows up */
    CREATE TABLE "AE" (
      "STUDYID" VARCHAR(20) NOT NULL,
      "DOMAIN" CHAR(2) NOT NULL,
      "USUBJID" VARCHAR(40) NOT NULL,
      "AESEQ" INTEGER NOT NULL,
      "AEGRPID" VARCHAR(20),
      "AEREFID" VARCHAR(40),
      "AESPID" VARCHAR(20),
      "AETERM" VARCHAR(200) NOT NULL,
      "AEMODIFY" VARCHAR(200),
      "AELLT" VARCHAR(100),
      "AELLTCD" INTEGER,
      "AEDECOD" VARCHAR(100),
      "AEPTCD" INTEGER,
      "AEHLT" VARCHAR(100),
      "AEHLTCD" INTEGER,
      "AEHLGT" VARCHAR(100),
      "AEHLGTCD" INTEGER,
      "AECAT" VARCHAR(100),
      "AESCAT" VARCHAR(100),
      "AEPRESP" CHAR(1),
      "AEBODSYS" VARCHAR(100),
      "AEBDSYCD" INTEGER,
      "AESOC" VARCHAR(100),
      "AESOCCD" INTEGER,
      "AELOC" VARCHAR(100),
      "AESEV" VARCHAR(10) NOT NULL,
      "AESER" CHAR(1) NOT NULL,
      "AEACN" VARCHAR(40),
      "AEACNOTH" VARCHAR(200),
      "AEREL" VARCHAR(40),
      "AERELNST" VARCHAR(200),
      "AEPATT" VARCHAR(40),
      "AEOUT" VARCHAR(40),
      "AESCAN" CHAR(1),
      "AESCONG" CHAR(1),
      "AESDISAB" CHAR(1),
      "AESDTH" CHAR(1),
      "AESHOSP" CHAR(1),
      "AESLIFE" CHAR(1),
      "AESOD" CHAR(1),
      "AESMIE" CHAR(1),
      "AECONTRT" CHAR(1),
      "AETOXGR" VARCHAR(10),
      "AESTDTC" VARCHAR(19) NOT NULL,
      "AEENDTC" VARCHAR(19),
      "AESTDY" INTEGER,
      "AEENDY" INTEGER,
      "AEDUR" VARCHAR(20),
      "AEENRF" VARCHAR(20),
      "AEENRTPT" VARCHAR(20),
      "AEENTPT" VARCHAR(40),
      "AEAWDTC" VARCHAR(19),
      "AERPTDTC" VARCHAR(19),
      "AEFUPSEQ" INTEGER,
      CONSTRAINT "PK_AE" PRIMARY KEY ("STUDYID", "USUBJID", "AESEQ"),
      CONSTRAINT "FK_AE_DM" FOREIGN KEY ("STUDYID", "USUBJID") REFERENCES "DM" ("STUDYID", "USUBJID"),
      CONSTRAINT "FK_AE_FUP" FOREIGN KEY ("STUDYID", "USUBJID", "AEFUPSEQ") REFERENCES "AE" ("STUDYID", "USUBJID", "AESEQ"),
      CONSTRAINT "CK_AE_SEV" CHECK ("AESEV" IN ('MILD', 'MODERATE', 'SEVERE')),
      CONSTRAINT "CK_AE_SER" CHECK ("AESER" IN ('Y', 'N'))
    );
  - |
    -- VS: vital signs, one row per test per visit per subject
    CREATE TABLE "VS" (
      "STUDYID" VARCHAR(20) NOT NULL,
      "DOMAIN" CHAR(2) NOT NULL,
      "USUBJID" VARCHAR(40) NOT NULL,
      "VSSEQ" INTEGER NOT NULL,
      "VSGRPID" VARCHAR(20),
      "VSSPID" VARCHAR(20),
      "VSTESTCD" VARCHAR(8) NOT NULL,
      "VSTEST" VARCHAR(40) NOT NULL,
      "VSCAT" VARCHAR(100),
      "VSSCAT" VARCHAR(100),
      "VSPOS" VARCHAR(20),
      "VSORRES" VARCHAR(40),
      "VSORRESU" VARCHAR(20),
      "VSSTRESC" VARCHAR(40),
      "VSSTRESN" DECIMAL(18,4),
      "VSSTRESU" VARCHAR(20),
      "VSSTAT" VARCHAR(10),
      "VSREASND" VARCHAR(200),
      "VSLOC" VARCHAR(40),
      "VSLAT" VARCHAR(10),
      "VSBLFL" CHAR(1),
      "VSDRVFL" CHAR(1),
      "VSEVAL" VARCHAR(40),
      "VISITNUM" DECIMAL(6,2) NOT NULL,
      "VISIT" VARCHAR(40),
      "VISITDY" INTEGER,
      "EPOCH" VARCHAR(40),
      "VSDTC" VARCHAR(19),
      "VSDY" INTEGER,
      "VSTPT" VARCHAR(40),
      "VSTPTNUM" DECIMAL(6,2),
      "VSELTM" VARCHAR(20),
      "VSTPTREF" VARCHAR(40),
      "VSRFTDTC" VARCHAR(19),
      "VSCLSIG" CHAR(1),
      "VSLOBXFL" CHAR(1),
      "VSREPNUM" INTEGER,
      "VSMETHOD" VARCHAR(40),
      "VSDEVID" VARCHAR(40),
      "LOADDTC" TIMESTAMP,
      "LOADSRC" VARCHAR(40),
      CONSTRAINT "PK_VS" PRIMARY KEY ("STUDYID", "USUBJID", "VSSEQ"),
      CONSTRAINT "FK_VS_DM" FOREIGN KEY ("STUDYID", "USUBJID") REFERENCES "DM" ("STUDYID", "USUBJID")
    );
  - |
    -- LB: laboratory results from the central lab, one row per test per specimen
    CREATE TABLE "LB" (
      "STUDYID" VARCHAR(20) NOT NULL,
      "DOMAIN" CHAR(2) NOT NULL,
      "USUBJID" VARCHAR(40) NOT NULL,
      "LBSEQ" INTEGER NOT NULL,
      "LBGRPID" VARCHAR(20),
      "LBREFID" VARCHAR(40),
      "LBSPID" VARCHAR(20),
      "LBTESTCD" VARCHAR(8) NOT NULL,
      "LBTEST" VARCHAR(40) NOT NULL,
      "LBCAT" VARCHAR(100),
      "LBSCAT" VARCHAR(100),
      "LBORRES" VARCHAR(40),
      "LBORRESU" VARCHAR(20),
      "LBORNRLO" VARCHAR(40),
      "LBORNRHI" VARCHAR(40),
      "LBSTRESC" VARCHAR(40),
      "LBSTRESN" DECIMAL(18,4),
      "LBSTRESU" VARCHAR(20),
      "LBSTNRLO" DECIMAL(18,4),
      "LBSTNRHI" DECIMAL(18,4),
      "LBSTNRC" VARCHAR(40),
      "LBNRIND" VARCHAR(10),
      "LBSTAT" VARCHAR(10),
      "LBREASND" VARCHAR(200),
      "LBNAM" VARCHAR(100),
      "LBLOINC" VARCHAR(10),
      "LBSPEC" VARCHAR(40),
      "LBSPCCND" VARCHAR(40),
      "LBMETHOD" VARCHAR(40),
      "LBBLFL" CHAR(1),
      "LBFAST" CHAR(1),
      "LBDRVFL" CHAR(1),
      "LBTOX" VARCHAR(40),
      "LBTOXGR" VARCHAR(10),
      "LBLOBXFL" CHAR(1),
      "VISITNUM" DECIMAL(6,2) NOT NULL,
      "VISIT" VARCHAR(40),
      "VISITDY" INTEGER,
      "EPOCH" VARCHAR(40),
      "LBDTC" VARCHAR(19),
      "LBENDTC" VARCHAR(19),
      "LBDY" INTEGER,
      "LBENDY" INTEGER,
      "LBTPT" VARCHAR(40),
      "LBTPTNUM" DECIMAL(6,2),
      CONSTRAINT "PK_LB" PRIMARY KEY ("STUDYID", "USUBJID", "LBSEQ"),
      CONSTRAINT "FK_LB_DM" FOREIGN KEY ("STUDYID", "USUBJID") REFERENCES "DM" ("STUDYID", "USUBJID"),
      CONSTRAINT "CK_LB_NRIND" CHECK ("LBNRIND" IN ('LOW', 'NORMAL', 'HIGH', 'ABNORMAL'))
    );
  - |
    /* EX: exposure as administered; EXTRT is the treatment, EXDOSE and EXDOSU the dose */
    CREATE TABLE "EX" (
      "STUDYID" VARCHAR(20) NOT NULL,
      "DOMAIN" CHAR(2) NOT NULL,
      "USUBJID" VARCHAR(40) NOT NULL,
      "EXSEQ" INTEGER NOT NULL,
      "EXGRPID" VARCHAR(20),
      "EXREFID" VARCHAR(40),
      "EXSPID" VARCHAR(20),
      "EXLNKID" VARCHAR(40),
      "EXLNKGRP" VARCHAR(40),
      "EXTRT" VARCHAR(40) NOT NULL,
      "EXCAT" VARCHAR(100),
      "EXSCAT" VARCHAR(100),
      "EXDOSE" DECIMAL(18,3),
      "EXDOSTXT" VARCHAR(40),
      "EXDOSU" VARCHAR(10),
      "EXDOSFRM" VARCHAR(40),
      "EXDOSFRQ" VARCHAR(20),
      "EXDOSRGM" VARCHAR(100),
      "EXROUTE" VARCHAR(40),
      "EXLOT" VARCHAR(40),
      "EXLOC" VARCHAR(40),
      "EXLAT" VARCHAR(10),
      "EXDIR" VARCHAR(20),
      "EXFAST" CHAR(1),
      "EXADJ" VARCHAR(200),
      "EXVAMT" DECIMAL(18,3),
      "EXVAMTU" VARCHAR(10),
      "EPOCH" VARCHAR(40),
      "VISITNUM" DECIMAL(6,2),
      "VISIT" VARCHAR(40),
      "VISITDY" INTEGER,
      "EXSTDTC" VARCHAR(19) NOT NULL,
      "EXENDTC" VARCHAR(19),
      "EXSTDY" INTEGER,
      "EXENDY" INTEGER,
      "EXDUR" VARCHAR(20),
      "EXTPT" VARCHAR(40),
      "EXTPTNUM" DECIMAL(6,2),
      "EXELTM" VARCHAR(20),
      "EXTPTREF" VARCHAR(40),
      "EXRFTDTC" VARCHAR(19),
      "EXSTRTPT" VARCHAR(20),
      "EXSTTPT" VARCHAR(40),
      "EXENRTPT" VARCHAR(20),
      "EXENTPT" VARCHAR(40),
      CONSTRAINT "PK_EX" PRIMARY KEY ("STUDYID", "USUBJID", "EXSEQ"),
      CONSTRAINT "FK_EX_DM" FOREIGN KEY ("STUDYID", "USUBJID") REFERENCES "DM" ("STUDYID", "USUBJID"),
      CONSTRAINT "CK_EX_DOSU" CHECK ("EXDOSU" IN ('mg', 'mg/kg', 'ug', 'g', 'mL', 'IU', 'TABLET', 'CAPSULE'))
    );

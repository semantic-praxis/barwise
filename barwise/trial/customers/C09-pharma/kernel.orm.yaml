    - { id: st-enrolled-subject, subtype: ot-enrolled-subject, supertype: ot-subject, is_exclusive: true }
    - { id: st-randomized-subject, subtype: ot-randomized-subject, supertype: ot-enrolled-subject }
    - { id: st-serious-adverse-event, subtype: ot-serious-adverse-event, supertype: ot-adverse-event }

  objectified_fact_types:
    - id: oft-protocol-amendment
      fact_type: ft-protocol-is-amended-by-amendment-number
      object_type: ot-protocol-amendment
    - id: oft-exposure
      fact_type: ft-subject-receives-dose-of-treatment
      object_type: ot-exposure

  definitions:
    - term: Subject
      definition: In data management, anyone with a USUBJID, screen failures included; to the biostatistician, the analysis population starts at randomization. The two readings disagree on the denominator of every table.
      context: data-management
    - term: Visit
      definition: The protocol-defined assessment window; sites use the word for any contact, which is why unscheduled visits carry decimal numbers.
      context: subjects
    - term: Site
      definition: The investigational location that screens a subject; a subject who transfers keeps the USUBJID and gains a second site, which the composite key does not allow.
      context: protocol

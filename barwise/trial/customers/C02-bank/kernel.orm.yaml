orm_version: "1.1"
model:
  name: Northgate Bancorp core banking kernel
  note: "Seed model for trial customer C02. Account is deliberately three different things here: a DepositAccount (deposits), a LoanAccount (lending) and a GeneralLedgerAccount (ledger). Readings in each context use the bare word Account so the collision is visible to anyone who merges the contexts without a mapping."
  object_types:
    - id: ot-party
      name: Party
      kind: entity
      reference_mode: party_id
      definition: A legal entity or natural person with which the bank has, or is assessing, a relationship.
    - id: ot-legal-entity
      name: LegalEntity
      kind: entity
      reference_mode: party_id
      definition: A Party that is an organization recognized in law, such as a corporation, partnership or trust.
    - id: ot-natural-person
      name: NaturalPerson
      kind: entity
      reference_mode: party_id
      definition: A Party that is an individual human being.
    - id: ot-party-id
      name: PartyId
      kind: value
      definition: The bank-assigned identifier of a Party, issued once at first contact and never reused.
      data_type:
        name: text
        length: 20
    - id: ot-legal-name
      name: LegalName
      kind: value
      definition: The name under which a Party is legally known.
      data_type:
        name: text
        length: 200
    - id: ot-tax-identifier
      name: TaxIdentifier
      kind: value
      definition: The tax identification number a Party reports to a tax authority; not unique, because affiliates may file under one number.
      data_type:
        name: text
        length: 20
    - id: ot-kyc-status
      name: KycStatus
      kind: value
      definition: The outcome of know-your-customer due diligence on a Party.
      value_constraint:
        values:
          - not_started
          - pending
          - verified
          - refused
          - expired
      data_type:
        name: text
        length: 20
    - id: ot-kyc-screening-date
      name: KycScreeningDate
      kind: value
      definition: The date on which a Party was last screened against sanctions and watch lists.
      data_type:
        name: date
    - id: ot-date-of-birth
      name: DateOfBirth
      kind: value
      definition: The birth date of a NaturalPerson as evidenced by an identity document.
      data_type:
        name: date
    - id: ot-given-name
      name: GivenName
      kind: value
      definition: The given name of a NaturalPerson.
      data_type:
        name: text
        length: 100
    - id: ot-family-name
      name: FamilyName
      kind: value
      definition: The family name of a NaturalPerson.
      data_type:
        name: text
        length: 100
    - id: ot-legal-entity-identifier
      name: LegalEntityIdentifier
      kind: value
      definition: The 20-character ISO 17442 identifier assigned to a LegalEntity by a local operating unit.
      data_type:
        name: text
        length: 20
    - id: ot-incorporation-jurisdiction
      name: IncorporationJurisdiction
      kind: value
      definition: The jurisdiction under whose law a LegalEntity was formed.
      data_type:
        name: text
        length: 60
    - id: ot-ownership-percent
      name: OwnershipPercent
      kind: value
      definition: The percentage of a LegalEntity beneficially owned by a NaturalPerson.
      value_constraint:
        ranges:
          - min: "0"
            max: "100"
            min_inclusive: false
            max_inclusive: true
      data_type:
        name: decimal
        length: 5
        scale: 2
    - id: ot-deposit-account
      name: DepositAccount
      kind: entity
      reference_mode: deposit_account_id
      definition: A contract under which the bank holds funds on behalf of one or more Parties and owes them the balance.
    - id: ot-deposit-account-id
      name: DepositAccountId
      kind: value
      definition: The internal surrogate identifier of a DepositAccount in the core banking system.
      data_type:
        name: text
        length: 20
    - id: ot-account-holder
      name: AccountHolder
      kind: entity
      reference_mode: account_holder_id
      definition: The relationship in which a Party holds a DepositAccount, carrying the role that Party plays on it.
    - id: ot-account-holder-id
      name: AccountHolderId
      kind: value
      definition: The identifier of an AccountHolder relationship.
      data_type:
        name: text
        length: 20
    - id: ot-holder-role
      name: HolderRole
      kind: value
      definition: The capacity in which a Party holds a DepositAccount.
      value_constraint:
        values:
          - primary
          - joint
          - authorized_signer
          - custodian
          - beneficiary
      data_type:
        name: text
        length: 20
    - id: ot-established-date
      name: EstablishedDate
      kind: value
      definition: The date on which an AccountHolder relationship was established.
      data_type:
        name: date
    - id: ot-routing-number
      name: RoutingNumber
      kind: value
      definition: The nine-digit ABA routing transit number that identifies the Branch through which a DepositAccount is addressed for payments.
      data_type:
        name: text
        length: 9
    - id: ot-account-number
      name: AccountNumber
      kind: value
      definition: The customer-facing number of a DepositAccount, unique only within a RoutingNumber.
      data_type:
        name: text
        length: 17
    - id: ot-account-status
      name: AccountStatus
      kind: value
      definition: The lifecycle state of a DepositAccount or LoanAccount.
      value_constraint:
        values:
          - pending
          - open
          - dormant
          - frozen
          - closed
      data_type:
        name: text
        length: 20
    - id: ot-ledger-balance
      name: LedgerBalance
      kind: value
      definition: The balance of a DepositAccount after all posted transactions, before holds.
      data_type: &a1
        name: money
        length: 18
        scale: 2
    - id: ot-open-date
      name: OpenDate
      kind: value
      definition: The date on which an account was opened.
      data_type:
        name: date
    - id: ot-close-date
      name: CloseDate
      kind: value
      definition: The date on which an account was closed.
      data_type:
        name: date
    - id: ot-branch
      name: Branch
      kind: entity
      reference_mode: branch_code
      definition: A physical or virtual office of the bank at which accounts are domiciled.
    - id: ot-branch-code
      name: BranchCode
      kind: value
      definition: The bank-assigned code of a Branch.
      data_type:
        name: text
        length: 10
    - id: ot-branch-name
      name: BranchName
      kind: value
      definition: The public name of a Branch.
      data_type:
        name: text
        length: 100
    - id: ot-product
      name: Product
      kind: entity
      reference_mode: product_code
      definition: A deposit or loan offering with defined terms under which accounts are opened.
    - id: ot-product-code
      name: ProductCode
      kind: value
      definition: The code of a Product in the product catalog.
      data_type:
        name: text
        length: 10
    - id: ot-product-family
      name: ProductFamily
      kind: value
      definition: The family a Product belongs to.
      value_constraint:
        values:
          - checking
          - savings
          - time_deposit
          - term_loan
          - line_of_credit
          - mortgage
      data_type:
        name: text
        length: 20
    - id: ot-currency
      name: Currency
      kind: entity
      reference_mode: currency_code
      definition: A currency in which accounts and transactions are denominated.
    - id: ot-currency-code
      name: CurrencyCode
      kind: value
      definition: The ISO 4217 three-letter code of a Currency.
      data_type:
        name: text
        length: 3
    - id: ot-loan-account
      name: LoanAccount
      kind: entity
      reference_mode: loan_account_id
      definition: A contract under which the bank has advanced funds to a Party and is owed principal and interest.
    - id: ot-loan-account-id
      name: LoanAccountId
      kind: value
      definition: The internal surrogate identifier of a LoanAccount in the lending system.
      data_type:
        name: text
        length: 20
    - id: ot-principal-amount
      name: PrincipalAmount
      kind: value
      definition: The amount originally advanced under a LoanAccount.
      data_type: *a1
    - id: ot-maturity-date
      name: MaturityDate
      kind: value
      definition: The date on which the outstanding balance of a LoanAccount falls due.
      data_type:
        name: date
    - id: ot-interest-rate
      name: InterestRate
      kind: entity
      reference_mode: rate_id
      definition: A rate applied to a LoanAccount over a period of validity, recorded with the period during which the bank believed it to be in effect.
    - id: ot-rate-id
      name: RateId
      kind: value
      definition: The identifier of an InterestRate record.
      data_type:
        name: text
        length: 20
    - id: ot-rate-percent
      name: RatePercent
      kind: value
      definition: The annual percentage rate of an InterestRate.
      data_type:
        name: decimal
        length: 7
        scale: 4
    - id: ot-effective-from-date
      name: EffectiveFromDate
      kind: value
      definition: The first date on which an InterestRate applies in the real world (valid time start).
      data_type:
        name: date
    - id: ot-effective-to-date
      name: EffectiveToDate
      kind: value
      definition: The last date on which an InterestRate applies in the real world (valid time end); absent while open-ended.
      data_type:
        name: date
    - id: ot-recorded-from-date
      name: RecordedFromDate
      kind: value
      definition: The date on which the bank's system first recorded an InterestRate as effective (transaction time start).
      data_type:
        name: date
    - id: ot-recorded-to-date
      name: RecordedToDate
      kind: value
      definition: The date on which the bank's system superseded its record of an InterestRate (transaction time end); absent while current.
      data_type:
        name: date
    - id: ot-general-ledger-account
      name: GeneralLedgerAccount
      kind: entity
      reference_mode: gl_account_code
      definition: A line in the chart of accounts to which financial transactions are posted for financial reporting.
    - id: ot-gl-account-code
      name: GlAccountCode
      kind: value
      definition: The code of a GeneralLedgerAccount in the chart of accounts.
      data_type:
        name: text
        length: 12
    - id: ot-gl-account-name
      name: GlAccountName
      kind: value
      definition: The descriptive name of a GeneralLedgerAccount.
      data_type:
        name: text
        length: 100
    - id: ot-gl-account-class
      name: GlAccountClass
      kind: value
      definition: The financial statement class of a GeneralLedgerAccount.
      value_constraint:
        values:
          - asset
          - liability
          - equity
          - income
          - expense
      data_type:
        name: text
        length: 20
    - id: ot-transaction
      name: Transaction
      kind: entity
      reference_mode: transaction_id
      definition: A single financial event recorded by the bank, posted to the general ledger and affecting at most one customer account.
    - id: ot-transaction-id
      name: TransactionId
      kind: value
      definition: The identifier of a Transaction, assigned by the posting engine.
      data_type:
        name: text
        length: 32
    - id: ot-transaction-type
      name: TransactionType
      kind: value
      definition: The code that classifies a Transaction for posting and reporting.
      value_constraint:
        values:
          - CASH_DEP
          - CASH_WDL
          - CHK_DEP
          - CHK_PAID
          - CHK_RETURN
          - ACH_CREDIT
          - ACH_DEBIT
          - ACH_RETURN
          - WIRE_IN
          - WIRE_OUT
          - WIRE_REVERSAL
          - CARD_POS
          - CARD_ATM
          - CARD_REFUND
          - CARD_CHARGEBACK
          - INT_CREDIT
          - INT_DEBIT
          - FEE_MAINT
          - FEE_OVERDRAFT
          - FEE_WIRE
          - FEE_REVERSAL
          - LOAN_DISB
          - LOAN_PMT_PRIN
          - LOAN_PMT_INT
          - LOAN_PMT_FEE
          - LOAN_PAYOFF
          - LOAN_CHARGEOFF
          - XFER_INT
          - XFER_EXT
          - SWEEP_IN
          - SWEEP_OUT
          - HOLD_PLACE
          - HOLD_RELEASE
          - GL_ADJ
          - GL_ACCRUAL
          - GL_REVERSAL
          - ESCHEAT
          - DORMANCY_FEE
      data_type:
        name: text
        length: 20
    - id: ot-transaction-date
      name: TransactionDate
      kind: value
      definition: The date and time at which a Transaction occurred.
      data_type:
        name: datetime
    - id: ot-posting-direction
      name: PostingDirection
      kind: value
      definition: Whether a Transaction debits or credits the account it posts to.
      value_constraint:
        values:
          - debit
          - credit
      data_type:
        name: text
        length: 6
    - id: ot-amount
      name: Amount
      kind: value
      definition: A monetary amount in the currency of the Transaction that carries it.
      data_type: *a1
  fact_types:
    - id: ft-party-has-party-id
      name: Party has PartyId
      roles:
        - id: r-party-has-party-id-0
          player: ot-party
          role_name: has
        - id: r-party-has-party-id-1
          player: ot-party-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-has-party-id-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-party-has-party-id-1
        - type: mandatory
          role: r-party-has-party-id-0
    - id: ft-deposit-account-has-deposit-account-id
      name: DepositAccount has DepositAccountId
      roles:
        - id: r-deposit-account-has-deposit-account-id-0
          player: ot-deposit-account
          role_name: has
        - id: r-deposit-account-has-deposit-account-id-1
          player: ot-deposit-account-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-deposit-account-has-deposit-account-id-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-deposit-account-has-deposit-account-id-1
        - type: mandatory
          role: r-deposit-account-has-deposit-account-id-0
    - id: ft-account-holder-has-account-holder-id
      name: AccountHolder has AccountHolderId
      roles:
        - id: r-account-holder-has-account-holder-id-0
          player: ot-account-holder
          role_name: has
        - id: r-account-holder-has-account-holder-id-1
          player: ot-account-holder-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-account-holder-has-account-holder-id-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-account-holder-has-account-holder-id-1
        - type: mandatory
          role: r-account-holder-has-account-holder-id-0
    - id: ft-branch-has-branch-code
      name: Branch has BranchCode
      roles:
        - id: r-branch-has-branch-code-0

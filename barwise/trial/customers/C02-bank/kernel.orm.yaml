            - r-branch-has-branch-code-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-branch-has-branch-code-1
        - type: mandatory
          role: r-branch-has-branch-code-0
    - id: ft-product-has-product-code
      name: Product has ProductCode
      roles:
        - id: r-product-has-product-code-0
          player: ot-product
          role_name: has
        - id: r-product-has-product-code-1
          player: ot-product-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-product-has-product-code-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-product-has-product-code-1
        - type: mandatory
          role: r-product-has-product-code-0
    - id: ft-currency-has-currency-code
      name: Currency has CurrencyCode
      roles:
        - id: r-currency-has-currency-code-0
          player: ot-currency
          role_name: has
        - id: r-currency-has-currency-code-1
          player: ot-currency-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-currency-has-currency-code-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-currency-has-currency-code-1
        - type: mandatory
          role: r-currency-has-currency-code-0
    - id: ft-loan-account-has-loan-account-id
      name: LoanAccount has LoanAccountId
      roles:
        - id: r-loan-account-has-loan-account-id-0
          player: ot-loan-account
          role_name: has
        - id: r-loan-account-has-loan-account-id-1
          player: ot-loan-account-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-loan-account-has-loan-account-id-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-loan-account-has-loan-account-id-1
        - type: mandatory
          role: r-loan-account-has-loan-account-id-0
    - id: ft-interest-rate-has-rate-id
      name: InterestRate has RateId
      roles:
        - id: r-interest-rate-has-rate-id-0
          player: ot-interest-rate
          role_name: has
        - id: r-interest-rate-has-rate-id-1
          player: ot-rate-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-interest-rate-has-rate-id-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-interest-rate-has-rate-id-1
        - type: mandatory
          role: r-interest-rate-has-rate-id-0
    - id: ft-general-ledger-account-has-gl-account-code
      name: GeneralLedgerAccount has GlAccountCode
      roles:
        - id: r-general-ledger-account-has-gl-account-code-0
          player: ot-general-ledger-account
          role_name: has
        - id: r-general-ledger-account-has-gl-account-code-1
          player: ot-gl-account-code
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-general-ledger-account-has-gl-account-code-0
          is_preferred: true
        - type: internal_uniqueness
          roles:
            - r-general-ledger-account-has-gl-account-code-1
        - type: mandatory
          role: r-general-ledger-account-has-gl-account-code-0
    - id: ft-transaction-has-transaction-id
      name: Transaction has TransactionId
      roles:
        - id: r-transaction-has-transaction-id-0
          player: ot-transaction
          role_name: has
        - id: r-transaction-has-transaction-id-1

    - id: ft-party-has-legal-name
      name: Party has LegalName
      roles:
        - id: r-party-has-legal-name-0
          player: ot-party
          role_name: has
        - id: r-party-has-legal-name-1
          player: ot-legal-name
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is legal name of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-has-legal-name-0
        - type: mandatory
          role: r-party-has-legal-name-0
    - id: ft-party-has-tax-identifier
      name: Party has TaxIdentifier
      roles:
        - id: r-party-has-tax-identifier-0
          player: ot-party
          role_name: has
        - id: r-party-has-tax-identifier-1
          player: ot-tax-identifier
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is tax identifier of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-has-tax-identifier-0
    - id: ft-party-has-kyc-status
      name: Party has KycStatus
      definition: Every Party ought to carry a KYC status; the obligation is deontic because legacy records predate the policy and are remediated over time.
      roles:
        - id: r-party-has-kyc-status-0
          player: ot-party
          role_name: has
        - id: r-party-has-kyc-status-1
          player: ot-kyc-status
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is KYC status of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-has-kyc-status-0
        - type: mandatory
          role: r-party-has-kyc-status-0
          modality: deontic
    - id: ft-party-was-screened-on-kyc-screening-date
      name: Party was screened on KycScreeningDate
      roles:
        - id: r-party-was-screened-on-kyc-screening-date-0
          player: ot-party
          role_name: was screened on
        - id: r-party-was-screened-on-kyc-screening-date-1
          player: ot-kyc-screening-date
          role_name: is screening date of
      readings:
        - "{0} was screened on {1}"
        - "{1} is screening date of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - r-party-was-screened-on-kyc-screening-date-0
    - id: ft-natural-person-has-date-of-birth

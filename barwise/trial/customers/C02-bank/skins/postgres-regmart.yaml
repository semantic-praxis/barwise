# The regulatory data mart: snake_case Postgres, IF NOT EXISTS, CHECK
# constraints inline, a schema prefix. The supported-dialect half of the
# same bank.
dialect: postgres
naming:
  table_case: snake
  column_case: snake
idioms:
  schema_qualified: "regmart."
  if_not_exists: true
  quoting: none
  check_constraints: true
  comments: true
  missing_semicolon_every: 0
extra_tables:
  - |
    CREATE TABLE IF NOT EXISTS regmart.bcbs239_lineage (
      lineage_id bigserial PRIMARY KEY,
      source_system text NOT NULL,
      source_table text NOT NULL,
      target_report text NOT NULL,
      transformation jsonb,
      recorded_at timestamptz NOT NULL DEFAULT now(),
      UNIQUE (source_system, source_table, target_report)
    )
  - |
    CREATE TABLE IF NOT EXISTS regmart.exposure_snapshot (
      as_of_date date NOT NULL,
      counterparty_lei char(20) NOT NULL,
      exposure_class text NOT NULL CHECK (exposure_class IN ('retail','corporate','sovereign','bank')),
      ead numeric(18,2) NOT NULL,
      lgd numeric(5,4) CHECK (lgd BETWEEN 0 AND 1),
      PRIMARY KEY (as_of_date, counterparty_lei, exposure_class)
    ) PARTITION BY RANGE (as_of_date)

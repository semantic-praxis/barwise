orm_version: "1.1"

# Trial customer C11, Product Analytics Platform.
# Hand-authored seed kernel for the enterprise trial (trial/AUTHORING.md).
# Greenfield: this customer has no legacy schema, only meetings and a
# Kotlin backend, so the kernel is what the transcripts converge on.
#
# Modeling difficulties carried on purpose:
#   - Every fact about Event is tenant-scoped: Event belongs to Tenant is
#     mandatory, and Tenant is a role in the external uniqueness keys
#     (tenant + event name, tenant + insert id, tenant + property name).
#   - User > IdentifiedUser > VerifiedUser is a three-level chain; the
#     anonymous/identified split is exclusive and exhaustive, and the
#     merge from anonymous to identified is a fact type of its own.
#   - Event carries EventProperty with PropertyValue is a ternary.
#   - Subscription objectifies Tenant subscribes to Plan.
#   - FunnelStep precedes FunnelStep is an acyclic, intransitive ring.
#   - The retention-expiry mandatory is deontic: policy, not fact.
#   - ReservedEventName carries 33 values; RetentionWindow and
#     ConversionWindow are ISO 8601 durations typed as `other`.

model:
  name: Product Analytics Platform
  domain_context: product-analytics

  object_types:
    - id: ot-tenant
      name: Tenant
      kind: entity
      reference_mode: tenant_id
      definition: A paying customer organization whose data is isolated from every other tenant's.
      source_context: tenancy
    - id: ot-tenant-id
      name: TenantId
      kind: value
      definition: The tenant id that identifies a Tenant.
      data_type:
        name: text
        length: 40
    - id: ot-data-region
      name: DataRegion
      kind: entity
      reference_mode: region_code
      definition: A geographic deployment in which a tenant's event data is stored and never leaves.
      source_context: tenancy
    - id: ot-region-code
      name: RegionCode
      kind: value
      definition: The region code that identifies a DataRegion.
      data_type:
        name: text
        length: 40
      value_constraint:
        values:
          - us-east
          - us-west
          - eu-central
          - eu-west
          - uk-south
          - ap-southeast
          - ap-northeast
          - ca-central
          - au-east
    - id: ot-workspace
      name: Workspace
      kind: entity
      reference_mode: workspace_id
      definition: A team-level grouping of projects within a tenant that shares members and settings.
      source_context: tenancy
    - id: ot-workspace-id
      name: WorkspaceId
      kind: value
      definition: The workspace id that identifies a Workspace.
      data_type:
        name: text
        length: 40
    - id: ot-project
      name: Project
      kind: entity
      reference_mode: project_id
      definition: "The unit an SDK sends events to; owns its own event definitions, keys and dashboards."
      source_context: tenancy
    - id: ot-project-id
      name: ProjectId
      kind: value
      definition: The project id that identifies a Project.
      data_type:
        name: text
        length: 40
    - id: ot-api-key
      name: ApiKey
      kind: entity
      reference_mode: api_key_id
      definition: A credential issued to a project that authorizes ingestion or read access.
      source_context: tenancy
    - id: ot-api-key-id
      name: ApiKeyId
      kind: value
      definition: The api key id that identifies a ApiKey.
      data_type:
        name: text
        length: 40
    - id: ot-service-account
      name: ServiceAccount
      kind: entity
      reference_mode: service_account_id
      definition: "A non-human principal, such as a backend job, that sends events through an API key."
      source_context: tenancy
    - id: ot-service-account-id
      name: ServiceAccountId
      kind: value
      definition: The service account id that identifies a ServiceAccount.
      data_type:
        name: text
        length: 40
    - id: ot-tenant-name
      name: TenantName
      kind: value
      definition: The organization name shown in the workspace switcher and on invoices.
      data_type:
        name: text
        length: 200
    - id: ot-api-key-scope
      name: ApiKeyScope
      kind: value
      definition: What an API key is allowed to do.
      data_type:
        name: text
        length: 10
      value_constraint:
        values:
          - ingest
          - read
          - admin
    - id: ot-api-key-hash
      name: ApiKeyHash
      kind: value
      definition: "The SHA-256 digest of an API key secret; the secret itself is never stored."
      data_type:
        name: text
        length: 64
    - id: ot-plan
      name: Plan
      kind: entity
      reference_mode: plan_code
      definition: A priced tier that fixes a tenant's monthly event quota and feature set.
      source_context: billing
    - id: ot-plan-code
      name: PlanCode
      kind: value
      definition: The plan code that identifies a Plan.
      data_type:
        name: text
        length: 40
    - id: ot-subscription
      name: Subscription
      kind: entity
      reference_mode: subscription_id
      definition: "A tenant's subscription to a plan, from a start date until superseded."
      source_context: billing
    - id: ot-subscription-id
      name: SubscriptionId
      kind: value

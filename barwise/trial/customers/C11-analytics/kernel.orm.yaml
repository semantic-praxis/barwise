      source_context: events
    - id: ot-identified-user
      name: IdentifiedUser
      kind: entity
      reference_mode: user_key
      definition: A user the customer's application has named with its own distinct id.
      source_context: events
    - id: ot-verified-user
      name: VerifiedUser
      kind: entity
      reference_mode: user_key
      definition: An identified user whose email address the customer's application has confirmed.
      source_context: events
    - id: ot-event-name
      name: EventName
      kind: value
      definition: "The event definition's name as sent by the SDK; unique within a tenant, reused freely across tenants."
      data_type:
        name: text
        length: 200
    - id: ot-reserved-event-name
      name: ReservedEventName
      kind: value
      definition: "An event name the platform itself emits or reserves; a customer definition that collides with one is remapped rather than ingested."
      data_type:
        name: text
        length: 40
      value_constraint:
        values:
          - "$identify"
          - "$pageview"
          - "$pageleave"
          - "$screen"
          - "$session_start"
          - "$session_end"
          - "$autocapture"
          - "$rageclick"
          - "$deadclick"
          - "$exception"
          - "$feature_flag_called"
          - "$set"
          - "$set_once"
          - "$unset"
          - "$merge"
          - "$alias"
          - "$create_alias"
          - "$groupidentify"
          - "$opt_in"
          - "$opt_out"
          - "$web_vitals"
          - "$heatmap"
          - "$app_open"
          - "$app_close"
          - "$app_install"
          - "$app_update"
          - "$push_received"
          - "$push_opened"
          - "$survey_shown"
          - "$survey_sent"
          - "$survey_dismissed"
          - "$experiment_exposure"
          - "$performance_event"
    - id: ot-insert-id
      name: InsertId
      kind: value
      definition: "The SDK-generated idempotency key of an event; within a tenant the same insert id is the same event."
      data_type:
        name: text
        length: 36
    - id: ot-event-timestamp
      name: EventTimestamp
      kind: value

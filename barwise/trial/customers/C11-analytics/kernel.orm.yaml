      definition: The number of events a plan allows a tenant to ingest per calendar month.
      data_type:
        name: integer
      value_constraint:
        ranges:
          - { min: "0" }
    - id: ot-subscription-start
      name: SubscriptionStart
      kind: value
      definition: "The date a subscription took effect, in the tenant's billing timezone."
      data_type:
        name: date
    - id: ot-event-definition
      name: EventDefinition
      kind: entity
      reference_mode: definition_id
      definition: "A named kind of event within one tenant, such as button_clicked; the taxonomy, not an occurrence."
      source_context: events
    - id: ot-definition-id
      name: DefinitionId
      kind: value
      definition: The definition id that identifies a EventDefinition.
      data_type:

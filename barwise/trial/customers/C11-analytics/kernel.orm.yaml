      source_context: events
    - id: ot-session-id
      name: SessionId
      kind: value
      definition: The session id that identifies a Session.
      data_type:
        name: text
        length: 40
    - id: ot-user
      name: User
      kind: entity
      reference_mode: user_key
      definition: "A person or device that performs events within one tenant, identified by an internal user key."
      source_context: events
    - id: ot-user-key
      name: UserKey
      kind: value
      definition: The user key that identifies a User.
      data_type:
        name: text
        length: 40
    - id: ot-anonymous-user
      name: AnonymousUser
      kind: entity

      data_type:
        name: timestamp
    - id: ot-retention-expiry-timestamp
      name: RetentionExpiryTimestamp
      kind: value
      definition: The moment after which an event must have been deleted under its tenant's retention window.
      data_type:
        name: timestamp
    - id: ot-property-name
      name: PropertyName
      kind: value
      definition: "The property's name as sent by the SDK; unique within a tenant."
      data_type:
        name: text
        length: 200
    - id: ot-property-type
      name: PropertyType
      kind: value
      definition: The value type the platform enforces for a property once it has been seen.
      data_type:
        name: text
        length: 10
      value_constraint:
        values:
          - string
          - number
          - boolean
          - datetime
          - list
          - object
    - id: ot-property-value
      name: PropertyValue
      kind: value
      definition: "The value an event carries for one property, stored as text and cast by the property's type."
      data_type:
        name: text
        length: 4000
    - id: ot-session-start
      name: SessionStart
      kind: value
      definition: The timestamp of the first event in a session.
      data_type:
        name: timestamp
    - id: ot-device-id
      name: DeviceId
      kind: value
      definition: The SDK-generated identifier persisted on a device before the user is identified.
      data_type:
        name: text
        length: 64
    - id: ot-distinct-id
      name: DistinctId

      data_type:
        name: text
        length: 40
    - id: ot-dashboard
      name: Dashboard
      kind: entity
      reference_mode: dashboard_id
      definition: A saved arrangement of funnels and other insights within a project.
      source_context: analysis
    - id: ot-dashboard-id
      name: DashboardId
      kind: value
      definition: The dashboard id that identifies a Dashboard.
      data_type:
        name: text
        length: 40
    - id: ot-step-order
      name: StepOrder
      kind: value
      definition: "The position of a step in its funnel, counted from one."
      data_type:
        name: integer
      value_constraint:
        ranges:
          - { min: "1", max: "20" }
    - id: ot-conversion-window
      name: ConversionWindow
      kind: value
      definition: The ISO 8601 duration within which a user must complete a funnel to count as converted.
      data_type:
        name: other
        length: 8
      value_constraint:
        values:
          - PT1H
          - PT24H
          - P1D
          - P7D
          - P14D
          - P30D
          - P90D

  fact_types:
    - id: ft-tenant-has-tenantid
      name: Tenant has TenantId
      roles:
        - id: r-tenant-has-tenantid-tenant
          player: ot-tenant
          role_name: has
        - id: r-tenant-has-tenantid-tenant-id
          player: ot-tenant-id
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles: [r-tenant-has-tenantid-tenant]
          is_preferred: true
        - type: internal_uniqueness
          roles: [r-tenant-has-tenantid-tenant-id]
        - type: mandatory

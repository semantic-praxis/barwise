  populations:
    - id: pop-event-carries-eventproperty-with-propertyvalue
      fact_type: ft-event-carries-eventproperty-with-propertyvalue
      description: "One checkout event carrying three properties; values are text and cast by property type."
      sample: true
      instances:
        - id: inst-event-carries-eventproperty-with-propertyvalue-1
          role_values:
            r-event-carries-eventproperty-with-propertyvalue-event: "evt-01J7Q4M3"
            r-event-carries-eventproperty-with-propertyvalue-event-property: "prop-cart_value"
            r-event-carries-eventproperty-with-propertyvalue-property-value: "129.90"
        - id: inst-event-carries-eventproperty-with-propertyvalue-2
          role_values:
            r-event-carries-eventproperty-with-propertyvalue-event: "evt-01J7Q4M3"
            r-event-carries-eventproperty-with-propertyvalue-event-property: "prop-currency"
            r-event-carries-eventproperty-with-propertyvalue-property-value: "EUR"
        - id: inst-event-carries-eventproperty-with-propertyvalue-3
          role_values:
            r-event-carries-eventproperty-with-propertyvalue-event: "evt-01J7Q4M3"
            r-event-carries-eventproperty-with-propertyvalue-event-property: "prop-is_first_order"
            r-event-carries-eventproperty-with-propertyvalue-property-value: "true"
    - id: pop-funnelstep-precedes-funnelstep
      fact_type: ft-funnelstep-precedes-funnelstep
      description: "A three-step signup funnel; only immediate predecessors are stored."
      sample: true
      instances:
        - id: inst-funnelstep-precedes-funnelstep-1
          role_values:
            r-funnelstep-precedes-funnelstep-funnel-step: "step-1"
            r-funnelstep-precedes-funnelstep-funnel-step-1: "step-2"
        - id: inst-funnelstep-precedes-funnelstep-2
          role_values:
            r-funnelstep-precedes-funnelstep-funnel-step: "step-2"
            r-funnelstep-precedes-funnelstep-funnel-step-1: "step-3"

  definitions:
    - term: Event
      definition: "An occurrence, not a kind: one button click, one page view, inside one tenant."
      context: events
    - term: Event definition
      definition: "The kind of an event, named by the customer and unique within the tenant."
      context: events
    - term: Identify
      definition: The SDK call that turns an anonymous user into an identified user and merges the anonymous history.
      context: events
    - term: Retention window
      definition: "How long a tenant's events are kept before deletion; obligatory on every event by policy, absent on pre-policy events in fact."
      context: tenancy
    - term: Tenant
      definition: "The isolation boundary; nothing about an event is meaningful outside its tenant."
      context: tenancy

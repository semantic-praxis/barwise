      data_type:
        name: text
        length: 254
    - id: ot-merged-at
      name: MergedAt
      kind: value
      definition: The moment an anonymous user's history was folded into an identified user.
      data_type:
        name: timestamp
    - id: ot-retention-window
      name: RetentionWindow
      kind: value
      definition: An ISO 8601 duration after which a tenant's events are deleted.
      data_type:
        name: other
        length: 8
      value_constraint:
        values:
          - P30D
          - P90D
          - P180D
          - P365D
          - P730D
          - P1095D
    - id: ot-cohort
      name: Cohort
      kind: entity
      reference_mode: cohort_id
      definition: A saved set of users within a project defined by a filter over their events and properties.
      source_context: analysis
    - id: ot-cohort-id
      name: CohortId
      kind: value
      definition: The cohort id that identifies a Cohort.
      data_type:
        name: text
        length: 40
    - id: ot-funnel
      name: Funnel
      kind: entity
      reference_mode: funnel_id
      definition: An ordered sequence of steps within a project measuring how many users progress from first to last.
      source_context: analysis
    - id: ot-funnel-id
      name: FunnelId
      kind: value
      definition: The funnel id that identifies a Funnel.
      data_type:
        name: text
        length: 40
    - id: ot-funnel-step
      name: FunnelStep
      kind: entity
      reference_mode: step_id

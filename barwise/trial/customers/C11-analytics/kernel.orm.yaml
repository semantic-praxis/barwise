        - type: ring
          role_1: r-funnelstep-precedes-funnelstep-funnel-step
          role_2: r-funnelstep-precedes-funnelstep-funnel-step-1
          ring_type: acyclic
        - type: ring
          role_1: r-funnelstep-precedes-funnelstep-funnel-step
          role_2: r-funnelstep-precedes-funnelstep-funnel-step-1
          ring_type: intransitive

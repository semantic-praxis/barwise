  subtype_facts:
    - id: sf-smart-meter-is-meter
      subtype: ot-smart-meter
      supertype: ot-meter
      provides_identification: true
    - id: sf-interval-meter-is-smart-meter
      subtype: ot-interval-meter
      supertype: ot-smart-meter
      provides_identification: true
  objectified_fact_types:
    - id: oft-service-agreement
      fact_type: ft-customer-takes-service
      object_type: ot-service-agreement
    - id: oft-interval-reading
      fact_type: ft-meter-records-reading
      object_type: ot-interval-reading
  definitions:
    - term: read
      definition: In metering, the value the meter reported for an interval or register; in billing, the quantity a bill was rendered from, which may be estimated.
      context: metering
    - term: estimated read
      definition: A billing quantity computed from history when no actual read was available for the cycle.
      context: customer

    - id: ft-feeder-feeds-feeder
      name: Feeder feeds Feeder
      definition: A feeder feeds another when a closed tie switch lets it carry the other's load during switching; the chain of feeds must never loop back to its origin.
      roles:
        - { id: r-feeder-feeds-source, player: ot-feeder, role_name: feeds }
        - { id: r-feeder-feeds-target, player: ot-feeder, role_name: is fed by }

orm_version: "1.0"

# C10: state university system, eight campuses, one student information
# system. The kernel carries the Banner-idiom difficulties the trial
# declares for this customer: cryptic naming lands in the skin, the
# ternary registration fact (PIDM + term + CRN) is irreducible, the
# student number is unique only within a campus, and FERPA is a deontic
# rule rather than a structural one.
model:
  name: "State University System"
  domain_context: "higher-education"
  note: >-
    Person is the single identity record (Banner's PIDM); Student,
    Employee, Faculty and GraduateStudent are subtypes that inherit it.
    The student number is a campus-scoped identifier, not a key.

  object_types:
    # ---- identity ---------------------------------------------------
    - id: "ot-person"
      name: "Person"
      kind: "entity"
      reference_mode: "pidm"
      definition: "Any individual the university system holds a record for, identified by a system-generated PIDM that never changes."
    - id: "ot-student"
      name: "Student"
      kind: "entity"
      reference_mode: "pidm"
      definition: "A person who has been admitted to and holds a student record at one of the eight campuses."
    - id: "ot-graduate-student"
      name: "GraduateStudent"
      kind: "entity"
      reference_mode: "pidm"
      definition: "A student pursuing a master's, doctoral, or graduate certificate program."
    - id: "ot-employee"
      name: "Employee"
      kind: "entity"
      reference_mode: "pidm"
      definition: "A person who holds or has held a paid position with the university system."
    - id: "ot-faculty"
      name: "Faculty"
      kind: "entity"
      reference_mode: "pidm"
      definition: "An employee appointed to an instructional or research rank who may teach sections and advise students."
    - id: "ot-campus"
      name: "Campus"
      kind: "entity"
      reference_mode: "campus_code"
      definition: "One of the eight physical campuses of the state university system, each with its own registrar."
    # ---- academics --------------------------------------------------
    - id: "ot-college"
      name: "College"
      kind: "entity"
      reference_mode: "college_code"
      definition: "An academic division of a campus that owns departments and degree programs."
    - id: "ot-department"
      name: "Department"
      kind: "entity"
      reference_mode: "department_code"
      definition: "An academic unit within a college that owns courses and employs faculty."
    - id: "ot-course"
      name: "Course"
      kind: "entity"
      reference_mode: "course_id"
      definition: "A catalog entry such as MATH 1010, defined by subject and course number, that sections are offered against."
    - id: "ot-course-section"
      name: "CourseSection"
      kind: "entity"
      reference_mode: "crn"
      definition: "A scheduled offering of a course in a term, identified by a course reference number (CRN) that is reused across terms."
    - id: "ot-term"
      name: "Term"
      kind: "entity"
      reference_mode: "term_code"
      definition: "An academic period such as Fall 2026 (202610) during which sections are offered and enrollments are recorded."
    - id: "ot-grade"
      name: "Grade"
      kind: "entity"
      reference_mode: "grade_code"
      definition: "A mark from the grading scale, such as A- or W, that carries quality points and a GPA treatment."
    - id: "ot-degree-program"
      name: "DegreeProgram"
      kind: "entity"
      reference_mode: "program_code"
      definition: "A credential-bearing curriculum, such as BS-CHEM, offered by a college."
    - id: "ot-enrollment"
      name: "Enrollment"
      kind: "entity"
      reference_mode: "enrollment_id"
      definition: "The objectified fact that a student is registered in a section for a term; it carries the status, credit hours and grade."
    # ---- financial aid ----------------------------------------------
    - id: "ot-financial-aid-award"
      name: "FinancialAidAward"
      kind: "entity"
      reference_mode: "award_number"
      definition: "An offer of aid from one fund to one student for one aid year."
    - id: "ot-aid-fund"
      name: "AidFund"
      kind: "entity"
      reference_mode: "fund_code"
      definition: "A source of financial aid money, such as the federal Pell grant or a campus scholarship fund."
    - id: "ot-aid-year"
      name: "AidYear"
      kind: "entity"
      reference_mode: "aid_year_code"
      definition: "The July-to-June award year, such as 2627, that financial aid is packaged for."
    # ---- records ----------------------------------------------------
    - id: "ot-transcript-record"
      name: "TranscriptRecord"
      kind: "entity"
      reference_mode: "transcript_request_number"
      definition: "A request for and issuance of a student's academic transcript, official or unofficial."
    - id: "ot-ferpa-restriction"
      name: "FerpaRestriction"
      kind: "entity"
      reference_mode: "restriction_id"
      definition: "A student's standing request under FERPA that the university withhold directory information."
    - id: "ot-directory-information-release"
      name: "DirectoryInformationRelease"
      kind: "entity"
      reference_mode: "release_id"
      definition: "A recorded disclosure of a student's directory information to a party outside the university."
    # ---- facilities and hr ------------------------------------------
    - id: "ot-building"
      name: "Building"
      kind: "entity"
      reference_mode: "building_code"
      definition: "A named structure on a campus in which rooms are scheduled."
    - id: "ot-room"
      name: "Room"
      kind: "entity"
      reference_mode: "room_id"
      definition: "A schedulable space, known by its number within a building."
    - id: "ot-position"
      name: "Position"
      kind: "entity"
      reference_mode: "position_number"
      definition: "A budgeted job slot in a department that one employee holds at a time."

    # ---- reference-mode value types ---------------------------------
    - id: "vt-pidm"
      name: "Pidm"
      kind: "value"
      definition: "The internal person identifier assigned once and never reused."
      data_type: { name: "integer" }
    - id: "vt-student-number"
      name: "StudentNumber"
      kind: "value"
      definition: "The nine-character number printed on a student's ID card, unique within a campus."
      data_type: { name: "text", length: 9 }
    - id: "vt-campus-code"
      name: "CampusCode"
      kind: "value"
      definition: "A one-character code for a campus."
      data_type: { name: "text", length: 1 }
      value_constraint:
        values: ["A", "B", "C", "D", "E", "F", "G", "H"]
    - id: "vt-college-code"
      name: "CollegeCode"
      kind: "value"
      definition: "A two-character code for a college."
      data_type: { name: "text", length: 2 }
    - id: "vt-department-code"
      name: "DepartmentCode"
      kind: "value"
      definition: "A four-character code for a department."
      data_type: { name: "text", length: 4 }
    - id: "vt-course-id"
      name: "CourseId"
      kind: "value"
      definition: "The surrogate catalog identifier of a course."
      data_type: { name: "integer" }
    - id: "vt-crn"
      name: "Crn"
      kind: "value"
      definition: "The five-digit course reference number of a section, unique within a term."
      data_type: { name: "text", length: 5 }
    - id: "vt-term-code"
      name: "TermCode"
      kind: "value"
      definition: "A six-digit code of the form YYYYNN, such as 202610 for Fall 2026."
      data_type: { name: "text", length: 6 }
    - id: "vt-grade-code"
      name: "GradeCode"
      kind: "value"
      definition: "A code from the grading scale."
      data_type: { name: "text", length: 2 }
      value_constraint:
        values:
          - "A+"
          - "A"
          - "A-"
          - "B+"
          - "B"
          - "B-"
          - "C+"
          - "C"
          - "C-"
          - "D+"
          - "D"
          - "D-"
          - "F"
          - "FN"
          - "FX"
          - "I"
          - "IP"
          - "W"
          - "WF"
          - "WN"
          - "WM"
          - "P"
          - "NP"
          - "S"
          - "U"
          - "CR"
          - "NC"
          - "AU"
          - "NR"
          - "NG"
          - "TR"
          - "X"
    - id: "vt-program-code"
      name: "ProgramCode"
      kind: "value"
      definition: "A code such as BS-CHEM naming a degree program."
      data_type: { name: "text", length: 12 }
    - id: "vt-award-number"
      name: "AwardNumber"
      kind: "value"
      definition: "The sequence number of a financial aid award."
      data_type: { name: "integer" }
    - id: "vt-fund-code"
      name: "FundCode"
      kind: "value"
      definition: "A six-character code for an aid fund."
      data_type: { name: "text", length: 6 }
    - id: "vt-aid-year-code"
      name: "AidYearCode"
      kind: "value"
      definition: "A four-digit code for an aid year, such as 2627."
      data_type: { name: "text", length: 4 }
    - id: "vt-transcript-request-number"
      name: "TranscriptRequestNumber"
      kind: "value"
      definition: "The sequence number of a transcript request."
      data_type: { name: "integer" }
    - id: "vt-restriction-id"
      name: "RestrictionId"
      kind: "value"
      definition: "The sequence number of a FERPA restriction."
      data_type: { name: "integer" }
    - id: "vt-release-id"
      name: "ReleaseId"
      kind: "value"
      definition: "The sequence number of a directory information release."
      data_type: { name: "integer" }
    - id: "vt-building-code"
      name: "BuildingCode"
      kind: "value"
      definition: "A six-character code for a building."
      data_type: { name: "text", length: 6 }
    - id: "vt-room-id"
      name: "RoomId"
      kind: "value"
      definition: "The surrogate identifier of a room."
      data_type: { name: "integer" }
    - id: "vt-position-number"
      name: "PositionNumber"
      kind: "value"
      definition: "The six-character budgeted position number."
      data_type: { name: "text", length: 6 }

    # ---- attribute value types --------------------------------------
    - id: "vt-last-name"
      name: "LastName"
      kind: "value"
      definition: "A person's legal last name."
      data_type: { name: "text", length: 60 }
    - id: "vt-first-name"
      name: "FirstName"
      kind: "value"
      definition: "A person's legal first name."
      data_type: { name: "text", length: 60 }
    - id: "vt-birth-date"
      name: "BirthDate"
      kind: "value"
      definition: "A person's date of birth."
      data_type: { name: "date" }
    - id: "vt-legacy-banner-id"
      name: "LegacyBannerId"
      kind: "value"
      definition: "The identifier a person carried in a campus system before the eight campuses were merged into one SIS."
      data_type: { name: "text", length: 9 }
    - id: "vt-employee-number"
      name: "EmployeeNumber"
      kind: "value"
      definition: "The payroll number of an employee, unique across the system."
      data_type: { name: "text", length: 9 }
    - id: "vt-class-level-code"
      name: "ClassLevelCode"
      kind: "value"
      definition: "A student's class standing."
      data_type: { name: "text", length: 2 }
      value_constraint:
        values: ["FR", "SO", "JR", "SR", "GR", "PB", "PR", "ND"]
    - id: "vt-subject-code"
      name: "SubjectCode"
      kind: "value"
      definition: "The four-letter subject of a course, such as MATH."
      data_type: { name: "text", length: 4 }
    - id: "vt-course-number"
      name: "CourseNumber"
      kind: "value"
      definition: "The four-digit number of a course within its subject, such as 1010."
      data_type: { name: "text", length: 4 }
    - id: "vt-registration-status-code"
      name: "RegistrationStatusCode"
      kind: "value"
      definition: "The registration status of an enrollment."
      data_type: { name: "text", length: 2 }
      value_constraint:
        values:
          - "RE"
          - "RW"
          - "RC"
          - "RD"
          - "RA"
          - "WL"
          - "WD"
          - "WC"
          - "WF"
          - "WN"
          - "WM"
          - "WX"
          - "DD"
          - "DW"
          - "DC"
          - "DA"
          - "DN"
          - "AU"
          - "AW"
          - "CN"
          - "CD"
          - "CA"
          - "CX"
          - "NR"
          - "NS"
          - "PN"
          - "PW"
          - "TR"
          - "GC"
          - "GW"
    - id: "vt-credit-hours"
      name: "CreditHours"
      kind: "value"
      definition: "The credit hours an enrollment carries, usually 1 to 6."
      data_type: { name: "decimal", length: 4, scale: 1 }
    - id: "vt-quality-points"
      name: "QualityPoints"
      kind: "value"
      definition: "The grade points per credit hour a grade earns, such as 3.7 for A-."
      data_type: { name: "decimal", length: 3, scale: 2 }
    - id: "vt-offered-amount"
      name: "OfferedAmount"
      kind: "value"
      definition: "The dollar amount of an award as offered."
      data_type: { name: "money" }
    - id: "vt-award-status-code"
      name: "AwardStatusCode"
      kind: "value"
      definition: "Where an award stands in the offer-accept-disburse cycle."
      data_type: { name: "text", length: 4 }
      value_constraint:
        values: ["OFFR", "ACPT", "DECL", "CANC", "PAID", "PEND"]
    - id: "vt-request-date"
      name: "RequestDate"
      kind: "value"
      definition: "The date a transcript was requested."
      data_type: { name: "date" }
    - id: "vt-transcript-type-code"
      name: "TranscriptTypeCode"
      kind: "value"
      definition: "Whether a transcript is official or unofficial."
      data_type: { name: "text", length: 4 }
      value_constraint:
        values: ["OFFC", "UNOF"]
    - id: "vt-release-date"
      name: "ReleaseDate"
      kind: "value"
      definition: "The date directory information was released."
      data_type: { name: "date" }
    - id: "vt-room-number"
      name: "RoomNumber"
      kind: "value"
      definition: "The number of a room, unique within its building."
      data_type: { name: "text", length: 6 }

  fact_types:
    # ---- identity ---------------------------------------------------
    - id: "ft-person-has-pidm"
      name: "Person has Pidm"
      roles:
        - { id: "r-person-has-pidm", player: "ot-person", role_name: "has" }
        - { id: "r-pidm-identifies-person", player: "vt-pidm", role_name: "identifies" }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-person-has-pidm"], is_preferred: true }
        - { type: "internal_uniqueness", roles: ["r-pidm-identifies-person"] }
        - { type: "mandatory", role: "r-person-has-pidm" }
    - id: "ft-person-has-last-name"
      name: "Person has LastName"
      roles:
        - { id: "r-person-has-last-name", player: "ot-person", role_name: "has" }
        - { id: "r-last-name-is-of-person", player: "vt-last-name", role_name: "is of" }
      readings: ["{0} has {1}", "{1} is last name of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-person-has-last-name"] }
        - { type: "mandatory", role: "r-person-has-last-name" }
    - id: "ft-person-has-first-name"
      name: "Person has FirstName"
      roles:
        - { id: "r-person-has-first-name", player: "ot-person", role_name: "has" }
        - { id: "r-first-name-is-of-person", player: "vt-first-name", role_name: "is of" }
      readings: ["{0} has {1}", "{1} is first name of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-person-has-first-name"] }
    - id: "ft-person-has-birth-date"
      name: "Person has BirthDate"
      roles:
        - { id: "r-person-has-birth-date", player: "ot-person", role_name: "was born on" }
        - { id: "r-birth-date-is-of-person", player: "vt-birth-date", role_name: "is birth date of" }
      readings: ["{0} was born on {1}", "{1} is birth date of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-person-has-birth-date"] }
    - id: "ft-person-has-legacy-banner-id"
      name: "Person has LegacyBannerId"
      definition: "The pre-merger campus identifier, kept for reconciliation and scheduled for retirement."
      roles:
        - { id: "r-person-has-legacy-banner-id", player: "ot-person", role_name: "has" }
        - { id: "r-legacy-banner-id-is-of-person", player: "vt-legacy-banner-id", role_name: "is legacy id of" }
      readings: ["{0} has {1}", "{1} is legacy id of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-person-has-legacy-banner-id"] }

    # ---- student ----------------------------------------------------
    - id: "ft-student-has-student-number"
      name: "Student has StudentNumber"
      definition: "The student number is unique only within the home campus; two campuses may both have student 900012345."
      roles:
        - { id: "r-student-has-student-number", player: "ot-student", role_name: "has" }
        - { id: "r-student-number-is-of-student", player: "vt-student-number", role_name: "is number of" }
      readings: ["{0} has {1}", "{1} is student number of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-student-has-student-number"] }
        - { type: "mandatory", role: "r-student-has-student-number" }
    - id: "ft-student-has-home-campus"
      name: "Student has home Campus"
      roles:
        - { id: "r-student-has-home-campus", player: "ot-student", role_name: "has home" }
        - { id: "r-campus-is-home-of-student", player: "ot-campus", role_name: "is home campus of" }
      readings: ["{0} has home {1}", "{1} is home campus of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-student-has-home-campus"] }
        - { type: "mandatory", role: "r-student-has-home-campus" }
        # Campus code plus student number identifies a student.
        - { type: "external_uniqueness", roles: ["r-campus-is-home-of-student", "r-student-number-is-of-student"] }
    - id: "ft-student-has-class-level-code"
      name: "Student has ClassLevelCode"
      roles:
        - { id: "r-student-has-class-level", player: "ot-student", role_name: "has" }
        - { id: "r-class-level-is-of-student", player: "vt-class-level-code", role_name: "is class level of" }
      readings: ["{0} has {1}", "{1} is class level of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-student-has-class-level"] }
    - id: "ft-student-pursues-degree-program"
      name: "Student pursues DegreeProgram"
      definition: "Double majors and dual degrees mean a student may pursue more than one program at once."
      roles:
        - { id: "r-student-pursues-program", player: "ot-student", role_name: "pursues" }
        - { id: "r-program-is-pursued-by-student", player: "ot-degree-program", role_name: "is pursued by" }
      readings: ["{0} pursues {1}", "{1} is pursued by {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-student-pursues-program", "r-program-is-pursued-by-student"] }
    - id: "ft-student-is-advised-by-faculty"
      name: "Student is advised by Faculty"
      definition: "Every student should have at least one assigned advisor; the policy is stated, not enforced by the SIS."
      roles:
        - { id: "r-student-is-advised-by", player: "ot-student", role_name: "is advised by" }
        - { id: "r-faculty-advises-student", player: "ot-faculty", role_name: "advises" }
      readings: ["{0} is advised by {1}", "{1} advises {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-student-is-advised-by", "r-faculty-advises-student"] }
        - { type: "mandatory", role: "r-student-is-advised-by", modality: "deontic" }
    - id: "ft-graduate-student-has-thesis-advisor"
      name: "GraduateStudent has thesis advisor Faculty"
      roles:
        - { id: "r-graduate-student-has-thesis-advisor", player: "ot-graduate-student", role_name: "has thesis advisor" }
        - { id: "r-faculty-is-thesis-advisor-of", player: "ot-faculty", role_name: "is thesis advisor of" }
      readings: ["{0} has {1} as thesis advisor", "{1} is thesis advisor of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-graduate-student-has-thesis-advisor"] }

    # ---- employee and hr --------------------------------------------
    - id: "ft-employee-has-employee-number"
      name: "Employee has EmployeeNumber"
      roles:
        - { id: "r-employee-has-employee-number", player: "ot-employee", role_name: "has" }
        - { id: "r-employee-number-is-of-employee", player: "vt-employee-number", role_name: "is number of" }
      readings: ["{0} has {1}", "{1} is employee number of {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-employee-has-employee-number"] }
        - { type: "internal_uniqueness", roles: ["r-employee-number-is-of-employee"] }
        - { type: "mandatory", role: "r-employee-has-employee-number" }
    - id: "ft-employee-holds-position"
      name: "Employee holds Position"
      roles:
        - { id: "r-employee-holds-position", player: "ot-employee", role_name: "holds" }
        - { id: "r-position-is-held-by-employee", player: "ot-position", role_name: "is held by" }
      readings: ["{0} holds {1}", "{1} is held by {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-position-is-held-by-employee"] }
    - id: "ft-position-has-position-number"
      name: "Position has PositionNumber"
      roles:
        - { id: "r-position-has-position-number", player: "ot-position", role_name: "has" }
        - { id: "r-position-number-identifies-position", player: "vt-position-number", role_name: "identifies" }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-position-has-position-number"], is_preferred: true }
        - { type: "internal_uniqueness", roles: ["r-position-number-identifies-position"] }
        - { type: "mandatory", role: "r-position-has-position-number" }
    - id: "ft-position-is-in-department"
      name: "Position is in Department"
      roles:
        - { id: "r-position-is-in-department", player: "ot-position", role_name: "is in" }
        - { id: "r-department-has-position", player: "ot-department", role_name: "has" }
      readings: ["{0} is in {1}", "{1} has {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-position-is-in-department"] }
        - { type: "mandatory", role: "r-position-is-in-department" }
    - id: "ft-faculty-teaches-course-section"
      name: "Faculty teaches CourseSection"
      definition: "Team-taught sections have more than one instructor of record."
      roles:
        - { id: "r-faculty-teaches-section", player: "ot-faculty", role_name: "teaches" }
        - { id: "r-section-is-taught-by-faculty", player: "ot-course-section", role_name: "is taught by" }
      readings: ["{0} teaches {1}", "{1} is taught by {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-faculty-teaches-section", "r-section-is-taught-by-faculty"] }

    # ---- organization -----------------------------------------------
    - id: "ft-campus-has-campus-code"
      name: "Campus has CampusCode"
      roles:
        - { id: "r-campus-has-campus-code", player: "ot-campus", role_name: "has" }
        - { id: "r-campus-code-identifies-campus", player: "vt-campus-code", role_name: "identifies" }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: "internal_uniqueness", roles: ["r-campus-has-campus-code"], is_preferred: true }
        - { type: "internal_uniqueness", roles: ["r-campus-code-identifies-campus"] }

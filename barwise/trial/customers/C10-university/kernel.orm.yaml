  objectified_fact_types:
    - id: "oft-enrollment"
      fact_type: "ft-student-enrolls-in-course-section-for-term"
      object_type: "ot-enrollment"

  definitions:
    - term: "Term"
      definition: "The registrar's word for an academic period; the catalog and the faculty senate say semester, the SIS says term, and the code is the same six digits either way."
      context: "registration"
    - term: "Directory information"
      definition: "The FERPA-defined set of student data the university may release without consent unless the student has restricted it: name, enrollment status, degrees, dates of attendance."
      context: "records"
    - term: "PIDM"
      definition: "The internal person identifier; never shown to a student, never reused, and the only key that survives a campus transfer."
      context: "identity"

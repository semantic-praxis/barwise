# The student information system after a migration that kept every
# name: upper-case seven-character tables with a module prefix,
# TABLE_FIELD column names, audit columns everywhere, a schema prefix,
# no check constraints anywhere.
dialect: postgres
naming:
  table_case: upper
  column_case: upper
  abbreviate: true
  max_identifier: 30
  abbreviations:
    Person: SPRIDEN
    Student: SGBSTDN
    CourseSection: SSBSECT
    Enrollment: SFRSTCR
    Course: SCBCRSE
    Term: STVTERM
    Campus: STVCAMP
    College: STVCOLL
    Department: STVDEPT
    Grade: SHRGRDE
    FinancialAidAward: RPRAWRD
    Faculty: SIBINST
    Employee: PEBEMPL
    Building: SLBBLDG
    Room: SLBRDEF
    DegreeProgram: SMRPRLE
    TranscriptRecord: SHRTCKN
idioms:
  schema_qualified: "saturn."
  quoting: none
  check_constraints: false
  comments: true
  named_constraints: true
# Vendor tables the kernel does not model. They used to be SPRIDEN,
# SFRSTCR and STVTERM, which the dictionary above also gives the
# generated Person, Enrollment and Term tables, so the file created each
# twice (barwise-rlv); these are Banner tables beside those, not copies.
extra_tables:
  - |
    CREATE TABLE saturn.SPBPERS (
      SPBPERS_PIDM NUMERIC(8,0) NOT NULL,
      SPBPERS_SSN VARCHAR(15),
      SPBPERS_BIRTH_DATE DATE,
      SPBPERS_SEX VARCHAR(1),
      SPBPERS_CONFID_IND VARCHAR(1),
      SPBPERS_DEAD_IND VARCHAR(1),
      SPBPERS_ACTIVITY_DATE TIMESTAMP NOT NULL,
      SPBPERS_USER VARCHAR(30),
      CONSTRAINT PK_SPBPERS PRIMARY KEY (SPBPERS_PIDM)
    )
  - |
    CREATE TABLE saturn.SFRSTCA (
      SFRSTCA_TERM_CODE VARCHAR(6) NOT NULL,
      SFRSTCA_PIDM NUMERIC(8,0) NOT NULL,
      SFRSTCA_CRN VARCHAR(5) NOT NULL,
      SFRSTCA_SEQ_NUMBER NUMERIC(4,0) NOT NULL,
      SFRSTCA_RSTS_CODE VARCHAR(2) NOT NULL,
      SFRSTCA_RSTS_DATE DATE NOT NULL,
      SFRSTCA_CREDIT_HR NUMERIC(7,3),
      SFRSTCA_ACTIVITY_DATE TIMESTAMP NOT NULL,
      SFRSTCA_USER VARCHAR(30),
      CONSTRAINT PK_SFRSTCA PRIMARY KEY (SFRSTCA_TERM_CODE, SFRSTCA_PIDM, SFRSTCA_CRN, SFRSTCA_SEQ_NUMBER)
    )
  - |
    CREATE TABLE saturn.SOBTERM (
      SOBTERM_TERM_CODE VARCHAR(6) NOT NULL,
      SOBTERM_DYNAMIC_SCHED_TERM_IND VARCHAR(1) NOT NULL,
      SOBTERM_CRSE_REGISTRATION_IND VARCHAR(1),
      SOBTERM_FEE_ASSESSMENT VARCHAR(1),
      SOBTERM_ACTIVITY_DATE TIMESTAMP NOT NULL,
      SOBTERM_USER VARCHAR(30),
      CONSTRAINT PK_SOBTERM PRIMARY KEY (SOBTERM_TERM_CODE)
    )

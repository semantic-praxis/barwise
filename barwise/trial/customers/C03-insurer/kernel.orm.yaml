    # ---- policy period (objectified) ----------------------------------
    - id: ft-policy-is-in-force-for-term
      name: Policy is in force for Term
      definition: A policy is in force for a numbered term; the pairing is what a policy period objectifies, so there is one period per policy per term.
      roles:
        - { id: r-policy-in-force-policy, player: ot-policy, role_name: is in force for }
        - { id: r-policy-in-force-term, player: ot-term, role_name: is a term of }
      readings: ["{0} is in force for {1}", "{1} is a term of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-in-force-policy, r-policy-in-force-term] }
    - id: ft-policy-period-has-policy-number
      name: PolicyPeriod has PolicyNumber
      definition: The printed policy number is carried on the period, and the pair (policy number, term) identifies a period the way the declarations page does.
      roles:
        - { id: r-policy-period-has-number-period, player: ot-policy-period, role_name: has }
        - { id: r-policy-period-has-number-number, player: ot-policy-number, role_name: is printed on }
      readings: ["{0} has {1}", "{1} is printed on {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-has-number-period] }
        - { type: mandatory, role: r-policy-period-has-number-period }
        # The business key: policy number plus term number identifies a
        # period; the same policy number recurs across terms, so neither
        # part alone is enough.
        - { type: external_uniqueness, roles: [r-policy-period-has-number-number, r-policy-in-force-term] }

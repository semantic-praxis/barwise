  definitions:
    - term: Policy
      definition: In policy administration, the contract across all its terms; in claims, the word usually means the period that responds to the loss date. The claims reading is PolicyPeriod here.
      context: policy
    - term: Claim
      definition: In claims, the reported loss; in billing and actuarial reporting, "claim" is often used for a single exposure's payments. Reserves and payments hang on Exposure, never on Claim.
      context: claims
    - term: Recovery
      definition: The claims teams' word for a subrogation and for the money it brings back; the model keeps Subrogation for the pursuit and RecoveryAmount for the money.
      context: claims

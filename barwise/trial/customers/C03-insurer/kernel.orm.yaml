orm_version: "1.1"
model:
  name: Property and Casualty Insurer
  domain_context: insurance
  note: >-
    The hand-authored seed model for trial customer C03. A regional
    property and casualty carrier on a Guidewire-style core suite, so the
    vocabulary is the suite's public vocabulary: Account, Policy,
    PolicyPeriod (the term-numbered slice of a policy that is actually in
    force), Coverage, Risk, Claim, Exposure, Reserve, Payment,
    Subrogation, and Contact for every party. The policy number is
    stamped on the period, not the policy, because a rewrite renumbers;
    the period's business key is the policy number plus the term number.

  object_types:
    # ---- parties ------------------------------------------------------
    - id: ot-contact
      name: Contact
      kind: entity
      reference_mode: contact_id
      definition: Any person or organisation the carrier deals with, whether as insured, claimant, payee, adverse party or vendor; identified once in the contact system.
      aliases: [Party]
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: contact_id
      definition: A contact that is a natural person, such as a named insured, a driver or a claimant.
    - id: ot-company
      name: Company
      kind: entity
      reference_mode: contact_id
      definition: A contact that is an organisation, such as a commercial insured, a repair shop or another carrier.
    - id: ot-account
      name: Account
      kind: entity
      reference_mode: account_number
      definition: The customer relationship that owns one or more policies and receives the invoices for them.
    - id: ot-producer
      name: Producer
      kind: entity
      reference_mode: producer_code
      definition: An agent or agency authorised to sell and service the carrier's policies, identified by a producer code.
      aliases: [Agent, Agency]
    - id: ot-adjuster
      name: Adjuster
      kind: entity
      reference_mode: adjuster_id
      definition: A claims professional who is assigned claims, sets reserves and authorises payments within a granted authority limit.

    # ---- policy -------------------------------------------------------
    - id: ot-policy
      name: Policy
      kind: entity
      reference_mode: policy_id
      definition: The contract of insurance as a whole across all of its terms, identified by a system-assigned policy identifier.
    - id: ot-term
      name: Term
      kind: entity
      reference_mode: term_number
      definition: A numbered cycle in the life of a policy; term 1 is the original issue and each renewal increments the number.
    - id: ot-policy-period
      name: PolicyPeriod
      kind: entity
      reference_mode: policy_period_id
      definition: The slice of a policy that is in force for one term, carrying the effective dates, the printed policy number and everything bound for that term.
      aliases: [Period]
    - id: ot-coverage
      name: Coverage
      kind: entity
      reference_mode: coverage_id
      definition: A single insuring agreement bound on a policy period, such as collision or dwelling, with its own limit.
    - id: ot-risk
      name: Risk
      kind: entity
      reference_mode: risk_id
      definition: A thing the policy insures and rates, such as a vehicle or a building, listed on a policy period.
    - id: ot-vehicle-risk
      name: VehicleRisk
      kind: entity
      reference_mode: risk_id
      definition: A risk that is a motor vehicle, identified on the schedule by its vehicle identification number.
    - id: ot-commercial-vehicle-risk
      name: CommercialVehicleRisk
      kind: entity
      reference_mode: risk_id
      definition: A vehicle risk rated for commercial use, which carries a gross vehicle weight class.
    - id: ot-property-risk
      name: PropertyRisk
      kind: entity
      reference_mode: risk_id
      definition: A risk that is a building or its contents, rated by its construction class.

    # ---- claims -------------------------------------------------------
    - id: ot-claim
      name: Claim
      kind: entity
      reference_mode: claim_number
      definition: A reported loss made against a policy period, identified by the claim number the claims system assigns at first notice.
    - id: ot-exposure
      name: Exposure
      kind: entity
      reference_mode: exposure_id
      definition: One claimant's demand under one coverage on a claim; reserves and payments are held at this level, never on the claim.
    - id: ot-reserve
      name: Reserve
      kind: entity
      reference_mode: reserve_id
      definition: The amount set aside on an exposure for what the carrier expects to pay, by cost type.
    - id: ot-payment
      name: Payment
      kind: entity
      reference_mode: payment_id
      definition: A disbursement to a payee drawn against a reserve on an exposure.
    - id: ot-subrogation
      name: Subrogation
      kind: entity
      reference_mode: subrogation_id
      definition: The pursuit of recovery from a party held responsible for a paid loss, opened on a claim.
      aliases: [Subro, Recovery]

    # ---- billing ------------------------------------------------------
    - id: ot-invoice
      name: Invoice
      kind: entity
      reference_mode: invoice_number
      definition: A bill issued to an account for the charges on a policy period, due on a stated date.

    # ---- identifier value types --------------------------------------
    - id: ot-contact-id
      name: ContactId
      kind: value
      definition: The identifier the contact system assigns to a contact.
      data_type: { name: text, length: 20 }
    - id: ot-account-number
      name: AccountNumber
      kind: value
      definition: The number under which an account is billed.
      data_type: { name: text, length: 20 }
    - id: ot-producer-code
      name: ProducerCode
      kind: value
      definition: The code under which a producer writes business.
      data_type: { name: text, length: 20 }
    - id: ot-adjuster-id
      name: AdjusterId
      kind: value
      definition: The identifier of an adjuster in the claims system.
      data_type: { name: text, length: 20 }
    - id: ot-policy-id
      name: PolicyId
      kind: value
      definition: The system-assigned identifier of a policy, stable across rewrites.
      data_type: { name: text, length: 20 }
    - id: ot-term-number
      name: TermNumber
      kind: value
      definition: The ordinal of a term within a policy, starting at 1.
      data_type: { name: integer }
    - id: ot-policy-period-id
      name: PolicyPeriodId
      kind: value
      definition: The identifier the policy system assigns to a policy period.
      data_type: { name: text, length: 20 }
    - id: ot-coverage-id
      name: CoverageId
      kind: value
      definition: The identifier of a bound coverage.
      data_type: { name: text, length: 20 }
    - id: ot-risk-id
      name: RiskId
      kind: value
      definition: The identifier of a risk on the schedule.
      data_type: { name: text, length: 20 }
    - id: ot-claim-number
      name: ClaimNumber
      kind: value
      definition: The number the claims system assigns to a claim at first notice of loss.
      data_type: { name: text, length: 20 }
    - id: ot-exposure-id
      name: ExposureId
      kind: value
      definition: The identifier of an exposure on a claim.
      data_type: { name: text, length: 20 }
    - id: ot-reserve-id
      name: ReserveId
      kind: value
      definition: The identifier of a reserve on an exposure.
      data_type: { name: text, length: 20 }
    - id: ot-payment-id
      name: PaymentId
      kind: value
      definition: The identifier of a payment.
      data_type: { name: text, length: 20 }
    - id: ot-subrogation-id
      name: SubrogationId
      kind: value
      definition: The identifier of a subrogation.
      data_type: { name: text, length: 20 }
    - id: ot-invoice-number
      name: InvoiceNumber
      kind: value
      definition: The number printed on an invoice.
      data_type: { name: text, length: 20 }

    # ---- descriptive value types --------------------------------------
    - id: ot-contact-name
      name: ContactName
      kind: value
      definition: The name of a contact as it appears on documents.
      data_type: { name: text, length: 200 }
    - id: ot-date-of-birth
      name: DateOfBirth
      kind: value
      definition: A person's date of birth, used in rating and identity checks.
      data_type: { name: date }
    - id: ot-reserve-authority-limit
      name: ReserveAuthorityLimit
      kind: value
      definition: The largest reserve an adjuster may approve without escalation.
      data_type: { name: money }
    - id: ot-product-code
      name: ProductCode
      kind: value
      definition: The line of business a policy is written under.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [PersonalAuto, Homeowners, CommercialAuto, BusinessOwners, GeneralLiability, WorkersComp, CommercialProperty, InlandMarine]
    - id: ot-legacy-policy-key
      name: LegacyPolicyKey
      kind: value
      definition: The key of the policy in the mainframe system that was retired at conversion; kept for lookups from old correspondence.
      data_type: { name: text, length: 30 }
    - id: ot-policy-number
      name: PolicyNumber
      kind: value
      definition: The number printed on the declarations page; it is stamped on the period, and a rewrite issues a new one.
      data_type: { name: text, length: 20 }
    - id: ot-effective-date
      name: EffectiveDate
      kind: value
      definition: The date from which a policy period is in force.
      data_type: { name: date }
    - id: ot-expiration-date
      name: ExpirationDate
      kind: value
      definition: The date on which a policy period ends unless cancelled earlier.
      data_type: { name: date }
    - id: ot-period-status
      name: PeriodStatus
      kind: value
      definition: Where the period is in its lifecycle.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [Draft, Quoted, Bound, InForce, Expired, Cancelled, Withdrawn]
    - id: ot-coverage-code
      name: CoverageCode
      kind: value
      definition: The coverage pattern a coverage is an instance of.
      data_type: { name: text, length: 40 }
      value_constraint:
        values: [PALiabilityCov, PACollisionCov, PAComprehensiveCov, PAMedPayCov, PAUninsuredMotoristCov, HODwellingCov, HOPersonalPropertyCov, HOPersonalLiabilityCov, HOLossOfUseCov, CAAutoLiabilityCov, CAPhysicalDamageCov, BOPBuildingCov, BOPBusinessPersonalPropertyCov, GLPremisesOperationsCov]
    - id: ot-limit
      name: Limit
      kind: value
      definition: The most the carrier will pay under a coverage.
      data_type: { name: money }
    - id: ot-vin
      name: Vin
      kind: value
      definition: The seventeen-character vehicle identification number.
      data_type: { name: text, length: 17 }
    - id: ot-gross-vehicle-weight
      name: GrossVehicleWeight
      kind: value
      definition: The rated gross vehicle weight of a commercial vehicle in pounds.
      data_type: { name: integer }

    - id: ot-construction-type
      name: ConstructionType
      kind: value
      definition: The construction class used to rate a building.
      data_type: { name: text, length: 30 }
      value_constraint:
        values: [Frame, JoistedMasonry, NonCombustible, MasonryNonCombustible, ModifiedFireResistive, FireResistive]
    - id: ot-loss-date
      name: LossDate
      kind: value
      definition: The date on which the loss occurred; it decides which policy period responds.
      data_type: { name: date }

    - id: ot-loss-cause
      name: LossCause
      kind: value
      definition: The typelist code for what caused the loss; the values are the carrier's own and every code below is in use.
      data_type: { name: text, length: 30 }
      value_constraint:
        values:
          - rearend
          - leftturn
          - rightturn
          - lanechange
          - backing
          - headon
          - sideswipe
          - rollover
          - pedestrian
          - bicyclist
          - animal
          - hitandrun
          - parkedvehicle
          - singlevehicle
          - mechanicalfailure
          - theftentire
          - theftpartial
          - vandalism
          - glassbreakage
          - fire
          - flood
          - hail
          - wind
          - lightning
          - earthquake
          - waterdamage
          - freeze
          - smoke
          - explosion
          - riot
          - collapse
          - fallingobject
          - burglary
          - mold
          - sewerbackup
          - weightofice
          - bodilyinjury
          - propertydamage
          - dogbite
          - slipandfall
          - productliability
          - completedoperations
          - equipmentbreakdown
          - other
    - id: ot-claim-status
      name: ClaimStatus
      kind: value
      definition: Where the claim is in its lifecycle.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [Draft, Open, Closed, Reopened, Archived]
    - id: ot-exposure-type
      name: ExposureType
      kind: value
      definition: The kind of demand an exposure represents.
      data_type: { name: text, length: 30 }
      value_constraint:
        values: [VehicleDamage, PropertyDamage, BodilyInjury, MedicalPayments, UninsuredMotorist, Liability, LossOfUse]
    - id: ot-reserve-amount
      name: ReserveAmount
      kind: value
      definition: The amount currently reserved.
      data_type: { name: money }
    - id: ot-cost-type
      name: CostType
      kind: value
      definition: Whether a reserve holds indemnity for the claimant or expense for handling the claim.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [ClaimCost, AOExpense, DCCExpense]
    - id: ot-payment-amount
      name: PaymentAmount
      kind: value
      definition: The amount disbursed by a payment.
      data_type: { name: money }
    - id: ot-recovery-amount
      name: RecoveryAmount
      kind: value
      definition: The amount recovered so far through a subrogation.
      data_type: { name: money }
    - id: ot-subrogation-status
      name: SubrogationStatus
      kind: value
      definition: Where a subrogation is in its pursuit.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [Open, Demanded, InArbitration, Recovered, Closed]
    - id: ot-due-date
      name: DueDate
      kind: value
      definition: The date by which an invoice must be paid.
      data_type: { name: date }
    - id: ot-invoice-amount
      name: InvoiceAmount
      kind: value
      definition: The total amount billed on an invoice.
      data_type: { name: money }

  fact_types:
    # ---- reference schemes -------------------------------------------
    - id: ft-contact-has-contact-id
      name: Contact has ContactId
      roles:
        - { id: r-contact-has-id-contact, player: ot-contact, role_name: has }
        - { id: r-contact-has-id-id, player: ot-contact-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-contact-has-id-contact], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-contact-has-id-id] }
        - { type: mandatory, role: r-contact-has-id-contact }
    - id: ft-account-has-account-number
      name: Account has AccountNumber
      roles:
        - { id: r-account-has-number-account, player: ot-account, role_name: has }
        - { id: r-account-has-number-number, player: ot-account-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-account-has-number-account], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-account-has-number-number] }
        - { type: mandatory, role: r-account-has-number-account }
    - id: ft-producer-has-producer-code
      name: Producer has ProducerCode
      roles:
        - { id: r-producer-has-code-producer, player: ot-producer, role_name: has }
        - { id: r-producer-has-code-code, player: ot-producer-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-producer-has-code-producer], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-producer-has-code-code] }
        - { type: mandatory, role: r-producer-has-code-producer }
    - id: ft-adjuster-has-adjuster-id
      name: Adjuster has AdjusterId
      roles:
        - { id: r-adjuster-has-id-adjuster, player: ot-adjuster, role_name: has }
        - { id: r-adjuster-has-id-id, player: ot-adjuster-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-adjuster-has-id-adjuster], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-adjuster-has-id-id] }
        - { type: mandatory, role: r-adjuster-has-id-adjuster }
    - id: ft-policy-has-policy-id
      name: Policy has PolicyId
      roles:
        - { id: r-policy-has-id-policy, player: ot-policy, role_name: has }
        - { id: r-policy-has-id-id, player: ot-policy-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-has-id-policy], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-policy-has-id-id] }
        - { type: mandatory, role: r-policy-has-id-policy }
    - id: ft-term-has-term-number
      name: Term has TermNumber
      roles:
        - { id: r-term-has-number-term, player: ot-term, role_name: has }
        - { id: r-term-has-number-number, player: ot-term-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-term-has-number-term], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-term-has-number-number] }
        - { type: mandatory, role: r-term-has-number-term }
    - id: ft-policy-period-has-policy-period-id
      name: PolicyPeriod has PolicyPeriodId
      roles:
        - { id: r-policy-period-has-id-period, player: ot-policy-period, role_name: has }
        - { id: r-policy-period-has-id-id, player: ot-policy-period-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-has-id-period], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-policy-period-has-id-id] }
        - { type: mandatory, role: r-policy-period-has-id-period }
    - id: ft-coverage-has-coverage-id
      name: Coverage has CoverageId
      roles:
        - { id: r-coverage-has-id-coverage, player: ot-coverage, role_name: has }
        - { id: r-coverage-has-id-id, player: ot-coverage-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-coverage-has-id-coverage], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-coverage-has-id-id] }
        - { type: mandatory, role: r-coverage-has-id-coverage }
    - id: ft-risk-has-risk-id
      name: Risk has RiskId
      roles:
        - { id: r-risk-has-id-risk, player: ot-risk, role_name: has }
        - { id: r-risk-has-id-id, player: ot-risk-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-risk-has-id-risk], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-risk-has-id-id] }
        - { type: mandatory, role: r-risk-has-id-risk }
    - id: ft-claim-has-claim-number
      name: Claim has ClaimNumber
      roles:
        - { id: r-claim-has-number-claim, player: ot-claim, role_name: has }
        - { id: r-claim-has-number-number, player: ot-claim-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-claim-has-number-claim], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-claim-has-number-number] }
        - { type: mandatory, role: r-claim-has-number-claim }
    - id: ft-exposure-has-exposure-id
      name: Exposure has ExposureId
      roles:
        - { id: r-exposure-has-id-exposure, player: ot-exposure, role_name: has }
        - { id: r-exposure-has-id-id, player: ot-exposure-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-exposure-has-id-exposure], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-exposure-has-id-id] }
        - { type: mandatory, role: r-exposure-has-id-exposure }
    - id: ft-reserve-has-reserve-id
      name: Reserve has ReserveId
      roles:
        - { id: r-reserve-has-id-reserve, player: ot-reserve, role_name: has }
        - { id: r-reserve-has-id-id, player: ot-reserve-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-reserve-has-id-reserve], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-reserve-has-id-id] }
        - { type: mandatory, role: r-reserve-has-id-reserve }
    - id: ft-payment-has-payment-id
      name: Payment has PaymentId
      roles:
        - { id: r-payment-has-id-payment, player: ot-payment, role_name: has }
        - { id: r-payment-has-id-id, player: ot-payment-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-payment-has-id-payment], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-payment-has-id-id] }
        - { type: mandatory, role: r-payment-has-id-payment }
    - id: ft-subrogation-has-subrogation-id
      name: Subrogation has SubrogationId
      roles:
        - { id: r-subrogation-has-id-subrogation, player: ot-subrogation, role_name: has }
        - { id: r-subrogation-has-id-id, player: ot-subrogation-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-subrogation-has-id-subrogation], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-subrogation-has-id-id] }
        - { type: mandatory, role: r-subrogation-has-id-subrogation }
    - id: ft-invoice-has-invoice-number
      name: Invoice has InvoiceNumber
      roles:
        - { id: r-invoice-has-number-invoice, player: ot-invoice, role_name: has }
        - { id: r-invoice-has-number-number, player: ot-invoice-number, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-invoice-has-number-invoice], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-invoice-has-number-number] }
        - { type: mandatory, role: r-invoice-has-number-invoice }

    # ---- parties ------------------------------------------------------
    - id: ft-contact-has-contact-name
      name: Contact has ContactName
      roles:
        - { id: r-contact-has-name-contact, player: ot-contact, role_name: has }
        - { id: r-contact-has-name-name, player: ot-contact-name, role_name: is of }
      readings: ["{0} has {1}", "{1} is of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-contact-has-name-contact] }
        - { type: mandatory, role: r-contact-has-name-contact }
    - id: ft-person-was-born-on-date-of-birth
      name: Person was born on DateOfBirth
      roles:
        - { id: r-person-born-on-person, player: ot-person, role_name: was born on }
        - { id: r-person-born-on-date, player: ot-date-of-birth, role_name: is birth date of }
      readings: ["{0} was born on {1}", "{1} is birth date of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-person-born-on-person] }
    - id: ft-account-is-owned-by-contact
      name: Account is owned by Contact
      roles:
        - { id: r-account-owned-by-account, player: ot-account, role_name: is owned by }
        - { id: r-account-owned-by-contact, player: ot-contact, role_name: owns }
      readings: ["{0} is owned by {1}", "{1} owns {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-account-owned-by-account] }
        - { type: mandatory, role: r-account-owned-by-account }
    - id: ft-account-is-serviced-by-producer
      name: Account is serviced by Producer
      definition: The producers of record on an account; an account moved between agencies keeps both until the book roll completes, which is why this is many-to-many today.
      roles:
        - { id: r-account-serviced-by-account, player: ot-account, role_name: is serviced by }
        - { id: r-account-serviced-by-producer, player: ot-producer, role_name: services }
      readings: ["{0} is serviced by {1}", "{1} services {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-account-serviced-by-account, r-account-serviced-by-producer] }

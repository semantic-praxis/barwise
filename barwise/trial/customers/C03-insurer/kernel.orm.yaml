      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-has-effective-period] }
        - { type: mandatory, role: r-policy-period-has-effective-period }
    - id: ft-policy-period-has-expiration-date
      name: PolicyPeriod has ExpirationDate
      roles:
        - { id: r-policy-period-has-expiration-period, player: ot-policy-period, role_name: has }
        - { id: r-policy-period-has-expiration-date, player: ot-expiration-date, role_name: ends }
      readings: ["{0} has {1}", "{1} ends {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-has-expiration-period] }
        - { type: mandatory, role: r-policy-period-has-expiration-period }
    - id: ft-policy-period-has-period-status
      name: PolicyPeriod has PeriodStatus
      roles:
        - { id: r-policy-period-has-status-period, player: ot-policy-period, role_name: has }
        - { id: r-policy-period-has-status-status, player: ot-period-status, role_name: is state of }
      readings: ["{0} has {1}", "{1} is state of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-has-status-period] }
        - { type: mandatory, role: r-policy-period-has-status-period }
    - id: ft-policy-period-supersedes-policy-period
      name: PolicyPeriod supersedes PolicyPeriod
      definition: A policy change or renewal issues a new period that supersedes the one before it; the chain never loops back and a period never supersedes the one that superseded it.
      roles:
        - { id: r-policy-period-supersedes-newer, player: ot-policy-period, role_name: supersedes }
        - { id: r-policy-period-supersedes-older, player: ot-policy-period, role_name: is superseded by }
      readings: ["{0} supersedes {1}", "{1} is superseded by {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-policy-period-supersedes-newer] }
        - { type: internal_uniqueness, roles: [r-policy-period-supersedes-older] }
        - { type: ring, role_1: r-policy-period-supersedes-newer, role_2: r-policy-period-supersedes-older, ring_type: acyclic }
        - { type: ring, role_1: r-policy-period-supersedes-newer, role_2: r-policy-period-supersedes-older, ring_type: asymmetric }


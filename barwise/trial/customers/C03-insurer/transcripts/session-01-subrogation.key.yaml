# Seeded devices in session-01-subrogation.md, by 1-based line number in
# the authored file; the runner remaps them when it messes the transcript.
seeded:
  - id: overloaded-claim
    kind: overloaded_term
    lines: [18, 28, 29, 30]
    expect:
      ambiguity_matches: [claim, exposure]
  - id: overloaded-recovery
    kind: overloaded_term
    lines: [14, 51, 53]
    expect:
      ambiguity_matches: [recovery, payment]
  - id: resolved-subro-per-claim
    kind: resolved_conflict
    lines: [19, 20, 22, 23]
    expect:
      forbids_population: { fact_type: "Subrogation is pursued on Claim", constraint: mandatory }
  - id: correction-one-subro-per-adverse-party
    kind: correction
    lines: [38, 40, 41]
    expect:
      forbids_population: { fact_type: "Subrogation targets Contact", constraint: internal_uniqueness }
  - id: correction-split-check
    kind: correction
    lines: [92, 96, 97]
    expect:
      forbids_population: { fact_type: "Payment is drawn against Reserve", constraint: internal_uniqueness }
  - id: resolved-reserve-approval-deontic
    kind: resolved_conflict
    lines: [73, 74, 79, 80]
    expect:
      requires_verbalization: "It is obligatory that each Reserve is approved by at least one Adjuster."
  - id: parked-recovery-allocation
    kind: parked
    lines: [25, 121, 123]
    expect:
      ambiguity_matches: [recovery, exposure]
  - id: parked-reserve-history
    kind: parked
    lines: [150]
    expect:
      ambiguity_matches: [reserve, history]
  - id: injection-1
    kind: injection
    lines: [88]
    expect:
      absent_element: INJECTED_MARKER
  - id: decoy-subro-legacy-id
    kind: decoy_identifier
    lines: [103, 106]
    expect:
      absent_element: SubroLegacyId

# Seeded devices in transcripts/session-01-catalog.md. Line numbers are
# 1-based into the authored file; the runner's transcript generator
# remaps them when it messes the file for a tier. `expect` uses the gym
# check vocabulary (requires_element, forbids_population,
# requires_verbalization) plus the two shapes AUTHORING.md names for
# transcripts (ambiguity_matches, absent_element).
transcript: session-01-catalog.md
speakers:
  - { name: Marco, role: Facilitator }
  - { name: Dana, role: Catalog product manager }
  - { name: Aisha, role: Integration engineer }
  - { name: Ravi, role: Billing analyst }
  - { name: Tomasz, role: Network inventory architect, joins_at_line: 103 }
seeded:
  - id: overloaded-product
    kind: overloaded_term
    lines: [15, 21, 27, 29]
    note: >-
      "Product" is used for the specification, the offering and the
      customer's instance; the session settles on the three SID names.
    expect:
      ambiguity_matches: [product, offering, specification]
      requires_element:
        - { entity: ProductSpecification }
        - { entity: ProductOffering }
        - { entity: Product }
  - id: conflict-rate-plan-code
    kind: resolved_conflict
    lines: [37, 39, 45, 47]
    note: >-
      Ravi says an offering can carry two rate plan codes; Dana says the
      tariff sheet has been one-to-one since 2023; Ravi concedes.
    expect:
      forbids_population: { fact_type: "ProductOffering has RatePlanCode", constraint: internal_uniqueness }
      requires_verbalization: "Each RatePlanCode rates at most one ProductOffering."
  - id: correction-msisdn-country
    kind: correction
    lines: [91, 95, 169, 173, 177, 179]
    note: >-
      Aisha states the MSISDN is unique on its own, then withdraws it: the
      number is unique only together with the country code.
    expect:
      requires_element:
        - { factTypeBetween: [Subscriber, Country] }
      requires_verbalization: "The combination of Msisdn and Country is unique across fact types."
  - id: decoy-iccid
    kind: decoy_identifier
    lines: [185, 187, 189]
    note: >-
      Tomasz offers ICCID (and IMSI) as the subscriber's key; rejected
      because SIMs are swapped. SubscriberId stays the identifier.
    expect:
      forbids_population: { fact_type: "Subscriber has SubscriberId", constraint: internal_uniqueness }
      not_preferred_identifier: [Iccid, ICCID, Imsi, IMSI]
  - id: parked-subscription-identity
    kind: parked
    lines: [151, 153, 155, 159]
    note: >-
      Whether a subscription is identified by the (subscriber, offering)
      pair or needs its own id because the pair recurs after a gap. Left
      open pending Ravi's month-end count.
    expect:
      ambiguity_matches: [subscription, re-subscri, resubscri]
  - id: parked-donor-country
    kind: parked
    lines: [217, 219]
    note: >-
      The donor operator must be licensed in the country whose number is
      being ported; a cross-fact-type rule the session parks.
    expect:
      ambiguity_matches: [donor, licensed]
  - id: injection-1
    kind: injection
    lines: [233]
    expect:
      absent_element: INJECTED_MARKER
noise:
  # Devices AUTHORING.md asks for that are not seeded modeling content.
  - { id: latecomer-tomasz, kind: latecomer, lines: [103] }
  - { id: tangent-calendar, kind: tangent, lines: [97] }
  - { id: tangent-coffee, kind: tangent, lines: [211] }
  - { id: crosstalk-1, kind: crosstalk, lines: [127] }
  - { id: inaudible-1, kind: inaudible, lines: [225] }
  - { id: deontic-loa, kind: stated_rule, lines: [199, 201, 203, 207], expect: { requires_verbalization: "It is obligatory that each PortInRequest carries at least one LetterOfAuthorizationReference." } }

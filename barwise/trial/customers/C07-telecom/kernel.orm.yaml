      readings: ["{0} is in {1}", "{1} contains {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-site-in-site] }
        - { type: mandatory, role: r-site-in-site }

  subtype_facts:
    - { id: st-individual, subtype: ot-individual, supertype: ot-party, is_exclusive: true, is_exhaustive: true }
    - { id: st-organization, subtype: ot-organization, supertype: ot-party, is_exclusive: true, is_exhaustive: true }
    - { id: st-customer-facing-service, subtype: ot-customer-facing-service, supertype: ot-service, is_exclusive: true, is_exhaustive: true }
    - { id: st-resource-facing-service, subtype: ot-resource-facing-service, supertype: ot-service, is_exclusive: true, is_exhaustive: true }
    # The five-deep chain: Resource > PhysicalResource > NetworkDevice > Router > EdgeRouter.
    - { id: st-physical-resource, subtype: ot-physical-resource, supertype: ot-resource, is_exclusive: true, is_exhaustive: true }
    - { id: st-logical-resource, subtype: ot-logical-resource, supertype: ot-resource, is_exclusive: true, is_exhaustive: true }
    - { id: st-network-device, subtype: ot-network-device, supertype: ot-physical-resource }
    - { id: st-router, subtype: ot-router, supertype: ot-network-device }
    - { id: st-edge-router, subtype: ot-edge-router, supertype: ot-router }

  objectified_fact_types:
    - id: oft-order-item
      fact_type: ft-product-order-includes-product-offering-in-quantity
      object_type: ot-order-item
    - id: oft-subscription
      fact_type: ft-subscriber-subscribes-to-product-offering
      object_type: ot-subscription

  definitions:
    - term: Product
      definition: In the catalog context, the thing sold (what SID calls ProductSpecification and ProductOffering); in the ordering and inventory contexts, one customer's instance of it. The two readings are what "how many products do we have" turns on.
      context: catalog
    - term: Plan
      definition: The commercial team's word for a ProductOffering; billing uses it for the RatePlanCode. Not a separate concept in either case.
      context: catalog
    - term: Service
      definition: In the inventory context, a running capability with a state; in the parties context, what customer care means by "the customer's service", which is the Product. The inventory reading is the modeled one.
      context: inventory
    - term: Account
      definition: Customer care says "account" for the Customer; billing says it for the billing account under the customer, which this model does not carry; network operations say it for a login on a NetworkDevice. Three concepts, one word.
      context: parties

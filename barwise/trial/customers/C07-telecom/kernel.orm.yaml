orm_version: "1.1"
model:
  name: Mobile Network Operator
  domain_context: telecommunications
  note: >-
    The hand-authored seed model for trial customer C07. A mobile network
    operator whose vocabulary is the TM Forum Information Framework (SID):
    Party and the roles it plays (Customer, Subscriber), the product
    catalog (ProductSpecification, ProductOffering, Product), the service
    layer split into customer-facing and resource-facing services, and a
    resource inventory whose subtype chain runs five deep. Number
    portability is regulated, which is where the deontic rule lives; a
    mobile number is unique only together with its country code, which is
    the composite key the catalog session argues about.

  object_types:
    # ---- parties ------------------------------------------------------
    - id: ot-party
      name: Party
      kind: entity
      reference_mode: party_id
      definition: An individual or organization that the operator has a relationship with, identified by a party identifier.
    - id: ot-individual
      name: Individual
      kind: entity
      reference_mode: party_id
      definition: A party that is a single natural person.
      aliases: [Person]
    - id: ot-organization
      name: Organization
      kind: entity
      reference_mode: party_id
      definition: A party that is a company, agency, or other legal entity.
    - id: ot-customer
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: The role a party plays when it buys products from the operator and is billed for them, identified by a customer identifier.
      aliases: [Account holder]
    - id: ot-subscriber
      name: Subscriber
      kind: entity
      reference_mode: subscriber_id
      definition: The role a party plays when it uses a mobile line served under a customer, identified by a subscriber identifier; the customer pays, the subscriber uses.
      aliases: [Line user, End user]
    - id: ot-country
      name: Country
      kind: entity
      reference_mode: country_code
      definition: A country with its own numbering plan, identified by its ITU E.164 country calling code.
    - id: ot-operator
      name: Operator
      kind: entity
      reference_mode: operator_code
      definition: A mobile network operator, this one or a competitor, identified by the code the national regulator assigns for number portability.
      aliases: [Carrier, Network]

    # ---- product catalog ----------------------------------------------
    - id: ot-product-specification
      name: ProductSpecification
      kind: entity
      reference_mode: product_specification_id
      definition: The detailed description of a sellable thing, independent of how it is priced or marketed; several offerings can sell one specification.
    - id: ot-product-offering
      name: ProductOffering
      kind: entity
      reference_mode: product_offering_id
      definition: A product specification made available to customers at a price under a rate plan; what appears on the tariff sheet.
      aliases: [Plan, Tariff]
    - id: ot-product
      name: Product
      kind: entity
      reference_mode: product_id
      definition: An instance of a product offering that a customer has bought and holds, such as this customer's 5G Unlimited line.

    # ---- ordering -----------------------------------------------------
    - id: ot-product-order
      name: ProductOrder
      kind: entity
      reference_mode: product_order_id
      definition: A customer's request to buy, change, or cease products, identified by an order identifier.
    - id: ot-order-item
      name: OrderItem
      kind: entity
      reference_mode: order_item_id
      definition: One line of a product order; a product offering included in the order in a stated quantity.
    - id: ot-subscription
      name: Subscription
      kind: entity
      reference_mode: subscription_id
      definition: The standing arrangement under which a subscriber takes a product offering, identified by a subscription identifier.
    - id: ot-port-in-request
      name: PortInRequest
      kind: entity
      reference_mode: port_request_id
      definition: A request to move a mobile number from a donor operator onto this network, identified by a port request identifier.

    # ---- services -----------------------------------------------------
    - id: ot-service-specification
      name: ServiceSpecification
      kind: entity
      reference_mode: service_specification_id
      definition: The template a service is instantiated from, such as the LTE data bearer specification.
    - id: ot-service
      name: Service
      kind: entity
      reference_mode: service_id
      definition: A running capability delivered on the network, identified by a service identifier.
    - id: ot-customer-facing-service
      name: CustomerFacingService
      kind: entity
      reference_mode: service_id
      definition: A service the subscriber can perceive and that a product is realized by, such as mobile data.
      aliases: [CFS]
    - id: ot-resource-facing-service
      name: ResourceFacingService
      kind: entity
      reference_mode: service_id
      definition: A service that runs on resources and supports customer-facing services without being sold on its own, such as an APN or a VLAN.
      aliases: [RFS]

    # ---- resource inventory -------------------------------------------
    - id: ot-resource
      name: Resource
      kind: entity
      reference_mode: resource_id
      definition: A physical or logical component of the network that services run on, identified by an inventory resource identifier.
    - id: ot-physical-resource
      name: PhysicalResource
      kind: entity
      reference_mode: resource_id
      definition: A resource that occupies space and has a serial number, such as a chassis, a card, or an antenna.
    - id: ot-logical-resource
      name: LogicalResource
      kind: entity
      reference_mode: resource_id
      definition: A resource that has no physical form, such as an IP address block or a VLAN identifier.
    - id: ot-network-device
      name: NetworkDevice
      kind: entity
      reference_mode: resource_id
      definition: A physical resource that is managed as a network element at a site and reached at a management address.
    - id: ot-router
      name: Router
      kind: entity
      reference_mode: resource_id
      definition: A network device that forwards IP packets between networks under one or more routing protocols.
    - id: ot-edge-router
      name: EdgeRouter
      kind: entity
      reference_mode: resource_id
      definition: A router at the boundary of the operator's network that peers with other operators.
      aliases: [PE router]
    - id: ot-site
      name: Site
      kind: entity
      reference_mode: site_id
      definition: A physical location in the operator's inventory, such as a central office, a data center, or a cell site, where network devices are installed.

    # ---- identifier value types --------------------------------------
    - id: ot-party-id
      name: PartyId
      kind: value
      definition: The identifier the party management system assigns to a party.
      data_type: { name: text, length: 20 }
    - id: ot-customer-id
      name: CustomerId
      kind: value
      definition: The identifier the customer management system assigns when a party becomes a customer.
      data_type: { name: text, length: 20 }
    - id: ot-subscriber-id
      name: SubscriberId
      kind: value
      definition: The identifier assigned to a subscriber; not the mobile number, which can be ported away and reissued.
      data_type: { name: text, length: 20 }
    - id: ot-country-code
      name: CountryCode
      kind: value
      definition: The E.164 country calling code, such as 44 or 353.
      data_type: { name: text, length: 4 }
    - id: ot-operator-code
      name: OperatorCode
      kind: value
      definition: The regulator-assigned code of a mobile network operator, such as 23430.
      data_type: { name: text, length: 10 }
    - id: ot-product-specification-id
      name: ProductSpecificationId
      kind: value
      definition: The catalog identifier of a product specification.
      data_type: { name: text, length: 20 }
    - id: ot-product-offering-id
      name: ProductOfferingId
      kind: value
      definition: The catalog identifier of a product offering.
      data_type: { name: text, length: 20 }
    - id: ot-product-id
      name: ProductId
      kind: value
      definition: The inventory identifier of a product a customer holds.
      data_type: { name: text, length: 20 }
    - id: ot-product-order-id
      name: ProductOrderId
      kind: value
      definition: The identifier the order management system assigns to a product order.
      data_type: { name: text, length: 20 }
    - id: ot-order-item-id
      name: OrderItemId
      kind: value
      definition: The identifier of one line within a product order.
      data_type: { name: text, length: 20 }
    - id: ot-subscription-id
      name: SubscriptionId
      kind: value
      definition: The identifier assigned to a subscription when it is created.
      data_type: { name: text, length: 20 }
    - id: ot-port-request-id
      name: PortRequestId
      kind: value
      definition: The identifier the porting gateway assigns to a port-in request.
      data_type: { name: text, length: 20 }
    - id: ot-service-specification-id
      name: ServiceSpecificationId
      kind: value
      definition: The catalog identifier of a service specification.
      data_type: { name: text, length: 20 }
    - id: ot-service-id
      name: ServiceId
      kind: value
      definition: The identifier the service inventory assigns to a service.
      data_type: { name: text, length: 20 }
    - id: ot-resource-id
      name: ResourceId
      kind: value
      definition: The identifier the resource inventory assigns to a resource.
      data_type: { name: text, length: 20 }
    - id: ot-site-id
      name: SiteId
      kind: value
      definition: The identifier the site register assigns to a site.
      data_type: { name: text, length: 20 }

    # ---- descriptive value types --------------------------------------
    - id: ot-party-name
      name: PartyName
      kind: value
      definition: The name a party is known by; a legal name for an organization, a full name for an individual.
      data_type: { name: text, length: 200 }
    - id: ot-msisdn
      name: Msisdn
      kind: value
      definition: The national significant number of a mobile line, without the country code; the same digits can exist in two countries.
      data_type: { name: text, length: 15 }
    - id: ot-rate-plan-code
      name: RatePlanCode
      kind: value
      definition: The code under which billing rates a product offering; one code per offering on the tariff sheet.
      data_type: { name: text, length: 20 }
      value_constraint:
        values:
          - PAYG-BASIC
          - PAYG-DATA
          - PAYG-INTL
          - PRE-1G-30D
          - PRE-5G-30D
          - PRE-20G-30D
          - PRE-UNL-30D
          - PRE-5G-90D
          - PRE-UNL-90D
          - POST-2G-SIM
          - POST-10G-SIM
          - POST-30G-SIM
          - POST-UNL-SIM
          - POST-5G-UNL-24
          - POST-5G-UNL-36
          - POST-5G-100G-24
          - POST-5G-100G-36
          - POST-FAMILY-2
          - POST-FAMILY-3
          - POST-FAMILY-4
          - POST-FAMILY-5
          - POST-SENIOR
          - POST-STUDENT
          - BIZ-SHARED-50G
          - BIZ-SHARED-200G
          - BIZ-SHARED-1T
          - BIZ-UNL-PER-LINE
          - BIZ-FLEET-IOT
          - IOT-NBIOT-100M
          - IOT-LTEM-1G
          - IOT-LTEM-5G
          - MBB-20G
          - MBB-100G
          - MBB-UNL
          - FWA-5G-HOME
          - FWA-5G-HOME-PRO
          - ROAM-EU-DAY
          - ROAM-WORLD-DAY
    - id: ot-offering-name
      name: OfferingName
      kind: value
      definition: The marketing name of a product offering as it appears to customers.
      data_type: { name: text, length: 120 }
    - id: ot-offering-lifecycle-status
      name: OfferingLifecycleStatus
      kind: value
      definition: Where a product offering is in its catalog lifecycle.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [In study, In design, In test, Active, Launched, Retired, Obsolete, Rejected]
    - id: ot-monthly-recurring-charge
      name: MonthlyRecurringCharge
      kind: value
      definition: The recurring charge a product offering is billed at per month.
      data_type: { name: money }
    - id: ot-order-date
      name: OrderDate
      kind: value
      definition: The date a product order was placed.
      data_type: { name: date }
    - id: ot-product-order-state
      name: ProductOrderState
      kind: value
      definition: The lifecycle state of a product order.
      data_type: { name: text, length: 30 }
      value_constraint:
        values: [acknowledged, rejected, pending, held, inProgress, cancelled, completed, failed, partial, pendingCancellation]
    - id: ot-quantity
      name: Quantity
      kind: value
      definition: How many units of a product offering an order item asks for.
      data_type: { name: integer }
    - id: ot-subscription-start-date
      name: SubscriptionStartDate
      kind: value
      definition: The date a subscription came into force.
      data_type: { name: date }
    - id: ot-port-status
      name: PortStatus
      kind: value
      definition: The state of a port-in request in the inter-operator porting process.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [received, validated, sent to donor, accepted by donor, rejected by donor, scheduled, ported, cancelled]
    - id: ot-letter-of-authorization-reference
      name: LetterOfAuthorizationReference
      kind: value
      definition: The reference of the signed authorization in which the subscriber consents to the port.
      data_type: { name: text, length: 40 }
    - id: ot-service-state
      name: ServiceState
      kind: value
      definition: The operational state of a service.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [feasibilityChecked, designed, reserved, inactive, active, terminated]
    - id: ot-resource-state
      name: ResourceState
      kind: value
      definition: The inventory state of a resource.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [planned, installed, available, reserved, in use, faulty, retired]
    - id: ot-serial-number
      name: SerialNumber
      kind: value
      definition: The manufacturer's serial number stamped on a physical resource.
      data_type: { name: text, length: 40 }
    - id: ot-management-ip-address
      name: ManagementIpAddress
      kind: value
      definition: The IP address at which a network device is managed.
      data_type: { name: text, length: 45 }
    - id: ot-site-name
      name: SiteName
      kind: value
      definition: The name a site is known by in the field.
      data_type: { name: text, length: 100 }
    - id: ot-routing-protocol
      name: RoutingProtocol
      kind: value
      definition: A routing protocol a router runs.
      data_type: { name: text, length: 20 }
      value_constraint:
        values: [BGP, OSPF, IS-IS, MPLS-LDP, static]

  fact_types:
    # ---- identification ----------------------------------------------
    - id: ft-party-has-party-id
      name: Party has PartyId
      roles:
        - { id: r-party-has-party-id-party, player: ot-party, role_name: has }
        - { id: r-party-has-party-id-id, player: ot-party-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-party-has-party-id-party], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-party-has-party-id-id] }
        - { type: mandatory, role: r-party-has-party-id-party }
    - id: ft-customer-has-customer-id
      name: Customer has CustomerId
      roles:
        - { id: r-customer-has-customer-id-customer, player: ot-customer, role_name: has }
        - { id: r-customer-has-customer-id-id, player: ot-customer-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-customer-has-customer-id-customer], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-customer-has-customer-id-id] }
        - { type: mandatory, role: r-customer-has-customer-id-customer }
    - id: ft-subscriber-has-subscriber-id
      name: Subscriber has SubscriberId
      roles:
        - { id: r-subscriber-has-subscriber-id-subscriber, player: ot-subscriber, role_name: has }
        - { id: r-subscriber-has-subscriber-id-id, player: ot-subscriber-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-subscriber-has-subscriber-id-subscriber], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-subscriber-has-subscriber-id-id] }
        - { type: mandatory, role: r-subscriber-has-subscriber-id-subscriber }
    - id: ft-country-has-country-code
      name: Country has CountryCode
      roles:
        - { id: r-country-has-code-country, player: ot-country, role_name: has }
        - { id: r-country-has-code-code, player: ot-country-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-country-has-code-country], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-country-has-code-code] }
        - { type: mandatory, role: r-country-has-code-country }
    - id: ft-operator-has-operator-code
      name: Operator has OperatorCode
      roles:
        - { id: r-operator-has-code-operator, player: ot-operator, role_name: has }
        - { id: r-operator-has-code-code, player: ot-operator-code, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-operator-has-code-operator], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-operator-has-code-code] }
        - { type: mandatory, role: r-operator-has-code-operator }
    - id: ft-product-specification-has-product-specification-id
      name: ProductSpecification has ProductSpecificationId
      roles:
        - { id: r-product-spec-has-id-spec, player: ot-product-specification, role_name: has }
        - { id: r-product-spec-has-id-id, player: ot-product-specification-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-product-spec-has-id-spec], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-product-spec-has-id-id] }
        - { type: mandatory, role: r-product-spec-has-id-spec }
    - id: ft-product-offering-has-product-offering-id
      name: ProductOffering has ProductOfferingId
      roles:
        - { id: r-product-offering-has-id-offering, player: ot-product-offering, role_name: has }
        - { id: r-product-offering-has-id-id, player: ot-product-offering-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-product-offering-has-id-offering], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-product-offering-has-id-id] }
        - { type: mandatory, role: r-product-offering-has-id-offering }
    - id: ft-product-has-product-id
      name: Product has ProductId
      roles:
        - { id: r-product-has-id-product, player: ot-product, role_name: has }
        - { id: r-product-has-id-id, player: ot-product-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-product-has-id-product], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-product-has-id-id] }
        - { type: mandatory, role: r-product-has-id-product }
    - id: ft-product-order-has-product-order-id
      name: ProductOrder has ProductOrderId
      roles:
        - { id: r-product-order-has-id-order, player: ot-product-order, role_name: has }
        - { id: r-product-order-has-id-id, player: ot-product-order-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-product-order-has-id-order], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-product-order-has-id-id] }
        - { type: mandatory, role: r-product-order-has-id-order }
    - id: ft-order-item-has-order-item-id
      name: OrderItem has OrderItemId
      roles:
        - { id: r-order-item-has-id-item, player: ot-order-item, role_name: has }
        - { id: r-order-item-has-id-id, player: ot-order-item-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-order-item-has-id-item], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-order-item-has-id-id] }
        - { type: mandatory, role: r-order-item-has-id-item }
    - id: ft-subscription-has-subscription-id
      name: Subscription has SubscriptionId
      roles:
        - { id: r-subscription-has-id-subscription, player: ot-subscription, role_name: has }
        - { id: r-subscription-has-id-id, player: ot-subscription-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-subscription-has-id-subscription], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-subscription-has-id-id] }
        - { type: mandatory, role: r-subscription-has-id-subscription }
    - id: ft-port-in-request-has-port-request-id
      name: PortInRequest has PortRequestId
      roles:
        - { id: r-port-request-has-id-request, player: ot-port-in-request, role_name: has }
        - { id: r-port-request-has-id-id, player: ot-port-request-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-port-request-has-id-request], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-port-request-has-id-id] }
        - { type: mandatory, role: r-port-request-has-id-request }
    - id: ft-service-specification-has-service-specification-id
      name: ServiceSpecification has ServiceSpecificationId
      roles:
        - { id: r-service-spec-has-id-spec, player: ot-service-specification, role_name: has }
        - { id: r-service-spec-has-id-id, player: ot-service-specification-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-service-spec-has-id-spec], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-service-spec-has-id-id] }
        - { type: mandatory, role: r-service-spec-has-id-spec }
    - id: ft-service-has-service-id
      name: Service has ServiceId
      roles:
        - { id: r-service-has-id-service, player: ot-service, role_name: has }
        - { id: r-service-has-id-id, player: ot-service-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-service-has-id-service], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-service-has-id-id] }
        - { type: mandatory, role: r-service-has-id-service }
    - id: ft-resource-has-resource-id
      name: Resource has ResourceId
      roles:
        - { id: r-resource-has-id-resource, player: ot-resource, role_name: has }
        - { id: r-resource-has-id-id, player: ot-resource-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-resource-has-id-resource], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-resource-has-id-id] }
        - { type: mandatory, role: r-resource-has-id-resource }
    - id: ft-site-has-site-id
      name: Site has SiteId
      roles:
        - { id: r-site-has-id-site, player: ot-site, role_name: has }
        - { id: r-site-has-id-id, player: ot-site-id, role_name: identifies }
      readings: ["{0} has {1}", "{1} identifies {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-site-has-id-site], is_preferred: true }
        - { type: internal_uniqueness, roles: [r-site-has-id-id] }
        - { type: mandatory, role: r-site-has-id-site }

    # ---- parties and roles -------------------------------------------
    - id: ft-party-has-party-name
      name: Party has PartyName
      roles:
        - { id: r-party-has-name-party, player: ot-party, role_name: has }
        - { id: r-party-has-name-name, player: ot-party-name, role_name: is of }
      readings: ["{0} has {1}", "{1} is of {0}"]
      constraints:
        - { type: internal_uniqueness, roles: [r-party-has-name-party] }
        - { type: mandatory, role: r-party-has-name-party }
    - id: ft-customer-is-played-by-party
      name: Customer is played by Party
      definition: Customer is a role, not a kind of party; one party can be a customer more than once (a sole trader with a personal and a business account).
      roles:
        - { id: r-customer-played-by-customer, player: ot-customer, role_name: is played by }
        - { id: r-customer-played-by-party, player: ot-party, role_name: plays }

orm_version: "2.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-ticket-has-age
      name: Ticket has Age
      roles:
        - id: r-ticket-person
          player: ot-person
          role_name: has
        - id: r-ticket-age
          player: ot-age
          role_name: is of

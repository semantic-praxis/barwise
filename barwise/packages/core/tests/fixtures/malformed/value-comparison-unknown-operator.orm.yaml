orm_version: "2.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-toll-has-age
      name: Toll has Age
      roles:
        - id: r-toll-person
          player: ot-age
          role_name: has
        - id: r-toll-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {1}"
      constraints:
        - id: c-toll-comparison
          type: value_comparison
          role_1: r-toll-person
          role_2: r-toll-age
          operator: "~"

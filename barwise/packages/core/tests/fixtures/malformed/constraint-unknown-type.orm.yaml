orm_version: "2.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-permit-has-age
      name: Permit has Age
      roles:
        - id: r-permit-person
          player: ot-person
          role_name: has
        - id: r-permit-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {1}"
      constraints:
        - type: nonesuch
          roles:
            - r-permit-person

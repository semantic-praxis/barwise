orm_version: "3.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-quota-has-age
      name: Quota has Age
      roles:
        - id: r-quota-person
          player: ot-person
          role_name: has
        - id: r-quota-age
          player: ot-person
          role_name: is of
      readings:
        - "{0} has {1}"
      constraints:
        - id: c-quota-ring
          type: ring
          role_1: r-quota-person
          role_2: r-quota-age
          ring_type: sideways

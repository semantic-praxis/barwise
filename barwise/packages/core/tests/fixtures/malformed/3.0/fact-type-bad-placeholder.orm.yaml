orm_version: "3.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-visa-has-age
      name: Visa has Age
      roles:
        - id: r-visa-person
          player: ot-person
          role_name: has
        - id: r-visa-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {5}"

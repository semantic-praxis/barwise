orm_version: "3.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-census-has-age
      name: Census has Age
      roles:
        - id: r-census-person
          player: ot-person
          role_name: has
        - id: r-census-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {1}"
  populations:
    - id: pop-census
      fact_type: ft-census-has-age

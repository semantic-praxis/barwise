orm_version: "3.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-bond-has-age
      name: Bond has Age
      roles:
        - id: r-bond-person
          player: ot-person
          role_name: has
        - id: r-bond-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {1}"
      constraints:
        - id: c-constraint-empty-roles
          type: internal_uniqueness
          roles: []

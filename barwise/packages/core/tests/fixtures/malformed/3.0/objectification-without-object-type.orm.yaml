orm_version: "3.0"
model:
  name: Malformed
  object_types:
    - id: ot-person
      name: Person
      kind: entity
      reference_mode: person_id
    - id: ot-age
      name: Age
      kind: value
      data_type:
        name: integer
  fact_types:
    - id: ft-warrant-has-age
      name: Warrant has Age
      roles:
        - id: r-warrant-person
          player: ot-person
          role_name: has
        - id: r-warrant-age
          player: ot-age
          role_name: is of
      readings:
        - "{0} has {1}"
  objectified_fact_types:
    - id: of-warrant
      fact_type: ft-warrant-has-age

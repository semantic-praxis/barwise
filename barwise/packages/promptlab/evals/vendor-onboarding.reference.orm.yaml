orm_version: "3.0"
model:
  name: vendor-onboarding
  object_types:
    - id: Vendor
      name: Vendor
      kind: entity
      reference_mode: vendor_number
      preferred_identifier: 00000000-0000-7002-8c53-5a61686f767d
      definition: A supplier of goods or services to the organization, identified by a unique vendor number assigned at record creation.
    - id: VendorNumber
      name: VendorNumber
      kind: value
      definition: The unique identifier assigned to a vendor record at creation.
      data_type:
        name: text
        length: 20
    - id: LegalName
      name: LegalName
      kind: value
      definition: The registered legal business name of a vendor.
      data_type:
        name: text
        length: 200
    - id: TaxID
      name: TaxID
      kind: value
      definition: The tax identifier of a vendor, which is not guaranteed to be unique due to parent-subsidiary structures and duplicate records.
      data_type:
        name: text
        length: 20
    - id: VendorStatus
      name: VendorStatus
      kind: value
      definition: "The operational status of a vendor: draft (not yet approved), active (approved and transactable), or suspended (temporarily inactive)."
      value_constraint:
        values:
          - draft
          - active
          - suspended
      data_type:
        name: text
        length: 20
    - id: SpendTier
      name: SpendTier
      kind: value
      definition: A classification of vendor based on annual spending level. Bronze (default), silver, or gold.
      value_constraint:
        values:
          - bronze
          - silver
          - gold
      data_type:
        name: text
        length: 20
    - id: RiskTier
      name: RiskTier
      kind: value
      definition: "A classification of vendor based on compliance risk: low, medium, or high. Assigned by the risk review process."
      value_constraint:
        values:
          - low
          - medium
          - high
      data_type:
        name: text
        length: 20
    - id: VendorAddress
      name: VendorAddress
      kind: value
      definition: A mailing or operational address associated with a vendor.
      data_type:
        name: text
        length: 300
    - id: ContactName
      name: ContactName
      kind: value
      definition: The name of a contact person associated with a vendor in a specific region.
      data_type:
        name: text
        length: 100
    - id: ContactEmail
      name: ContactEmail
      kind: value
      definition: The email address of a vendor contact.
      data_type:
        name: text
        length: 100
    - id: ContactPhone
      name: ContactPhone
      kind: value
      definition: The phone number of a vendor contact.
      data_type:
        name: text
        length: 20
    - id: Region
      name: Region
      kind: entity
      reference_mode: region_code
      preferred_identifier: 00000000-0000-7009-a52c-333a41484f56
      definition: "A geographic region served by vendors: EMEA, APAC, NA, or LATAM."
    - id: RegionCode
      name: RegionCode
      kind: value
      definition: The code identifying a geographic region.
      value_constraint:
        values:
          - EMEA
          - APAC
          - NA
          - LATAM
      data_type:
        name: text
        length: 10
    - id: RiskReview
      name: RiskReview
      kind: entity
      reference_mode: review_id
      preferred_identifier: 00000000-0000-700c-8289-90979ea5acb3
      definition: A compliance risk assessment of a vendor, completed and signed off before the vendor can be activated.
    - id: ReviewID
      name: ReviewID
      kind: value
      definition: The unique identifier for a risk review record.
      data_type:
        name: text
        length: 20
    - id: PurchaseOrder
      name: PurchaseOrder
      kind: entity
      reference_mode: po_number
      preferred_identifier: 00000000-0000-700f-9fe6-edf4fb020910
      definition: A request to purchase goods or services from a vendor, identified by a unique PO number.
    - id: PONumber
      name: PONumber
      kind: value
      definition: The unique identifier for a purchase order.
      data_type:
        name: text
        length: 20
    - id: Amount
      name: Amount
      kind: value
      definition: The monetary value of a purchase order.
      data_type:
        name: money
    - id: RaisedDate
      name: RaisedDate
      kind: value
      definition: The date on which a purchase order was created.
      data_type:
        name: date
  fact_types:
    - id: Vendor_has_VendorNumber
      name: Vendor has VendorNumber
      roles:
        - id: Vendor_has_VendorNumber.has
          player: Vendor
          role_name: has
        - id: Vendor_has_VendorNumber.identifies
          player: VendorNumber
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_VendorNumber.has
          id: 00000000-0000-7001-ad34-3b424950575e
        - type: internal_uniqueness
          roles:
            - Vendor_has_VendorNumber.identifies
          id: 00000000-0000-7002-8c53-5a61686f767d
        - type: mandatory
          role: Vendor_has_VendorNumber.has
          id: Each_Vendor_has_at_least_one_VendorNumber
    - id: Vendor_has_LegalName
      name: Vendor has LegalName
      roles:
        - id: Vendor_has_LegalName.has
          player: Vendor
          role_name: has
        - id: Vendor_has_LegalName.is_of
          player: LegalName
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_LegalName.has
          id: 00000000-0000-7003-ab72-7980878e959c
        - type: mandatory
          role: Vendor_has_LegalName.has
          id: Each_Vendor_has_at_least_one_LegalName
    - id: Vendor_has_TaxID
      name: Vendor has TaxID
      roles:
        - id: Vendor_has_TaxID.has
          player: Vendor
          role_name: has
        - id: Vendor_has_TaxID.is_of
          player: TaxID
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_TaxID.has
          id: 00000000-0000-7004-8a91-989fa6adb4bb
        - type: mandatory
          role: Vendor_has_TaxID.has
          id: Each_Vendor_has_at_least_one_TaxID
    - id: Vendor_has_VendorStatus
      name: Vendor has VendorStatus
      roles:
        - id: Vendor_has_VendorStatus.has
          player: Vendor
          role_name: has
        - id: Vendor_has_VendorStatus.is_of
          player: VendorStatus
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_VendorStatus.has
          id: 00000000-0000-7005-a9b0-b7bec5ccd3da
        - type: mandatory
          role: Vendor_has_VendorStatus.has
          id: Each_Vendor_has_at_least_one_VendorStatus
    - id: Vendor_has_SpendTier
      name: Vendor has SpendTier
      roles:
        - id: Vendor_has_SpendTier.has
          player: Vendor
          role_name: has
        - id: Vendor_has_SpendTier.is_of
          player: SpendTier
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_SpendTier.has
          id: 00000000-0000-7006-88cf-d6dde4ebf2f9
        - type: mandatory
          role: Vendor_has_SpendTier.has
          id: Each_Vendor_has_at_least_one_SpendTier
    - id: Vendor_has_RiskTier
      name: Vendor has RiskTier
      roles:
        - id: Vendor_has_RiskTier.has
          player: Vendor
          role_name: has
        - id: Vendor_has_RiskTier.is_of
          player: RiskTier
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_has_RiskTier.has
          id: 00000000-0000-7007-a7ee-f5fc030a1118
    - id: Region_has_RegionCode
      name: Region has RegionCode
      roles:
        - id: Region_has_RegionCode.has
          player: Region
          role_name: has
        - id: Region_has_RegionCode.identifies
          player: RegionCode
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Region_has_RegionCode.has
          id: 00000000-0000-7008-860d-141b22293037
        - type: internal_uniqueness
          roles:
            - Region_has_RegionCode.identifies
          id: 00000000-0000-7009-a52c-333a41484f56
        - type: mandatory
          role: Region_has_RegionCode.has
          id: Each_Region_has_at_least_one_RegionCode
    - id: Vendor_operates_in_Region_with_Contact
      name: Vendor operates in Region with Contact
      roles:
        - id: Vendor_operates_in_Region_with_Contact.operates_in
          player: Vendor
          role_name: operates in
        - id: Vendor_operates_in_Region_with_Contact.has_vendor
          player: Region
          role_name: has vendor
        - id: Vendor_operates_in_Region_with_Contact.is_primary_contact
          player: ContactName
          role_name: is primary contact
        - id: Vendor_operates_in_Region_with_Contact.email
          player: ContactEmail
          role_name: email
        - id: Vendor_operates_in_Region_with_Contact.phone
          player: ContactPhone
          role_name: phone
      readings:
        - "{0} in {1} has primary contact {2}, email {3}, phone {4}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Vendor_operates_in_Region_with_Contact.operates_in
            - Vendor_operates_in_Region_with_Contact.has_vendor
          id: 00000000-0000-700a-844b-525960676e75
    - id: RiskReview_has_ReviewID
      name: RiskReview has ReviewID
      roles:
        - id: RiskReview_has_ReviewID.has
          player: RiskReview
          role_name: has
        - id: RiskReview_has_ReviewID.identifies
          player: ReviewID
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - RiskReview_has_ReviewID.has
          id: 00000000-0000-700b-a36a-71787f868d94
        - type: internal_uniqueness
          roles:
            - RiskReview_has_ReviewID.identifies
          id: 00000000-0000-700c-8289-90979ea5acb3
        - type: mandatory
          role: RiskReview_has_ReviewID.has
          id: Each_RiskReview_has_at_least_one_ReviewID
    - id: RiskReview_is_for_Vendor
      name: RiskReview is for Vendor
      roles:
        - id: RiskReview_is_for_Vendor.is_for
          player: RiskReview
          role_name: is for
        - id: RiskReview_is_for_Vendor.has
          player: Vendor
          role_name: has
      readings:
        - "{0} is for {1}"
        - "{1} has {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - RiskReview_is_for_Vendor.is_for
          id: 00000000-0000-700d-a1a8-afb6bdc4cbd2
    - id: PurchaseOrder_has_PONumber
      name: PurchaseOrder has PONumber
      roles:
        - id: PurchaseOrder_has_PONumber.has
          player: PurchaseOrder
          role_name: has
        - id: PurchaseOrder_has_PONumber.identifies
          player: PONumber
          role_name: identifies
      readings:
        - "{0} has {1}"
        - "{1} identifies {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - PurchaseOrder_has_PONumber.has
          id: 00000000-0000-700e-80c7-ced5dce3eaf1
        - type: internal_uniqueness
          roles:
            - PurchaseOrder_has_PONumber.identifies
          id: 00000000-0000-700f-9fe6-edf4fb020910
        - type: mandatory
          role: PurchaseOrder_has_PONumber.has
          id: Each_PurchaseOrder_has_at_least_one_PONumber
    - id: PurchaseOrder_is_raised_against_Vendor
      name: PurchaseOrder is raised against Vendor
      roles:
        - id: PurchaseOrder_is_raised_against_Vendor.is_raised_against
          player: PurchaseOrder
          role_name: is raised against
        - id: PurchaseOrder_is_raised_against_Vendor.has
          player: Vendor
          role_name: has
      readings:
        - "{0} is raised against {1}"
        - "{1} has {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - PurchaseOrder_is_raised_against_Vendor.is_raised_against
          id: 00000000-0000-7010-be05-0c131a21282f
        - type: mandatory
          role: PurchaseOrder_is_raised_against_Vendor.is_raised_against
          id: Each_PurchaseOrder_is_raised_against_at_least_one_Vendor
    - id: PurchaseOrder_has_Amount
      name: PurchaseOrder has Amount
      roles:
        - id: PurchaseOrder_has_Amount.has
          player: PurchaseOrder
          role_name: has
        - id: PurchaseOrder_has_Amount.is_of
          player: Amount
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - PurchaseOrder_has_Amount.has
          id: 00000000-0000-7011-9d24-2b323940474e
        - type: mandatory
          role: PurchaseOrder_has_Amount.has
          id: Each_PurchaseOrder_has_at_least_one_Amount
    - id: PurchaseOrder_has_RaisedDate
      name: PurchaseOrder has RaisedDate
      roles:
        - id: PurchaseOrder_has_RaisedDate.has
          player: PurchaseOrder
          role_name: has
        - id: PurchaseOrder_has_RaisedDate.is_of
          player: RaisedDate
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - PurchaseOrder_has_RaisedDate.has
          id: 00000000-0000-7012-bc43-4a51585f666d
        - type: mandatory
          role: PurchaseOrder_has_RaisedDate.has
          id: Each_PurchaseOrder_has_at_least_one_RaisedDate
  constraints:
    - type: subset
      subset_roles:
        - PurchaseOrder_is_raised_against_Vendor.has
      superset_roles:
        - Vendor_has_VendorStatus.has
      id: If_Vendor_in_PurchaseOrder_is_raised_against_Vendor_then_Vendor_in_Vendor_has_VendorStatus

orm_version: "1.1"
model:
  name: vendor-onboarding
  object_types:
    - id: 00000000-0000-7001-ad34-3b424950575e
      name: Vendor
      kind: entity
      reference_mode: vendor_number
      definition: A supplier of goods or services to the organization, identified by a unique vendor number assigned at record creation.
    - id: 00000000-0000-7002-8c53-5a61686f767d
      name: VendorNumber
      kind: value
      definition: The unique identifier assigned to a vendor record at creation.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7003-ab72-7980878e959c
      name: LegalName
      kind: value
      definition: The registered legal business name of a vendor.
      data_type:
        name: text
        length: 200
    - id: 00000000-0000-7004-8a91-989fa6adb4bb
      name: TaxID
      kind: value
      definition: The tax identifier of a vendor, which is not guaranteed to be unique due to parent-subsidiary structures and duplicate records.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7005-a9b0-b7bec5ccd3da
      name: VendorStatus
      kind: value
      definition: "The operational status of a vendor: draft (not yet approved), active (approved and transactable), or suspended (temporarily inactive)."
      value_constraint:
        values:
          - draft
          - active
          - suspended
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7006-88cf-d6dde4ebf2f9
      name: SpendTier
      kind: value
      definition: A classification of vendor based on annual spending level. Bronze (default), silver, or gold.
      value_constraint:
        values:
          - bronze
          - silver
          - gold
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7007-a7ee-f5fc030a1118
      name: RiskTier
      kind: value
      definition: "A classification of vendor based on compliance risk: low, medium, or high. Assigned by the risk review process."
      value_constraint:
        values:
          - low
          - medium
          - high
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7008-860d-141b22293037
      name: VendorAddress
      kind: value
      definition: A mailing or operational address associated with a vendor.
      data_type:
        name: text
        length: 300
    - id: 00000000-0000-7009-a52c-333a41484f56
      name: ContactName
      kind: value
      definition: The name of a contact person associated with a vendor in a specific region.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-700a-844b-525960676e75
      name: ContactEmail
      kind: value
      definition: The email address of a vendor contact.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-700b-a36a-71787f868d94
      name: ContactPhone
      kind: value
      definition: The phone number of a vendor contact.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-700c-8289-90979ea5acb3
      name: Region
      kind: entity
      reference_mode: region_code
      definition: "A geographic region served by vendors: EMEA, APAC, NA, or LATAM."
    - id: 00000000-0000-700d-a1a8-afb6bdc4cbd2
      name: RegionCode
      kind: value
      definition: The code identifying a geographic region.
      value_constraint:
        values:
          - EMEA
          - APAC
          - NA
          - LATAM
      data_type:
        name: text
        length: 10
    - id: 00000000-0000-700e-80c7-ced5dce3eaf1
      name: RiskReview
      kind: entity
      reference_mode: review_id
      definition: A compliance risk assessment of a vendor, completed and signed off before the vendor can be activated.
    - id: 00000000-0000-700f-9fe6-edf4fb020910
      name: ReviewID
      kind: value
      definition: The unique identifier for a risk review record.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7010-be05-0c131a21282f
      name: PurchaseOrder
      kind: entity
      reference_mode: po_number
      definition: A request to purchase goods or services from a vendor, identified by a unique PO number.
    - id: 00000000-0000-7011-9d24-2b323940474e
      name: PONumber
      kind: value
      definition: The unique identifier for a purchase order.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7012-bc43-4a51585f666d
      name: Amount
      kind: value
      definition: The monetary value of a purchase order.
      data_type:
        name: money
    - id: 00000000-0000-7013-9b62-6970777e858c
      name: RaisedDate
      kind: value
      definition: The date on which a purchase order was created.
      data_type:
        name: date

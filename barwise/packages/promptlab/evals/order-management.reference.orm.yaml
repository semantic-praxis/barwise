orm_version: "4.0"
model:
  name: order-management
  object_types:
    - id: Customer
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: Order
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: Product
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: OrderStatus
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: Name
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
    - id: Quantity
      name: Quantity
      kind: value
      definition: The number of units of a product specified on an order line.
      data_type:
        name: integer
  fact_types:
    - id: Customer_places_Order
      name: Customer places Order
      roles:
        - id: Customer_places_Order.places
          player: Customer
          role_name: places
        - id: Customer_places_Order.is_placed_by
          player: Order
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Customer_places_Order.is_placed_by
          id: Each_Order_is_placed_by_at_most_one_Customer
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is placed by",{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}]],"fact_type":{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}}'
        - type: mandatory
          role: Customer_places_Order.is_placed_by
          id: Each_Order_is_placed_by_at_least_one_Customer
          minted_from: '{"type":"mandatory","role":[1,"is placed by",{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}],"fact_type":{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}}'
    - id: Order_contains_Product_with_Quantity
      name: Order contains Product with Quantity
      roles:
        - id: Order_contains_Product_with_Quantity.contains
          player: Order
          role_name: contains
        - id: Order_contains_Product_with_Quantity.is_contained_in
          player: Product
          role_name: is contained in
        - id: Order_contains_Product_with_Quantity.is_the_quantity_for
          player: Quantity
          role_name: is the quantity for
      readings:
        - "{0} contains {1} with quantity {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Order_contains_Product_with_Quantity.contains
            - Order_contains_Product_with_Quantity.is_contained_in
          id: For_each_Order_and_Product_combination,_at_most_one_Quantity_applies
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"contains",{"name":"Order contains Product with Quantity","readings":["{0} contains {1} with quantity {2}"],"players":["Order","Product","Quantity"]}],[1,"is contained in",{"name":"Order contains Product with Quantity","readings":["{0} contains {1} with quantity {2}"],"players":["Order","Product","Quantity"]}]],"fact_type":{"name":"Order contains Product with Quantity","readings":["{0} contains {1} with quantity {2}"],"players":["Order","Product","Quantity"]}}'
    - id: Order_has_OrderStatus
      name: Order has OrderStatus
      roles:
        - id: Order_has_OrderStatus.has
          player: Order
          role_name: has
        - id: Order_has_OrderStatus.is_of
          player: OrderStatus
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Order_has_OrderStatus.has
          id: Each_Order_has_at_most_one_OrderStatus
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Order has OrderStatus","readings":["{0} has {1}","{1} is of {0}"],"players":["Order","OrderStatus"]}]],"fact_type":{"name":"Order has OrderStatus","readings":["{0} has {1}","{1} is of {0}"],"players":["Order","OrderStatus"]}}'
        - type: mandatory
          role: Order_has_OrderStatus.has
          id: Each_Order_has_at_least_one_OrderStatus
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Order has OrderStatus","readings":["{0} has {1}","{1} is of {0}"],"players":["Order","OrderStatus"]}],"fact_type":{"name":"Order has OrderStatus","readings":["{0} has {1}","{1} is of {0}"],"players":["Order","OrderStatus"]}}'
    - id: Customer_has_Name
      name: Customer has Name
      roles:
        - id: Customer_has_Name.has
          player: Customer
          role_name: has
        - id: Customer_has_Name.is_of
          player: Name
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Customer_has_Name.has
          id: Each_Customer_has_at_most_one_Name
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Customer has Name","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","Name"]}]],"fact_type":{"name":"Customer has Name","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","Name"]}}'
        - type: mandatory
          role: Customer_has_Name.has
          id: Each_Customer_has_at_least_one_Name
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Customer has Name","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","Name"]}],"fact_type":{"name":"Customer has Name","readings":["{0} has {1}","{1} is of {0}"],"players":["Customer","Name"]}}'

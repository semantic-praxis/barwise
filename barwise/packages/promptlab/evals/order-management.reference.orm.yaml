orm_version: "1.1"
model:
  name: order-management
  object_types:
    - id: c715f385-3e6e-4f7e-93d2-9f1fd65b0596
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: 4bbfe690-140a-49d1-b54e-488fc9336833
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: 44dcf1fe-3202-41cb-8722-bd67352248bd
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: ef6134c6-629e-470a-83e6-ee5321b7b093
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: 3f7b1ccb-c646-4536-abda-f17166044b95
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100

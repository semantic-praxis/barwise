orm_version: "1.1"
model:
  name: order-management
  object_types:
    - id: 326aff9f-2d0b-4ef2-a1c8-e27f9a14fe2e
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: 720c7c84-9f37-4629-a16b-d3a27c402d30
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: 4073b07b-8a58-4c60-a67c-c06618ce600f
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: ff336617-a72e-488a-9fde-e4258ff1e55b
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: b9a3705b-78a2-4511-a28c-11d17c00e71d
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
    - id: 1780fb51-fd56-47b3-98a9-7c786e620d55
      name: Quantity
      kind: value
      definition: The number of units of a product specified on an order line.
      data_type:
        name: integer
  fact_types:
    - id: 1f099b38-1279-4350-a11a-51f96ce7c32f
      name: Customer places Order
      roles:
        - id: 5f97ade0-7436-431f-b7c7-e2d87ff22327
          player: 326aff9f-2d0b-4ef2-a1c8-e27f9a14fe2e
          role_name: places
        - id: 8d8d1ad8-1cba-4f3e-be31-120f2769814d
          player: 720c7c84-9f37-4629-a16b-d3a27c402d30
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - 8d8d1ad8-1cba-4f3e-be31-120f2769814d
        - type: mandatory
          role: 8d8d1ad8-1cba-4f3e-be31-120f2769814d
    - id: 326983cd-805e-4151-81c5-d69078cc74da
      name: Order contains Product with Quantity
      roles:
        - id: 406ee647-20a1-43e6-bdaa-ddda00243c9a
          player: 720c7c84-9f37-4629-a16b-d3a27c402d30
          role_name: contains
        - id: a382a42d-8a21-42d2-950e-13a7f40003f1

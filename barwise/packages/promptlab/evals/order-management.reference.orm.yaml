        - id: 9fe9e086-cf57-47d1-8d2e-8ca579f244a2
          player: 1780fb51-fd56-47b3-98a9-7c786e620d55
          role_name: is the quantity for
      readings:
        - "{0} contains {1} with quantity {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - 406ee647-20a1-43e6-bdaa-ddda00243c9a
            - a382a42d-8a21-42d2-950e-13a7f40003f1
    - id: bb572d7f-4f09-484f-bb90-a6a9be936281

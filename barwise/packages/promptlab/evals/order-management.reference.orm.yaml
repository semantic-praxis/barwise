orm_version: "1.1"
model:
  name: order-management
  object_types:
    - id: 00000000-0000-7001-ad34-3b424950575e
      name: Customer
      kind: entity
      reference_mode: customer_id
      definition: A person or organization that places orders in the CRM system.
    - id: 00000000-0000-7002-8c53-5a61686f767d
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A confirmed request by a customer for one or more products.
    - id: 00000000-0000-7003-ab72-7980878e959c
      name: Product
      kind: entity
      reference_mode: sku
      definition: A product that can be ordered by customers.
    - id: 00000000-0000-7004-8a91-989fa6adb4bb
      name: OrderStatus
      kind: value
      definition: The current status of an order in the fulfillment pipeline.
      value_constraint:
        values:
          - pending
          - confirmed
          - shipped
          - delivered
    - id: 00000000-0000-7005-a9b0-b7bec5ccd3da
      name: Name
      kind: value
      definition: A customer's display name.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-7006-88cf-d6dde4ebf2f9
      name: Quantity
      kind: value
      definition: The number of units of a product specified on an order line.
      data_type:
        name: integer
  fact_types:
    - id: 00000000-0000-7007-a7ee-f5fc030a1118
      name: Customer places Order
      roles:
        - id: 00000000-0000-7008-860d-141b22293037
          player: 00000000-0000-7001-ad34-3b424950575e
          role_name: places
        - id: 00000000-0000-7009-a52c-333a41484f56
          player: 00000000-0000-7002-8c53-5a61686f767d
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - 00000000-0000-7009-a52c-333a41484f56
        - type: mandatory
          role: 00000000-0000-7009-a52c-333a41484f56
    - id: 00000000-0000-700a-844b-525960676e75
      name: Order contains Product with Quantity
      roles:
        - id: 00000000-0000-700b-a36a-71787f868d94
          player: 00000000-0000-7002-8c53-5a61686f767d
          role_name: contains
        - id: 00000000-0000-700c-8289-90979ea5acb3
          player: 00000000-0000-7003-ab72-7980878e959c
          role_name: is contained in
        - id: 00000000-0000-700d-a1a8-afb6bdc4cbd2
          player: 00000000-0000-7006-88cf-d6dde4ebf2f9
          role_name: is the quantity for
      readings:
        - "{0} contains {1} with quantity {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - 00000000-0000-700b-a36a-71787f868d94
            - 00000000-0000-700c-8289-90979ea5acb3
    - id: 00000000-0000-700e-80c7-ced5dce3eaf1
      name: Order has OrderStatus
      roles:
        - id: 00000000-0000-700f-9fe6-edf4fb020910
          player: 00000000-0000-7002-8c53-5a61686f767d
          role_name: has
        - id: 00000000-0000-7010-be05-0c131a21282f
          player: 00000000-0000-7004-8a91-989fa6adb4bb
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - 00000000-0000-700f-9fe6-edf4fb020910
        - type: mandatory
          role: 00000000-0000-700f-9fe6-edf4fb020910
    - id: 00000000-0000-7011-9d24-2b323940474e
      name: Customer has Name
      roles:
        - id: 00000000-0000-7012-bc43-4a51585f666d
          player: 00000000-0000-7001-ad34-3b424950575e

orm_version: "3.0"
model:
  name: freight-corrections
  object_types:
    - id: Shipment
      name: Shipment
      kind: entity
      reference_mode: shipment_number
      definition: A consignment of products moving through the warehouse network.
      aliases:
        - Consignment
    - id: Product
      name: Product
      kind: entity
      reference_mode: sku
      definition: A stocked item that shipments carry.
    - id: Warehouse
      name: Warehouse
      kind: entity
      reference_mode: warehouse_code
      definition: A physical storage location shipments sit in.
    - id: Quantity
      name: Quantity
      kind: value
      definition: How many units of a product a shipment contains.
      data_type:
        name: integer
  fact_types:
    - id: Shipment_contains_Product_in_Quantity
      name: Shipment contains Product in Quantity
      roles:
        - id: Shipment_contains_Product_in_Quantity.contains
          player: Shipment
          role_name: contains
        - id: Shipment_contains_Product_in_Quantity.is_contained_in
          player: Product
          role_name: is contained in
        - id: Shipment_contains_Product_in_Quantity.is_the_quantity_for
          player: Quantity
          role_name: is the quantity for
      readings:
        - "{0} contains {1} in quantity {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Shipment_contains_Product_in_Quantity.contains
            - Shipment_contains_Product_in_Quantity.is_contained_in
          id: 00000000-0000-7001-ad34-3b424950575e
    - id: Shipment_is_stored_in_Warehouse
      name: Shipment is stored in Warehouse
      roles:
        - id: Shipment_is_stored_in_Warehouse.is_stored_in
          player: Shipment
          role_name: is stored in
        - id: Shipment_is_stored_in_Warehouse.stores
          player: Warehouse
          role_name: stores
      readings:
        - "{0} is stored in {1}"
        - "{1} stores {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Shipment_is_stored_in_Warehouse.is_stored_in
            - Shipment_is_stored_in_Warehouse.stores
          id: 00000000-0000-7002-8c53-5a61686f767d
        - type: frequency
          role: Shipment_is_stored_in_Warehouse.is_stored_in
          min: 1
          max: 2
          id: Each_Shipment_that_is_stored_in_some_Warehouse_is_stored_in_at_least_1_and_at_most_2_instances_of_Warehouse
  populations:
    - id: Shipment_contains_Product_in_Quantity.population
      fact_type: Shipment_contains_Product_in_Quantity
      instances:
        - id: Shipment_contains_Product_in_Quantity.population.1
          role_values:
            Shipment_contains_Product_in_Quantity.contains: S-100
            Shipment_contains_Product_in_Quantity.is_contained_in: P-77
            Shipment_contains_Product_in_Quantity.is_the_quantity_for: "5"
      description: Worked example given in the session.
      sample: true

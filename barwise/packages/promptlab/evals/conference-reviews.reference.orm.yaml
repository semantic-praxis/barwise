orm_version: "4.0"
model:
  name: conference-reviews
  object_types:
    - id: Reviewer
      name: Reviewer
      kind: entity
      reference_mode: reviewer_id
      definition: A person who reviews papers submitted to the conference.
    - id: Paper
      name: Paper
      kind: entity
      reference_mode: paper_number
      definition: A submission to the conference.
    - id: Review
      name: Review
      kind: entity
      reference_mode: review_id
      definition: The act of a particular reviewer reviewing a particular paper, tracked as its own concept.
    - id: ReviewScore
      name: ReviewScore
      kind: value
      definition: The overall score a review assigns.
      data_type:
        name: integer
  fact_types:
    - id: Reviewer_reviews_Paper
      name: Reviewer reviews Paper
      roles:
        - id: Reviewer_reviews_Paper.reviews
          player: Reviewer
          role_name: reviews
        - id: Reviewer_reviews_Paper.is_reviewed_by
          player: Paper
          role_name: is reviewed by
      readings:
        - "{0} reviews {1}"
        - "{1} is reviewed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Reviewer_reviews_Paper.reviews
            - Reviewer_reviews_Paper.is_reviewed_by
          id: Each_combination_of_Reviewer_and_Paper_is_unique_in_Reviewer_reviews_Paper
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"reviews",{"name":"Reviewer reviews Paper","readings":["{0} reviews {1}","{1} is reviewed by {0}"],"players":["Reviewer","Paper"]}],[1,"is reviewed by",{"name":"Reviewer reviews Paper","readings":["{0} reviews {1}","{1} is reviewed by {0}"],"players":["Reviewer","Paper"]}]],"fact_type":{"name":"Reviewer reviews Paper","readings":["{0} reviews {1}","{1} is reviewed by {0}"],"players":["Reviewer","Paper"]}}'
    - id: Review_has_ReviewScore
      name: Review has ReviewScore
      roles:
        - id: Review_has_ReviewScore.has
          player: Review
          role_name: has
        - id: Review_has_ReviewScore.is_of
          player: ReviewScore
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Review_has_ReviewScore.has
          id: Each_Review_has_at_most_one_ReviewScore
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}]],"fact_type":{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}}'
        - type: mandatory
          role: Review_has_ReviewScore.has
          id: Each_Review_has_at_least_one_ReviewScore
          minted_from: '{"type":"mandatory","role":[0,"has",{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}],"fact_type":{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}}'
        - type: value_constraint
          values:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
          role: Review_has_ReviewScore.is_of
          id: The_possible_values_of_ReviewScore_are%3A_%7B'1',_'2',_'3',_'4',_'5'%7D
          minted_from: '{"type":"value_constraint","values":["1","2","3","4","5"],"role":[1,"is of",{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}],"fact_type":{"name":"Review has ReviewScore","readings":["{0} has {1}","{1} is of {0}"],"players":["Review","ReviewScore"]}}'
  objectified_fact_types:
    - id: Review_is_where_Reviewer_reviews_Paper
      minted_from: '{"fact_type":{"name":"Reviewer reviews Paper","readings":["{0} reviews {1}","{1} is reviewed by {0}"],"players":["Reviewer","Paper"]},"object_type":"Review"}'
      fact_type: Reviewer_reviews_Paper
      object_type: Review

orm_version: "4.0"
model:
  name: employee-hierarchy
  object_types:
    - id: Person
      name: Person
      kind: entity
      reference_mode: person_id
      definition: Any individual tracked by the HR system.
    - id: Employee
      name: Employee
      kind: entity
      reference_mode: employee_id
      definition: A person who works for the company.
    - id: Manager
      name: Manager
      kind: entity
      reference_mode: manager_id
      definition: An employee who manages other employees.
    - id: Department
      name: Department
      kind: entity
      reference_mode: department_code
      definition: An organizational unit within the company.
    - id: DepartmentName
      name: DepartmentName
      kind: value
      definition: The name of a department.
  fact_types:
    - id: Employee_works_in_Department
      name: Employee works in Department
      roles:
        - id: Employee_works_in_Department.works_in
          player: Employee
          role_name: works in
        - id: Employee_works_in_Department.has
          player: Department
          role_name: has
      readings:
        - "{0} works in {1}"
        - "{1} has {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Employee_works_in_Department.works_in
          id: Each_Employee_works_in_at_most_one_Department
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"works in",{"name":"Employee works in Department","readings":["{0} works in {1}","{1} has {0}"],"players":["Employee","Department"]}]],"fact_type":{"name":"Employee works in Department","readings":["{0} works in {1}","{1} has {0}"],"players":["Employee","Department"]}}'
        - type: mandatory
          role: Employee_works_in_Department.works_in
          id: Each_Employee_works_in_at_least_one_Department
          minted_from: '{"type":"mandatory","role":[0,"works in",{"name":"Employee works in Department","readings":["{0} works in {1}","{1} has {0}"],"players":["Employee","Department"]}],"fact_type":{"name":"Employee works in Department","readings":["{0} works in {1}","{1} has {0}"],"players":["Employee","Department"]}}'
    - id: Manager_manages_Department
      name: Manager manages Department
      roles:
        - id: Manager_manages_Department.manages
          player: Manager
          role_name: manages
        - id: Manager_manages_Department.is_managed_by
          player: Department
          role_name: is managed by
      readings:
        - "{0} manages {1}"
        - "{1} is managed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Manager_manages_Department.is_managed_by
          id: Each_Department_is_managed_by_at_most_one_Manager
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is managed by",{"name":"Manager manages Department","readings":["{0} manages {1}","{1} is managed by {0}"],"players":["Manager","Department"]}]],"fact_type":{"name":"Manager manages Department","readings":["{0} manages {1}","{1} is managed by {0}"],"players":["Manager","Department"]}}'
    - id: Department_has_DepartmentName
      name: Department has DepartmentName
      roles:
        - id: Department_has_DepartmentName.has
          player: Department
          role_name: has
        - id: Department_has_DepartmentName.is_of
          player: DepartmentName
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Department_has_DepartmentName.has
          id: Each_Department_has_at_most_one_DepartmentName
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Department has DepartmentName","readings":["{0} has {1}","{1} is of {0}"],"players":["Department","DepartmentName"]}]],"fact_type":{"name":"Department has DepartmentName","readings":["{0} has {1}","{1} is of {0}"],"players":["Department","DepartmentName"]}}'
  subtype_facts:
    - id: Employee_is_a_subtype_of_Person
      minted_from: '{"subtype":"Employee","supertype":"Person","defining_rule":null}'
      subtype: Employee
      supertype: Person
      provides_identification: false
    - id: Manager_is_a_subtype_of_Employee
      minted_from: '{"subtype":"Manager","supertype":"Employee","defining_rule":null}'
      subtype: Manager
      supertype: Employee

id: university-enrollment
transcript: university-enrollment.transcript.md
reference: university-enrollment.reference.orm.yaml
# The Registrar says bare "offering" nine times and "course offering"
# three, including the identification line ("Offerings get an offering
# ID"), so both words are the domain's own and the prompt's pick-the-
# most-common-term rule argues for the shorter one. Without this
# licence the rubric charged 0.85 for that choice while a real
# structural divergence (how grades attach) stayed invisible
# (docs/specs/eval-name-licensing.spec.md, suite 2.1.0).
vocabulary:
  - [CourseOffering, Offering]
  # The Registrar says bare "grade" three times and "letter grade" once
  # ("The grade is one of A, B, C, D, or F"), so both are the domain's
  # words for the one concept. Without this licence the 2.4.0 grade
  # check failed all five haiku45-2 runs of the 2026-08-27 sweep as "no
  # fact type matching" when every one of them carried the correct
  # ternary with the correct spanning uniqueness -- only the player was
  # named Grade, not LetterGrade (suite 2.5.0).
  - [LetterGrade, Grade]
checks:
  - kind: must_validate
  - kind: requires_element
    element:
      entity: CourseOffering
  - kind: requires_element
    element:
      factTypeBetween: [Student, CourseOffering]
  - kind: requires_element
    element:
      factTypeBetween: [CourseOffering, Semester]
  - kind: forbids_population
    factType: CourseOffering is of Course
    constraint: internal_uniqueness
    hint: Each offering is of exactly one course.
  - kind: forbids_population
    factType: Instructor teaches CourseOffering
    constraint: internal_uniqueness
    hint: Each offering is taught by exactly one instructor.
  - kind: forbids_population
    factType: CourseOffering is in Semester
    constraint: internal_uniqueness
    hint: Each offering belongs to exactly one semester.
  - kind: forbids_population
    factType: Instructor teaches CourseOffering
    constraint: mandatory
    hint: Each offering is taught by some instructor.
  - kind: forbids_population
    factType: Student receives LetterGrade for CourseOffering
    constraint: internal_uniqueness
    hint: A student gets at most one grade per offering - as the ternary or
      as an objectified enrollment carrying the grade; both shapes pass.

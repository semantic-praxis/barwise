id: clinic-appointments
transcript: clinic-appointments.transcript.md
reference: clinic-appointments.reference.orm.yaml
checks:
  - kind: must_validate
  - kind: requires_element
    element:
      entity: Appointment
  - kind: requires_element
    element:
      factTypeBetween: [Patient, Appointment]
  - kind: requires_element
    element:
      factTypeBetween: [Appointment, Doctor]
  - kind: forbids_population
    factType: Patient books Appointment
    constraint: internal_uniqueness
    hint: Each appointment is booked by at most one patient.
  - kind: forbids_population
    factType: Appointment has AppointmentStatus
    constraint: mandatory
    hint: Every appointment must have a status.
  - kind: forbids_population
    factType: Appointment is with Doctor
    constraint: internal_uniqueness
    hint: Each appointment is with at most one doctor.
  - kind: forbids_population
    factType: Doctor has Specialty
    constraint: mandatory
    hint: Every doctor has a specialty.
  - kind: forbids_population
    factType: Appointment has FollowUpNote
    constraint: internal_uniqueness
    hint: At most one follow-up note per appointment.
  - kind: forbids_population
    factType: Patient has primary Doctor
    constraint: mandatory
    hint: Every patient has a primary doctor.

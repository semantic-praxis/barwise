# Tests an identifier chosen against a tempting decoy. The transcript
# offers tax ID as an identifier and then withdraws it ("we have
# duplicates"), settling on vendor number; and Raj over-claims "exactly
# one completed risk review" before correcting himself to "a vendor
# accumulates reviews; at most one is current".
#
# Reference generated from the best 2026-08-27 haiku45-2 dev payload
# (suite 2.5.0; barwise-845). Two settled rules the payload does NOT
# carry, so no check can test them yet: the review-side mandatory on
# "RiskReview is for Vendor" ("one review, one vendor"), and any
# current-review construct ("at most one is current") -- both are
# prompt headroom, not rubric gaps to paper over.
id: vendor-onboarding
transcript: vendor-onboarding.transcript.md
reference: vendor-onboarding.reference.orm.yaml
ambiguityBudget: 10
vocabulary:
  # Mei names the concept "phone number" ("Name, email, phone
  # number."), which the reference shortened to ContactPhone and the
  # recorded haiku payloads render in full. Without the licence the
  # entity-fold tier (suite 2.6.0, barwise-890) cannot evidence the
  # phone attribute against the Contact entity, and the Meridian check
  # fails a shape that carries the exact rule.
  - [ContactPhone, ContactPhoneNumber]
checks:
  - kind: must_validate
  - kind: requires_element
    element:
      entity: Vendor
  - kind: requires_element
    element:
      entity: VendorNumber
    hint: Vendor number is the identifier the room settled on, not tax ID.
  - kind: requires_element
    element:
      factTypeBetween: [Vendor, VendorNumber]
    hint: An entity with a reference mode needs its identifier fact type.
  - kind: requires_element
    element:
      factTypeBetween: [Vendor, RiskReview]
    hint: A vendor accumulates reviews over time; at most one is current.
  - kind: requires_ambiguity
    # The stem, not the verb: sonnet reported the parked item as "the
    # suspension question" and failed lexically -- "suspension" does not
    # contain the substring "suspend" (suspen-d vs suspen-s). "suspen"
    # matches suspend, suspended and suspension alike (barwise-892).
    matches: [suspen]
    hint: The room parked what happens to in-flight purchase orders when a vendor is suspended.
  - kind: forbids_population
    factType: Vendor has VendorNumber
    constraint: internal_uniqueness
    hint: Vendor number is the identifier - unique, and settled over the
      tax-ID decoy the room withdrew.
  - kind: forbids_population
    factType: Vendor has VendorStatus
    constraint: mandatory
    hint: A vendor is never in no status - it defaults to draft the moment
      the record is created.
  - kind: forbids_population
    factType: Vendor operates in Region with Contact
    constraint: internal_uniqueness
    hint: The Meridian rule - at most one primary contact per vendor per
      region; the system rejects the second.
  - kind: forbids_population
    factType: PurchaseOrder is raised against Vendor
    constraint: internal_uniqueness
    hint: A PO is raised against exactly one vendor - no PO split across
      suppliers.
  - kind: forbids_population
    factType: PurchaseOrder is raised against Vendor
    constraint: mandatory
    hint: No orphan POs - the form will not let you create one without a
      vendor.

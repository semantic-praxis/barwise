orm_version: "1.1"
model:
  name: incident-response
  object_types:
    - id: 00000000-0000-7001-ad34-3b424950575e
      name: Incident
      kind: entity
      reference_mode: incident_number
      definition: A reported event where some aspect of the system is not working correctly. Created when something breaks and is discovered via alert, customer report, or manual detection. Tracked through lifecycle states from triage through resolution.
    - id: 00000000-0000-7002-8c53-5a61686f767d
      name: IncidentNumber
      kind: value
      definition: The unique identifier for an incident, formatted as INC- followed by a sequence number.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7003-ab72-7980878e959c
      name: Severity
      kind: value
      definition: Technical classification of impact scope, ranging from SEV1 (complete service outage affecting all users) to SEV4 (degraded functionality affecting limited scope).
      value_constraint:
        values:
          - SEV1
          - SEV2
          - SEV3
          - SEV4
      data_type:
        name: text
        length: 10
    - id: 00000000-0000-7004-8a91-989fa6adb4bb
      name: Priority
      kind: value
      definition: Business urgency classification based on customer impact, customer expectations, and SLA obligations. Independent from severity (technical impact).
      value_constraint:
        values:
          - P1
          - P2
          - P3
          - P4
      data_type:
        name: text
        length: 10
    - id: 00000000-0000-7005-a9b0-b7bec5ccd3da
      name: IncidentState
      kind: value
      definition: "The lifecycle state of an incident: triage (initial assessment), declared (confirmed and assigned), mitigated (fix applied), resolved (fix validated), closed (incident completed)."
      value_constraint:
        values:
          - triage
          - declared
          - mitigated
          - resolved
          - closed
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7006-88cf-d6dde4ebf2f9
      name: Alert
      kind: entity
      reference_mode: alert_id
      definition: A monitoring system notification that indicates a potential issue. Can be automatically generated by the monitoring platform or manually raised by an engineer. Every incident must be linked to at least one alert or customer ticket.
    - id: 00000000-0000-7007-a7ee-f5fc030a1118
      name: AlertId
      kind: value
      definition: The unique identifier for an alert, assigned by the monitoring platform.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7008-860d-141b22293037
      name: Ticket
      kind: entity
      reference_mode: ticket_number
      definition: A support system record created when a customer reports an issue. Every incident must be linked to at least one alert or customer ticket.
    - id: 00000000-0000-7009-a52c-333a41484f56
      name: TicketNumber
      kind: value
      definition: The unique identifier for a support ticket, from the support system.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-700a-844b-525960676e75
      name: Service
      kind: entity
      reference_mode: service_name
      definition: A backend system or component owned by a team. An incident affects one or more services. Identified by a unique name enforced in the service catalogue.
    - id: 00000000-0000-700b-a36a-71787f868d94
      name: ServiceName
      kind: value
      definition: The unique name identifier for a service.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-700c-8289-90979ea5acb3
      name: Team
      kind: entity
      reference_mode: team_name
      definition: An organizational unit that owns one or more services. Teams are standing assignments responsible for systems.
    - id: 00000000-0000-700d-a1a8-afb6bdc4cbd2
      name: TeamName
      kind: value
      definition: The unique name identifier for a team.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-700e-80c7-ced5dce3eaf1
      name: Person
      kind: entity
      reference_mode: person_id
      definition: An individual who can serve as an incident commander. The incident commander is a person acting in a role for the duration of an incident.
    - id: 00000000-0000-700f-9fe6-edf4fb020910
      name: PersonId
      kind: value
      definition: A unique identifier for a person.
      data_type:
        name: uuid

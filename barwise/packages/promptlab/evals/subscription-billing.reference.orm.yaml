orm_version: "1.1"
model:
  name: subscription-billing
  object_types:
    - id: 00000000-0000-7001-ad34-3b424950575e
      name: Account
      kind: entity
      reference_mode: account_number
      definition: A customer account in the system, identified by an account number. Every account has a unique 6-digit sequential identifier that is never reused; if an account closes and the same company returns, they receive a new account number.
    - id: 00000000-0000-7002-8c53-5a61686f767d
      name: AccountNumber
      kind: value
      definition: The unique 6-digit sequential identifier for an account.
      data_type:
        name: text
        length: 10
    - id: 00000000-0000-7003-ab72-7980878e959c
      name: Subscription
      kind: entity
      reference_mode: subscription_id
      definition: The agreement that an account pays a specified amount on a specified billing cycle for a specified product. Identified by a subscription ID prefixed with SUB.
    - id: 00000000-0000-7004-8a91-989fa6adb4bb
      name: SubscriptionID
      kind: value
      definition: The unique identifier for a subscription, prefixed with SUB.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7005-a9b0-b7bec5ccd3da
      name: Product
      kind: entity
      reference_mode: product_code
      definition: "A product offered by the company. Currently three products exist: CORE, ANALYTICS, and CONNECT."
    - id: 00000000-0000-7006-88cf-d6dde4ebf2f9
      name: ProductCode
      kind: value
      definition: The unique identifier for a product. Currently restricted to CORE, ANALYTICS, or CONNECT.
      value_constraint:
        values:
          - CORE
          - ANALYTICS
          - CONNECT
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7007-a7ee-f5fc030a1118
      name: PricePlan
      kind: entity
      reference_mode: plan_code
      definition: The billing artefact that specifies the price and billing frequency. Identified by plan code (e.g., CORE-MO-49, CORE-AN-490). Each price plan entitles exactly one feature bundle.
      aliases:
        - billing plan
    - id: 00000000-0000-7008-860d-141b22293037
      name: PlanCode
      kind: value
      definition: The unique identifier for a price plan, such as CORE-MO-49 or CORE-AN-490.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7009-a52c-333a41484f56
      name: FeatureBundle
      kind: entity
      reference_mode: bundle_name
      definition: The feature set or tier that a customer receives. Identified by name. Examples include Starter, Professional, and Enterprise. Each bundle specifies how many seats, whether API access is included, whether SSO is included, etc.
    - id: 00000000-0000-700a-844b-525960676e75
      name: BundleName
      kind: value
      definition: The unique name identifier for a feature bundle.
      data_type:
        name: text
        length: 100
    - id: 00000000-0000-700b-a36a-71787f868d94
      name: PlanChange
      kind: entity
      reference_mode: change_id
      definition: A record of a subscription plan change, capturing the subscription, the new price plan, the effective date, the date it was requested, and who requested it. Allows subscription plan history to be tracked.
    - id: 00000000-0000-700c-8289-90979ea5acb3
      name: ChangeID
      kind: value
      definition: The unique identifier for a plan change.
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-700d-a1a8-afb6bdc4cbd2
      name: StartDate
      kind: value
      definition: The date on which a subscription begins. This field is mandatory for every subscription.
      data_type:
        name: date
    - id: 00000000-0000-700e-80c7-ced5dce3eaf1
      name: EndDate
      kind: value
      definition: The date on which a subscription ends. This field is optional; open-ended subscriptions have no end date.
      data_type:
        name: date
    - id: 00000000-0000-700f-9fe6-edf4fb020910
      name: BillingPeriod
      kind: value
      definition: The frequency at which a subscription is billed. Must be exactly monthly or annual.
      value_constraint:
        values:
          - monthly
          - annual
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7010-be05-0c131a21282f
      name: SubscriptionStatus
      kind: value
      definition: "The current status of a subscription. Must be exactly one of: trialing, active, past due, or cancelled."
      value_constraint:
        values:
          - trialing
          - active
          - past due
          - cancelled
      data_type:
        name: text
        length: 20
    - id: 00000000-0000-7011-9d24-2b323940474e
      name: EffectiveDate
      kind: value
      definition: The date on which a plan change becomes effective. May differ from the request date.
      data_type:
        name: date
    - id: 00000000-0000-7012-bc43-4a51585f666d
      name: Requester
      kind: value
      definition: The person or system that requested a plan change.
      data_type:
        name: text
        length: 200

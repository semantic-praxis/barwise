        - id: b26796c9-7bd9-4dd9-bca0-9d4ef074e4a2
          player: ced286b6-3535-4ab8-8536-061de162bf3b
          role_name: is booked by
      readings:
        - "{0} books {1}"
        - "{1} is booked by {0}"
      constraints:

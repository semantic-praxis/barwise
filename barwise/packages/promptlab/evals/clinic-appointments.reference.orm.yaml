orm_version: "3.0"
model:
  name: clinic-appointments
  object_types:
    - id: Patient
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: Doctor
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: Appointment
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: ExamRoom
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: Specialty
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: AppointmentDate
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: TimeSlot
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: VisitReason
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: AppointmentStatus
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: FollowUpNote
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:
    - id: Patient_books_Appointment
      name: Patient books Appointment
      roles:
        - id: Patient_books_Appointment.books
          player: Patient
          role_name: books
        - id: Patient_books_Appointment.is_booked_by
          player: Appointment
          role_name: is booked by
      readings:
        - "{0} books {1}"
        - "{1} is booked by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Patient_books_Appointment.is_booked_by
          id: 00000000-0000-7002-8c53-5a61686f767d
        - type: mandatory
          role: Patient_books_Appointment.is_booked_by
          id: Each_Appointment_is_booked_by_at_least_one_Patient
    - id: Appointment_is_with_Doctor
      name: Appointment is with Doctor
      roles:
        - id: Appointment_is_with_Doctor.is_with
          player: Appointment
          role_name: is with
        - id: Appointment_is_with_Doctor.sees
          player: Doctor
          role_name: sees
      readings:
        - "{0} is with {1}"
        - "{1} sees {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Appointment_is_with_Doctor.is_with
          id: 00000000-0000-7003-ab72-7980878e959c
        - type: mandatory
          role: Appointment_is_with_Doctor.is_with
          id: Each_Appointment_is_with_at_least_one_Doctor
    - id: Doctor_has_Specialty
      name: Doctor has Specialty
      roles:
        - id: Doctor_has_Specialty.has
          player: Doctor
          role_name: has
        - id: Doctor_has_Specialty.is_of
          player: Specialty
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:

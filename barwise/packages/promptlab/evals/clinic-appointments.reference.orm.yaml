          roles:
            - Doctor_has_Specialty.has
          id: 00000000-0000-7004-8a91-989fa6adb4bb
        - type: mandatory
          role: Doctor_has_Specialty.has
          id: Each_Doctor_has_at_least_one_Specialty
    - id: Appointment_is_on_AppointmentDate
      name: Appointment is on AppointmentDate
      roles:

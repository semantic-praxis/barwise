orm_version: "1.1"
model:
  name: clinic-appointments
  object_types:
    - id: ed045497-08fe-41f6-aaa0-8ba5d881b23d
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: beb88ed1-e0f2-41c2-8c09-b9c473fdde9e
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: ced286b6-3535-4ab8-8536-061de162bf3b
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 1f397ade-2b07-4c9a-91be-fa4a4755ce94
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: dc130ef8-106a-4cbc-8d93-81d7a645e10f
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: cc2049be-bb67-4a9e-93dc-2212b09602a0
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 2830fdad-c9b0-4f4e-bb1a-ec72bacc2d86
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: 470754cd-360a-4881-8196-aa84218b0226
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: 90f562e4-fc7f-47d9-9f81-9dd9a05b616f
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: 9990ef65-e351-429e-8b84-a09c3b8ef1e4
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

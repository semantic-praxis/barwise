orm_version: "1.1"
model:
  name: clinic-appointments
  object_types:
    - id: f1c22056-996e-4b4c-b63e-978501cc296e
      name: Patient
      kind: entity
      reference_mode: medical_record_number
      definition: A person who receives medical care at the clinic, identified by a medical record number.
    - id: f3fa99de-1d32-4492-991f-ed64953799e6
      name: Doctor
      kind: entity
      reference_mode: provider_id
      definition: A medical practitioner at the clinic, identified by a state-issued provider ID.
    - id: 567c8c42-1b05-4276-bccb-65ada178982c
      name: Appointment
      kind: entity
      reference_mode: confirmation_number
      definition: A scheduled visit between a patient and a doctor, identified by a confirmation number.
    - id: 10b6c525-b636-4b3a-9493-6cd8621a8178
      name: ExamRoom
      kind: entity
      reference_mode: room_number
      definition: A physical examination room at the clinic, identified by a room number.
    - id: 3a648d2d-b28b-45aa-a387-ffa3b291fef3
      name: Specialty
      kind: value
      definition: The medical specialty of a doctor.
      value_constraint:
        values:
          - cardiology
          - dermatology
          - family medicine
          - orthopedics
          - pediatrics
    - id: 01368f19-ed8a-4c72-875c-81f7ecf04e60
      name: AppointmentDate
      kind: value
      definition: The calendar date of an appointment.
    - id: 1ff9934e-68b6-409a-b417-1daa3feb9d4d
      name: TimeSlot
      kind: value
      definition: A half-hour time slot during clinic hours.
      value_constraint:
        values:
          - 8:00
          - 8:30
          - 9:00
          - 9:30
          - 10:00
          - 10:30
          - 11:00
          - 11:30
          - 13:00
          - 13:30
          - 14:00
          - 14:30
          - 15:00
          - 15:30
          - 16:00
          - 16:30
    - id: d67aacb4-505e-4f30-9046-aa403ec67f09
      name: VisitReason
      kind: value
      definition: Free-text reason for the appointment as described by the patient.
    - id: 95618ad8-cbab-4544-b7fe-dbd5ef930b17
      name: AppointmentStatus
      kind: value
      definition: The current status of an appointment in its lifecycle.
      value_constraint:
        values:
          - scheduled
          - checked-in
          - in-progress
          - completed
          - cancelled
          - no-show
    - id: 649e8e6f-6918-4d17-a6cc-fbf51fa202ae
      name: FollowUpNote
      kind: value
      definition: Free-text follow-up note attached to a completed appointment.
  fact_types:

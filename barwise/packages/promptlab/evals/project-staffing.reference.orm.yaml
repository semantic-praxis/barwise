orm_version: "4.0"
model:
  name: project-staffing
  object_types:
    - id: Employee
      name: Employee
      kind: entity
      reference_mode: employee_number
      definition: A person employed by the consultancy and staffed onto projects.
    - id: Project
      name: Project
      kind: entity
      reference_mode: project_code
      definition: A client engagement that employees are assigned to.
    - id: ProjectName
      name: ProjectName
      kind: value
      definition: The name of a project.
      data_type:
        name: text
        length: 100
  fact_types:
    - id: Employee_mentors_Employee
      name: Employee mentors Employee
      roles:
        - id: Employee_mentors_Employee.mentors
          player: Employee
          role_name: mentors
        - id: Employee_mentors_Employee.is_mentored_by
          player: Employee
          role_name: is mentored by
      readings:
        - "{0} mentors {1}"
        - "{1} is mentored by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Employee_mentors_Employee.is_mentored_by
          id: Each_Employee_is_mentored_by_at_most_one_Employee
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is mentored by",{"name":"Employee mentors Employee","readings":["{0} mentors {1}","{1} is mentored by {0}"],"players":["Employee","Employee"]}]],"fact_type":{"name":"Employee mentors Employee","readings":["{0} mentors {1}","{1} is mentored by {0}"],"players":["Employee","Employee"]}}'
        - type: ring
          role_1: Employee_mentors_Employee.mentors
          role_2: Employee_mentors_Employee.is_mentored_by
          ring_type: acyclic
          id: No_Employee_mentors_that_same_Employee,_directly_or_through_a_chain_of_such_relationships
          minted_from: '{"type":"ring","role_1":[0,"mentors",{"name":"Employee mentors Employee","readings":["{0} mentors {1}","{1} is mentored by {0}"],"players":["Employee","Employee"]}],"role_2":[1,"is mentored by",{"name":"Employee mentors Employee","readings":["{0} mentors {1}","{1} is mentored by {0}"],"players":["Employee","Employee"]}],"ring_type":"acyclic","fact_type":{"name":"Employee mentors Employee","readings":["{0} mentors {1}","{1} is mentored by {0}"],"players":["Employee","Employee"]}}'
    - id: Employee_is_assigned_to_Project
      name: Employee is assigned to Project
      roles:
        - id: Employee_is_assigned_to_Project.is_assigned_to
          player: Employee
          role_name: is assigned to
        - id: Employee_is_assigned_to_Project.has_assigned
          player: Project
          role_name: has assigned
      readings:
        - "{0} is assigned to {1}"
        - "{1} has assigned {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Employee_is_assigned_to_Project.is_assigned_to
            - Employee_is_assigned_to_Project.has_assigned
          id: Each_combination_of_Employee_and_Project_is_unique_in_Employee_is_assigned_to_Project
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"is assigned to",{"name":"Employee is assigned to Project","readings":["{0} is assigned to {1}","{1} has assigned {0}"],"players":["Employee","Project"]}],[1,"has assigned",{"name":"Employee is assigned to Project","readings":["{0} is assigned to {1}","{1} has assigned {0}"],"players":["Employee","Project"]}]],"fact_type":{"name":"Employee is assigned to Project","readings":["{0} is assigned to {1}","{1} has assigned {0}"],"players":["Employee","Project"]}}'
        - type: frequency
          role: Employee_is_assigned_to_Project.is_assigned_to
          min: 1
          max: 3
          id: Each_Employee_that_is_assigned_to_some_Project_is_assigned_to_at_least_1_and_at_most_3_instances_of_Project
          minted_from: '{"type":"frequency","role":[0,"is assigned to",{"name":"Employee is assigned to Project","readings":["{0} is assigned to {1}","{1} has assigned {0}"],"players":["Employee","Project"]}],"min":1,"max":3,"fact_type":{"name":"Employee is assigned to Project","readings":["{0} is assigned to {1}","{1} has assigned {0}"],"players":["Employee","Project"]}}'
    - id: Project_has_ProjectName
      name: Project has ProjectName
      roles:
        - id: Project_has_ProjectName.has
          player: Project
          role_name: has
        - id: Project_has_ProjectName.is_of
          player: ProjectName
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Project_has_ProjectName.has
          id: Each_Project_has_at_most_one_ProjectName
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Project has ProjectName","readings":["{0} has {1}","{1} is of {0}"],"players":["Project","ProjectName"]}]],"fact_type":{"name":"Project has ProjectName","readings":["{0} has {1}","{1} is of {0}"],"players":["Project","ProjectName"]}}'

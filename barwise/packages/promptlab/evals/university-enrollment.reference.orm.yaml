orm_version: "3.0"
model:
  name: university-enrollment
  object_types:
    - id: Student
      name: Student
      kind: entity
      reference_mode: student_number
      definition: A person enrolled at the university, identified by a student number assigned at admission.
    - id: Course
      name: Course
      kind: entity
      reference_mode: course_code
      definition: A catalog entry representing an academic course, identified by a unique course code.
    - id: CourseOffering
      name: CourseOffering
      kind: entity
      reference_mode: offering_id
      definition: A specific instance of a course offered in a particular semester.
    - id: Instructor
      name: Instructor
      kind: entity
      reference_mode: employee_id
      definition: A faculty member who teaches course offerings, identified by employee ID.
    - id: Semester
      name: Semester
      kind: entity
      reference_mode: term_code
      definition: An academic term during which course offerings take place, identified by a term code.
    - id: Title
      name: Title
      kind: value
      definition: The free-text name of a course.
    - id: CreditValue
      name: CreditValue
      kind: value
      definition: The number of credits a course is worth, expressed as a whole number.
    - id: MaxCapacity
      name: MaxCapacity
      kind: value
      definition: The maximum number of students that can enroll in a course offering.
    - id: StartDate
      name: StartDate
      kind: value
      definition: The date a semester begins.
    - id: EndDate
      name: EndDate
      kind: value
      definition: The date a semester ends.
    - id: LetterGrade
      name: LetterGrade
      kind: value
      definition: A grade awarded to a student upon completion of a course offering.
      value_constraint:
        values:
          - A
          - B
          - C
          - D
          - F
  fact_types:
    - id: Student_enrolls_in_CourseOffering
      name: Student enrolls in CourseOffering
      roles:
        - id: Student_enrolls_in_CourseOffering.enrolls_in
          player: Student
          role_name: enrolls in
        - id: Student_enrolls_in_CourseOffering.has_enrolled
          player: CourseOffering
          role_name: has enrolled
      readings:
        - "{0} enrolls in {1}"
        - "{1} has enrolled {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Student_enrolls_in_CourseOffering.enrolls_in
            - Student_enrolls_in_CourseOffering.has_enrolled
          id: 00000000-0000-7001-ad34-3b424950575e
    - id: CourseOffering_is_of_Course
      name: CourseOffering is of Course
      roles:
        - id: CourseOffering_is_of_Course.is_of
          player: CourseOffering
          role_name: is of
        - id: CourseOffering_is_of_Course.has_offering
          player: Course
          role_name: has offering
      readings:
        - "{0} is of {1}"
        - "{1} has offering {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - CourseOffering_is_of_Course.is_of
          id: 00000000-0000-7003-ab72-7980878e959c
        - type: mandatory
          role: CourseOffering_is_of_Course.is_of
          id: Each_CourseOffering_is_of_at_least_one_Course
    - id: CourseOffering_is_in_Semester
      name: CourseOffering is in Semester
      roles:
        - id: CourseOffering_is_in_Semester.is_in
          player: CourseOffering
          role_name: is in
        - id: CourseOffering_is_in_Semester.includes
          player: Semester
          role_name: includes
      readings:
        - "{0} is in {1}"
        - "{1} includes {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - CourseOffering_is_in_Semester.is_in
          id: 00000000-0000-7004-8a91-989fa6adb4bb
        - type: mandatory
          role: CourseOffering_is_in_Semester.is_in
          id: Each_CourseOffering_is_in_at_least_one_Semester
    - id: Instructor_teaches_CourseOffering
      name: Instructor teaches CourseOffering
      roles:
        - id: Instructor_teaches_CourseOffering.teaches
          player: Instructor
          role_name: teaches
        - id: Instructor_teaches_CourseOffering.is_taught_by
          player: CourseOffering
          role_name: is taught by
      readings:
        - "{0} teaches {1}"
        - "{1} is taught by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Instructor_teaches_CourseOffering.is_taught_by
          id: 00000000-0000-7005-a9b0-b7bec5ccd3da
        - type: mandatory
          role: Instructor_teaches_CourseOffering.is_taught_by
          id: Each_CourseOffering_is_taught_by_at_least_one_Instructor
    - id: Course_has_Title
      name: Course has Title
      roles:
        - id: Course_has_Title.has
          player: Course
          role_name: has
        - id: Course_has_Title.is_of
          player: Title
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Course_has_Title.has
          id: 00000000-0000-7006-88cf-d6dde4ebf2f9
    - id: Course_has_CreditValue
      name: Course has CreditValue
      roles:
        - id: Course_has_CreditValue.has
          player: Course
          role_name: has
        - id: Course_has_CreditValue.is_of
          player: CreditValue
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Course_has_CreditValue.has
          id: 00000000-0000-7007-a7ee-f5fc030a1118
    - id: CourseOffering_has_MaxCapacity
      name: CourseOffering has MaxCapacity
      roles:
        - id: CourseOffering_has_MaxCapacity.has
          player: CourseOffering
          role_name: has
        - id: CourseOffering_has_MaxCapacity.is_of
          player: MaxCapacity
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - CourseOffering_has_MaxCapacity.has
          id: 00000000-0000-7008-860d-141b22293037
    - id: Semester_has_StartDate
      name: Semester has StartDate
      roles:
        - id: Semester_has_StartDate.has
          player: Semester
          role_name: has
        - id: Semester_has_StartDate.is_of
          player: StartDate
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Semester_has_StartDate.has
          id: 00000000-0000-7009-a52c-333a41484f56
    - id: Semester_has_EndDate
      name: Semester has EndDate
      roles:
        - id: Semester_has_EndDate.has
          player: Semester
          role_name: has
        - id: Semester_has_EndDate.is_of
          player: EndDate
          role_name: is of
      readings:
        - "{0} has {1}"
        - "{1} is of {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Semester_has_EndDate.has
          id: 00000000-0000-700a-844b-525960676e75
    - id: Student_receives_LetterGrade_for_CourseOffering
      name: Student receives LetterGrade for CourseOffering
      roles:
        - id: Student_receives_LetterGrade_for_CourseOffering.receives
          player: Student
          role_name: receives
        - id: Student_receives_LetterGrade_for_CourseOffering.is_received_by
          player: LetterGrade
          role_name: is received by
        - id: Student_receives_LetterGrade_for_CourseOffering.grades
          player: CourseOffering
          role_name: grades
      readings:
        - "{0} receives {1} for {2}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Student_receives_LetterGrade_for_CourseOffering.receives
            - Student_receives_LetterGrade_for_CourseOffering.grades
          id: 00000000-0000-7002-8c53-5a61686f767d

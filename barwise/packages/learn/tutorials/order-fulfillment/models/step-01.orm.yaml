orm_version: "1.1"

model:
  name: "Order Fulfillment"
  domain_context: "order-fulfillment"

  object_types:
    - id: "ot-customer"
      name: "Customer"
      kind: "entity"
      reference_mode: "customer_number"
      definition: "A person or organization that places orders with us."

    - id: "ot-order"
      name: "Order"
      kind: "entity"
      reference_mode: "order_number"
      definition: "A single request to buy, identified by an order number."

    - id: "ot-product"
      name: "Product"
      kind: "entity"
      reference_mode: "product_code"
      definition: "An item we sell, identified by a product code."

    - id: "ot-status"
      name: "OrderStatus"
      kind: "value"
      data_type:
        name: "text"

  fact_types:
    - id: "ft-places"
      name: "Customer places Order"
      roles:
        - id: "r-places-customer"
          player: "ot-customer"
          role_name: "places"
        - id: "r-places-order"
          player: "ot-order"
          role_name: "is placed by"
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"

    - id: "ft-includes"
      name: "Order includes Product"
      roles:
        - id: "r-includes-order"
          player: "ot-order"
          role_name: "includes"
        - id: "r-includes-product"
          player: "ot-product"
          role_name: "is included in"
      readings:
        - "{0} includes {1}"
        - "{1} is included in {0}"

    - id: "ft-status"
      name: "Order has OrderStatus"
      roles:
        - id: "r-status-order"
          player: "ot-order"
          role_name: "has"
        - id: "r-status-value"
          player: "ot-status"
          role_name: "is of"
      readings:
        - "{0} has {1}"

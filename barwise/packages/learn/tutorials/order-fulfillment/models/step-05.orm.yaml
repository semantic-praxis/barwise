orm_version: "4.0"
model:
  name: Order Fulfillment
  domain_context: order-fulfillment
  object_types:
    - id: Customer
      name: Customer
      kind: entity
      reference_mode: customer_number
      definition: A person or organization that places orders with us.
    - id: Order
      name: Order
      kind: entity
      reference_mode: order_number
      definition: A single request to buy, identified by an order number.
    - id: Product
      name: Product
      kind: entity
      reference_mode: product_code
      definition: An item we sell, identified by a product code.
    - id: OrderStatus
      name: OrderStatus
      kind: value
      data_type:
        name: text
  fact_types:
    - id: Customer_places_Order
      name: Customer places Order
      roles:
        - id: Customer_places_Order.places
          player: Customer
          role_name: places
        - id: Customer_places_Order.is_placed_by
          player: Order
          role_name: is placed by
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Customer_places_Order.is_placed_by
          id: Each_Order_is_placed_by_at_most_one_Customer
          minted_from: '{"type":"internal_uniqueness","roles":[[1,"is placed by",{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}]],"fact_type":{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}}'
        - type: mandatory
          role: Customer_places_Order.is_placed_by
          id: Each_Order_is_placed_by_at_least_one_Customer
          minted_from: '{"type":"mandatory","role":[1,"is placed by",{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}],"fact_type":{"name":"Customer places Order","readings":["{0} places {1}","{1} is placed by {0}"],"players":["Customer","Order"]}}'
    - id: Order_includes_Product
      name: Order includes Product
      roles:
        - id: Order_includes_Product.includes
          player: Order
          role_name: includes
        - id: Order_includes_Product.is_included_in
          player: Product
          role_name: is included in
      readings:
        - "{0} includes {1}"
        - "{1} is included in {0}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Order_includes_Product.includes
            - Order_includes_Product.is_included_in
          id: Each_combination_of_Order_and_Product_is_unique_in_Order_includes_Product
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"includes",{"name":"Order includes Product","readings":["{0} includes {1}","{1} is included in {0}"],"players":["Order","Product"]}],[1,"is included in",{"name":"Order includes Product","readings":["{0} includes {1}","{1} is included in {0}"],"players":["Order","Product"]}]],"fact_type":{"name":"Order includes Product","readings":["{0} includes {1}","{1} is included in {0}"],"players":["Order","Product"]}}'
    - id: Order_has_OrderStatus
      name: Order has OrderStatus
      roles:
        - id: Order_has_OrderStatus.has
          player: Order
          role_name: has
        - id: Order_has_OrderStatus.is_of
          player: OrderStatus
          role_name: is of
      readings:
        - "{0} has {1}"
      constraints:
        - type: internal_uniqueness
          roles:
            - Order_has_OrderStatus.has
          id: Each_Order_has_at_most_one_OrderStatus
          minted_from: '{"type":"internal_uniqueness","roles":[[0,"has",{"name":"Order has OrderStatus","readings":["{0} has {1}"],"players":["Order","OrderStatus"]}]],"fact_type":{"name":"Order has OrderStatus","readings":["{0} has {1}"],"players":["Order","OrderStatus"]}}'
  populations:
    - id: Customer_places_Order.population
      fact_type: Customer_places_Order
      instances:
        - id: Customer_places_Order.population.1
          role_values:
            Customer_places_Order.places: C-1001
            Customer_places_Order.is_placed_by: O-501
        - id: Customer_places_Order.population.2
          role_values:
            Customer_places_Order.places: C-1002
            Customer_places_Order.is_placed_by: O-502
      description: Who placed which order
    - id: Order_includes_Product.population
      fact_type: Order_includes_Product
      instances:
        - id: Order_includes_Product.population.1
          role_values:
            Order_includes_Product.includes: O-501
            Order_includes_Product.is_included_in: P-9001
        - id: Order_includes_Product.population.2
          role_values:
            Order_includes_Product.includes: O-501
            Order_includes_Product.is_included_in: P-9002
        - id: Order_includes_Product.population.3
          role_values:
            Order_includes_Product.includes: O-502
            Order_includes_Product.is_included_in: P-9001
      description: What each order contains
    - id: Order_has_OrderStatus.population
      fact_type: Order_has_OrderStatus
      instances:
        - id: Order_has_OrderStatus.population.1
          role_values:
            Order_has_OrderStatus.has: O-501
            Order_has_OrderStatus.is_of: open
        - id: Order_has_OrderStatus.population.2
          role_values:
            Order_has_OrderStatus.has: O-502
            Order_has_OrderStatus.is_of: shipped
      description: Where each order stands

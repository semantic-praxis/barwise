orm_version: "1.0"

model:
  name: "Customer places Order"

  object_types:
    - id: "ot-customer"
      name: "Customer"
      kind: "entity"
      reference_mode: "customer_id"
      definition: "A party that places orders."

    - id: "ot-order"
      name: "Order"
      kind: "entity"
      reference_mode: "order_id"
      definition: "A request a customer places."

  fact_types:
    - id: "ft-places"
      name: "Customer places Order"
      roles:
        - id: "r-places"
          player: "ot-customer"
          role_name: "places"
        - id: "r-placed-by"
          player: "ot-order"
          role_name: "is placed by"
      readings:
        - "{0} places {1}"
        - "{1} is placed by {0}"
      constraints:
        - type: "internal_uniqueness"
          roles: ["r-placed-by"]
        - type: "mandatory"
          role: "r-placed-by"
